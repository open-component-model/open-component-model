# CodeQL SAST Analysis
#
# Runs on a daily schedule and manual dispatch instead of per-PR/push.
# This is sufficient because:
# 1. golangci-lint (with gosec) already runs per-PR and catches pattern-based
#    security issues with fast feedback.
# 2. CodeQL's deeper data-flow/taint analysis is expensive (~20min+)
#    and rarely surfaces issues that golangci-lint misses in day-to-day changes.
# 3. Running daily on the default branch ensures new findings surface within 24h
#    of merge — acceptable latency for the deeper analysis tier.
# 4. workflow_dispatch allows on-demand runs for security-sensitive changes.
name: "CodeQL"

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-go:
    name: "Analyze Go"
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
