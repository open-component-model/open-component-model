name: "GitHub Scripts: Verify"

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-github-scripts.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-github-scripts.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04-arm
    name: Lint & Test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .github/scripts/package.json

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Lint scripts
        working-directory: .github/scripts
        run: npm run lint

      - name: Run tests
        working-directory: .github/scripts
        run: npm test
