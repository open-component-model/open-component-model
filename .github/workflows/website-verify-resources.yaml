name: "Website: Verify Page Resources"

# The link verifier confirms that clickable links resolve to a 200 page, but it
# never checks the resources a page embeds while it renders - images,
# stylesheets, scripts, and the per-version schema files the schema-renderer
# shortcode fetches through `data-schema-url`. A versioned path such as
# `/0.9/schemas/...` that was never published leaves the page at 200 while the
# browser fetch 404s. This job builds the site and fails if any embedded
# resource it checks (src, resource-bearing href, poster, object data, srcset,
# data-schema-url, data-src, data-srcset - not navigational <a href>) is
# missing from the build output.

on:
  push:
    branches:
      - main
      - 'website/**'
    paths:
      - 'website/**'
      - '.github/workflows/website-verify-resources.yaml'
      - 'bindings/go/cli/docs/reference/**'
      - 'bindings/go/**/schemas/**'
      - 'bindings/go/**/resources/**'
      - 'bindings/go/kubernetes/controller/api/v1alpha1/**'
      - 'bindings/go/kubernetes/controller/config/crd/bases/**'
  pull_request:
    branches:
      - main
      - 'website/**'
    paths:
      - 'website/**'
      - '.github/workflows/website-verify-resources.yaml'
      # Schema/CRD sources mounted into the versioned site (see website
      # module.yaml). Broad globs keep this in sync as new binding schemas are
      # added, rather than enumerating each directory.
      - 'bindings/go/cli/docs/reference/**'
      - 'bindings/go/**/schemas/**'
      - 'bindings/go/**/resources/**'
      - 'bindings/go/kubernetes/controller/api/v1alpha1/**'
      - 'bindings/go/kubernetes/controller/config/crd/bases/**'

permissions:
  contents: read

jobs:
  verify-page-resources:
    name: Verify Page Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: website/package.json

      - name: Install deps and Build
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Unit test the resource checker
        working-directory: website
        run: node --test scripts/check-page-resources.test.js

      - name: Verify embedded page resources
        working-directory: website
        run: npm run check:resources
