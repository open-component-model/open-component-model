name: monorepo shared build & publish

# Reusable build & publish chain for the whole monorepo. Owns the dependency
# order across CLI and controller: build (in parallel) → conformance + e2e
# gates (in parallel) → publish to GHCR. Drives daily CI on main/release
# branches and is reused by release.yml for tagged releases.
#
# It has the following stages: build_cli, build_controller (these are executed in parallel)
# from here, if success, conformance and e2e run concurrently, and then finally,
# if required, publish_*. Conformance and e2e are _BOTH_ gates to pushing: if
# either fails there will be nothing in GHCR.

on:
  # No paths filter on push: every push to main/release branches rebuilds and
  # republishes so the floating `main` tag in GHCR tracks HEAD. PRs stay
  # path-gated below to avoid running the full pipeline on unrelated changes.
  push:
    branches:
      - main
      - 'releases/v**'
  pull_request:
    branches:
      - main
      - 'releases/v**'
    paths:
      - 'bindings/go/cli/**'
      - 'bindings/go/kubernetes/controller/**'
      - 'conformance/**'
      - '.github/workflows/cli.yml'
      - '.github/workflows/kubernetes-controller.yml'
      - '.github/workflows/conformance.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/image-scan.yml'
      - '.github/workflows/pipeline.yml'
      - '.env'
      - '.github/stig/**'
      - '.github/scripts/stig-scan.js'
      - '.github/scripts/vex.js'
      - '.github/benchmarks/**'
      - '.github/scripts/chart-benchmarks.js'
  workflow_call:
    inputs:
      ref:
        description: "Ref to build (branch, tag, or sha). Defaults to caller's ref."
        type: string
        required: false
      build_version:
        description: "Override version embedded in the CLI binary via ldflags. Used by release.yml to embed the base version (e.g. v0.5.0) in RC builds."
        type: string
        required: false
    outputs:
      cli_artifact_name:
        description: "CLI artifact name (binaries, their SPDX SBOMs under sbom/, OCI layout) from the build job."
        value: ${{ jobs.build_cli.outputs.artifact_name }}
      cli_version:
        description: "Version computed/embedded for the CLI build."
        value: ${{ jobs.build_cli.outputs.version }}
      cli_image_digest:
        description: "Digest of the pushed CLI OCI image (when published)."
        value: ${{ jobs.publish_cli.outputs.image_digest }}
      controller_version:
        description: "Version computed for the controller build."
        value: ${{ jobs.build_controller.outputs.version }}
      controller_chart_artifact_name:
        description: "Name of the chart artifact (with digest) produced by publish."
        value: ${{ jobs.publish_controller.outputs.chart_artifact_name }}
      controller_image_digest:
        description: "Digest of the pushed controller image."
        value: ${{ jobs.publish_controller.outputs.image_digest }}
      controller_chart_digest:
        description: "Digest of the pushed Helm chart."
        value: ${{ jobs.publish_controller.outputs.chart_digest }}
      vex_artifact:
        description: "Artifact with the OpenVEX document (ocm.openvex.json) the images were scanned with."
        value: ${{ jobs.image_scan.outputs.vex_artifact }}
      cli_image_sbom_artifact:
        description: "Artifact with the per-platform SPDX SBOMs of the pushed CLI image (when published)."
        value: ${{ jobs.publish_cli.outputs.image_sbom_artifact }}
      controller_image_sbom_artifact:
        description: "Artifact with the per-platform SPDX SBOMs of the pushed controller image (when published)."
        value: ${{ jobs.publish_controller.outputs.image_sbom_artifact }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # === This is new: workflow_call wiring ===
  build_cli:
    uses: $/.github/workflows/cli.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ inputs.ref }}
      build_version: ${{ inputs.build_version }}

  build_controller:
    uses: $/.github/workflows/kubernetes-controller.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref }}
  # === workflow_call end ===

  # === This is new, but it replaces conformance and conformance-pr/published in cli.yml + kubernetes-controller.yml ===
  conformance:
    name: Conformance
    needs: [build_cli, build_controller]
    uses: $/.github/workflows/conformance.yml
    with:
      cli_artifact: ${{ needs.build_cli.outputs.artifact_name }}
      cli_version: ${{ needs.build_cli.outputs.version }}
      toolkit_image_artifact: ${{ needs.build_controller.outputs.artifact_name }}
      toolkit_chart_artifact: ${{ needs.build_controller.outputs.chart_pr_artifact }}
      toolkit_version: ${{ needs.build_controller.outputs.version }}
  # === end replace ===

  # === New: E2E lifted out of kubernetes-controller.yml so it runs concurrently
  # with conformance instead of serializing ahead of it. Needs only the
  # controller build; gates publish alongside conformance. ===
  e2e:
    name: E2E
    needs: [build_cli, build_controller]
    uses: $/.github/workflows/e2e.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref }}
      controller_image_artifact: ${{ needs.build_controller.outputs.artifact_name }}
      controller_version: ${{ needs.build_controller.outputs.version }}
      cli_artifact: ${{ needs.build_cli.outputs.artifact_name }}
  # === end ===

  # Image scan of the CLI and controller images built above, per architecture:
  # vulnerabilities (Trivy with govulncheck's OpenVEX), the DISA GPOS SRG as
  # tailored in .github/stig, and the CIS Docker Benchmark; plus the CIS
  # Kubernetes and NSA/CISA benchmarks on the rendered chart. Gates publish.
  image_scan:
    name: Image scan
    needs: [build_cli, build_controller]
    uses: $/.github/workflows/image-scan.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.ref }}
      cli_artifact: ${{ needs.build_cli.outputs.artifact_name }}
      controller_artifact: ${{ needs.build_controller.outputs.artifact_name }}

  # === New this part is a copy from cli.yml::build::branch-check + kubernetes-controller.yml::build::branch-check ===
  # Changes include things for the modified tag regex.
  decide_publish:
    name: Decide Publish
    needs: [conformance, e2e, image_scan]
    runs-on: ubuntu-24.04-arm
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - name: Decide
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_REF: ${{ inputs.ref }}
        with:
          script: |
            const ref = process.env.INPUT_REF || process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
            core.setOutput('ref', ref);
            if (context.eventName === 'pull_request') {
              core.setOutput('publish', 'false');
              return;
            }
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            // Matches version refs like: v1.2, v1.2.3, v1.2.3-rc.1, v0.7.0-alpha, v10.0.0-beta.2+build5
            const eligible = ref === defaultBranch || /^v\d+\.\d+(\.\d+)?(-.*)?$/.test(ref);
            core.setOutput('publish', eligible ? 'true' : 'false');
  # === cli.yml::build::branch-check + kubernetes-controller.yml::build::branch-check ===

  # === This is from cli.yml::publish verbatim a date on conformance ===
  publish_cli:
    name: Publish CLI
    needs: [build_cli, decide_publish, image_scan]
    if: ${{ needs.decide_publish.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      image_digest: ${{ steps.digest.outputs.digest }}
      image_sbom_artifact: image-sbom-cli
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build_cli.outputs.artifact_name }}

      - name: Set LAYOUT
        env:
          LAYOUT: ${{ github.workspace }}/oci/cli.tar
        run: |
          test -e "$LAYOUT" || exit 1
          echo "LAYOUT=$LAYOUT" >> "$GITHUB_ENV"

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set TARGET_REPO
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "TARGET_REPO=${REGISTRY}/${OWNER,,}/cli" >> "$GITHUB_ENV"

      - name: Push OCI image
        env:
          VERSION: ${{ needs.build_cli.outputs.version }}
        run: oras cp --from-oci-layout "${LAYOUT}:${VERSION}" "${TARGET_REPO}:${VERSION}"

      - name: Tag image with main floating tag
        if: ${{ needs.decide_publish.outputs.ref == 'main' }}
        env:
          VERSION: ${{ needs.build_cli.outputs.version }}
        run: oras tag "${TARGET_REPO}:${VERSION}" "main"

      - name: Resolve digest
        id: digest
        env:
          VERSION: ${{ needs.build_cli.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(oras resolve "${TARGET_REPO}:${VERSION}")"
          [[ "$digest" == sha256:* ]] || { echo "::error::oras resolve returned unexpected digest for ${TARGET_REPO}:${VERSION}: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest OCI image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: ${{ env.TARGET_REPO }}
          push-to-registry: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate image SBOM (linux/amd64)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: syft scan "registry:${TARGET_REPO}@${DIGEST}" --platform linux/amd64 -o spdx-json=ocm-cli-image-linux-amd64.spdx.json

      - name: Generate image SBOM (linux/arm64)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: syft scan "registry:${TARGET_REPO}@${DIGEST}" --platform linux/arm64 -o spdx-json=ocm-cli-image-linux-arm64.spdx.json

      - name: Attest image SBOM (linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: ${{ env.TARGET_REPO }}
          sbom-path: ocm-cli-image-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest image SBOM (linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: ${{ env.TARGET_REPO }}
          sbom-path: ocm-cli-image-linux-arm64.spdx.json
          push-to-registry: true

      # Release assets and component-version resources (release.yml).
      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-sbom-cli
          retention-days: 1
          path: ocm-cli-image-linux-*.spdx.json
          if-no-files-found: error

      - name: Download OpenVEX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.image_scan.outputs.vex_artifact }}
          path: tmp/vex

      # The OpenVEX document the image was scanned with, so consumers' scanners
      # apply the same reachability verdicts.
      - name: Attest OpenVEX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: ${{ env.TARGET_REPO }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: tmp/vex/ocm.openvex.json
          push-to-registry: true

      # The VEX statements are about the Go modules in bindings/go, which the
      # binaries are built from just like the image.
      - name: Attest OpenVEX (binaries)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/ocm-*
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: tmp/vex/ocm.openvex.json
  # === cli.yml::publish ===

  # === Same as above but for Kubernetes publish. ===
  publish_controller:
    name: Publish Controller
    needs: [build_controller, decide_publish, image_scan]
    if: ${{ needs.decide_publish.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      image_digest: ${{ steps.image-digest.outputs.digest }}
      chart_digest: ${{ steps.chart-digest.outputs.digest }}
      chart_artifact_name: controller-chart-${{ needs.build_controller.outputs.version }}
      image_sbom_artifact: image-sbom-controller
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CONTROLLER_DIR: bindings/go/kubernetes/controller
      REF: ${{ needs.decide_publish.outputs.ref }}
    steps:
      - name: Compute image refs (lowercase owner)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="${OWNER,,}"
          {
            echo "IMAGE_NAME=ghcr.io/$OWNER/kubernetes/controller"
            echo "CHART_REPO=ghcr.io/$OWNER/kubernetes/controller/chart"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          sparse-checkout: |
            ${{ env.CONTROLLER_DIR }}
            Taskfile.yml
            .env
          persist-credentials: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.x

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download controller image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build_controller.outputs.artifact_name }}
          path: ${{ env.CONTROLLER_DIR }}/tmp/oci

      - name: Extract OCI layout
        working-directory: ${{ env.CONTROLLER_DIR }}
        run: task oci/extract TAR_PATH=tmp/oci/controller.tar OUTPUT_DIR=tmp/oci-dir

      - name: Push image from OCI layout
        working-directory: ${{ env.CONTROLLER_DIR }}
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
        run: oras cp --from-oci-layout tmp/oci-dir:${VERSION} ${IMAGE_NAME}:${VERSION}

      - name: Tag image with main floating tag
        if: ${{ env.REF == 'main' }}
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
        run: oras tag "${IMAGE_NAME}:${VERSION}" "main"

      - name: Resolve image digest
        id: image-digest
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(oras resolve "${IMAGE_NAME}:${VERSION}")"
          [[ "$digest" == sha256:* ]] || { echo "::error::oras resolve returned unexpected digest for ${IMAGE_NAME}:${VERSION}: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
          push-to-registry: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate image SBOM (linux/amd64)
        env:
          DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: syft scan "registry:${IMAGE_NAME}@${DIGEST}" --platform linux/amd64 -o spdx-json=ocm-controller-image-linux-amd64.spdx.json

      - name: Generate image SBOM (linux/arm64)
        env:
          DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: syft scan "registry:${IMAGE_NAME}@${DIGEST}" --platform linux/arm64 -o spdx-json=ocm-controller-image-linux-arm64.spdx.json

      - name: Attest image SBOM (linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
          sbom-path: ocm-controller-image-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest image SBOM (linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
          sbom-path: ocm-controller-image-linux-arm64.spdx.json
          push-to-registry: true

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-sbom-controller
          retention-days: 1
          path: ocm-controller-image-linux-*.spdx.json
          if-no-files-found: error

      - name: Download OpenVEX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.image_scan.outputs.vex_artifact }}
          path: tmp/vex

      - name: Attest OpenVEX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ steps.image-digest.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: tmp/vex/ocm.openvex.json
          push-to-registry: true

      - name: Package and push chart with digest
        working-directory: ${{ env.CONTROLLER_DIR }}
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.digest }}
        run: |
          task helm/package VERSION="${VERSION}" APP_VERSION="${VERSION}" IMAGE_DIGEST="${IMAGE_DIGEST}" IMAGE_REPOSITORY="${IMAGE_NAME}"
          task helm/push VERSION="${VERSION}" REGISTRY="${IMAGE_NAME}"

      - name: Tag chart with main floating tag
        if: ${{ env.REF == 'main' }}
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
        run: oras tag "${CHART_REPO}:${VERSION}" "main"

      - name: Resolve chart digest
        id: chart-digest
        env:
          VERSION: ${{ needs.build_controller.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(oras resolve "${CHART_REPO}:${VERSION}")"
          [[ "$digest" == sha256:* ]] || { echo "::error::oras resolve returned unexpected digest for ${CHART_REPO}:${VERSION}: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          subject-digest: ${{ steps.chart-digest.outputs.digest }}
          subject-name: ${{ env.CHART_REPO }}
          push-to-registry: true

      - name: Upload chart artifact (with digest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-chart-${{ needs.build_controller.outputs.version }}
          retention-days: 1
          path: ${{ env.CONTROLLER_DIR }}/dist/chart-*.tgz
          if-no-files-found: error
  # === end ===
