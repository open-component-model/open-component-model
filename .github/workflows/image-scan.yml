name: Image scan

on:
  # Reusable scan of the CLI (default and slim) and controller images, invoked by
  # the build & publish pipeline (pipeline.yml) with the image artifacts it built. Each
  # architecture is scanned for vulnerabilities (Trivy, with that architecture's
  # OpenVEX document from govulncheck; findings warn, they do not fail).
  workflow_call:
    inputs:
      ref:
        description: "The ref to check out the scan configuration from. Defaults to the current ref."
        type: string
        required: false
      cli_artifact:
        description: "Artifact with the CLI OCI images (oci/cli.tar and oci/cli-slim.tar)."
        type: string
        required: true
      controller_artifact:
        description: "Artifact with the controller OCI image (controller.tar)."
        type: string
        required: true
    outputs:
      vex_artifact_prefix:
        description: "Prefix of the per-architecture OpenVEX artifacts <prefix>-<arch> (arm64, amd64), each with the ocm.openvex.json its images were scanned with."
        value: openvex

permissions:
  contents: read

jobs:
  # govulncheck knows whether vulnerable code is reachable; image scanners only
  # see module versions. The OpenVEX document carries govulncheck's verdicts to
  # Trivy, so the image scan reports the same findings as govulncheck and none
  # that it already ruled out. cosign is not built from this repository; its
  # release attests the verdicts of its own govulncheck run, which are verified
  # and merged in, scoped to the cosign binary.
  # Reachability depends on the build configuration (GOOS/GOARCH select files and
  # call paths), so each architecture gets its own document, analyzed with the
  # images' build settings, and only that architecture's images are scanned with it.
  vex:
    name: OpenVEX (${{ matrix.arch }})
    # govulncheck analyzes the target given by GOOS/GOARCH, so amd64 is analyzed on the arm64 runner.
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            bindings/go
            .env
          persist-credentials: false

      # The cosign image both images copy cosign from (pinned by digest in the CLI
      # Containerfile; pin_sync_test.go keeps the controller Dockerfile on the same
      # release). Only an attestation signed by the cosign release workflow is used.
      - name: Fetch cosign OpenVEX attestation
        id: cosign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(sed -n 's/^FROM \(ghcr\.io\/open-component-model\/cosign\):[^@ ]*\(@sha256:[a-f0-9]\{64\}\) AS cosign$/\1\2/p' bindings/go/cli/Containerfile)"
          [[ -n "$ref" ]] || { echo "::error::no digest-pinned cosign stage in bindings/go/cli/Containerfile"; exit 1; }
          mkdir -p tmp/vex
          gh attestation verify "oci://${ref}" --bundle-from-oci \
            --repo open-component-model/cosign \
            --signer-workflow open-component-model/cosign/.github/workflows/ocm-release.yml \
            --predicate-type https://openvex.dev/ns \
            --format json > tmp/vex/cosign-attestation.json
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      # Same build settings as the ocm and manager binaries in the images
      # (bindings/go/cli/Taskfile.yml, controller Dockerfile). govulncheck is built
      # for the runner first: under `go run`, GOARCH would apply to it, too.
      # OpenVEX output exits 0 with findings; its statements carry the reachability verdicts.
      - name: Run govulncheck
        id: govulncheck
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          source .env
          GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # In the module directory, so the go command (and the stdlib version
          # govulncheck checks) follows its toolchain directive.
          cd bindings/go
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" GOFIPS140="${GOFIPS140}" \
            "${RUNNER_TEMP}/bin/govulncheck" -format openvex ./... > "${GITHUB_WORKSPACE}/tmp/vex/govulncheck.openvex.json"
          echo "main_module=$(go list -m)" >> "$GITHUB_OUTPUT"

      # govulncheck names every product "Unknown Product" and path-escapes module
      # purls (pkg:golang/golang.org%2Fx%2Fcrypto), so Trivy would match none of its
      # statements. Each statement is scoped to the main module of the binary it is
      # about (OCM's, analyzed here, or cosign's, from its attestation), with the
      # vulnerable modules as subcomponents: Trivy sees the main module as the parent
      # of its dependencies in a Go binary's build information, so a statement never
      # covers the same module inside another binary of the image. Attested
      # statements count only if their product names the pinned cosign image digest.
      - name: Build OpenVEX
        env:
          ARCH: ${{ matrix.arch }}
          OCM_PRODUCT: pkg:golang/${{ steps.govulncheck.outputs.main_module }}
          # Main module of the cosign binary, as scanners see it in its build information.
          COSIGN_PRODUCT: pkg:golang/github.com/sigstore/cosign/v3
          COSIGN_REF: ${{ steps.cosign.outputs.ref }}
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile govulncheck tmp/vex/govulncheck.openvex.json \
            --slurpfile attested tmp/vex/cosign-attestation.json \
            --arg id "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/vex/linux/${ARCH}" \
            --arg author "${GITHUB_REPOSITORY}" \
            --arg ocm "${OCM_PRODUCT}" \
            --arg cosign "${COSIGN_PRODUCT}" \
            --arg ref "${COSIGN_REF}" '
            def scope($product):
              .products = [{"@id": $product, subcomponents: ([.products[].subcomponents[]? | {"@id": (."@id" | gsub("%2F"; "/"))}] | unique)}]
              | if .status == "affected" then .action_statement //= "The vulnerable code is called; see the govulncheck report." end;
            ($ref | split("@")[1]) as $digest
            | $govulncheck[0] + {"@id": $id, author: $author}
            | .statements |= map(scope($ocm))
            | .statements += [$attested[][].verificationResult.statement.predicate.statements[]?
                | .products |= map(select(."@id" | split("@")[1] // "" | split("?")[0] | sub("%3A"; ":") == $digest))
                | select(any(.products[]; .subcomponents | length > 0))
                | scope($cosign)
                | .status_notes = "From the verified OpenVEX attestation of \($ref)."]
          ' > tmp/vex/ocm.openvex.json
          attested="$(jq '[.[].verificationResult.statement.predicate.statements[]?] | length' tmp/vex/cosign-attestation.json)"
          imported="$(jq --arg p "${COSIGN_PRODUCT}" '[.statements[] | select(.products[0]."@id" == $p)] | length' tmp/vex/ocm.openvex.json)"
          if [[ "$imported" -ne "$attested" ]]; then
            echo "::warning::${COSIGN_REF}: imported ${imported} of ${attested} attested statements; the others name no module of this image digest"
          fi
          {
            echo "### 📄 OpenVEX from govulncheck (linux/${ARCH})"
            echo
            echo "| Advisory | Status | Binary (main module) | Modules |"
            echo "| --- | --- | --- | --- |"
            jq -r '.statements[] | "| \([.vulnerability.name] + (.vulnerability.aliases // []) | join(", ")) | \(.status)\(if .justification then " (\(.justification))" else "" end) | \(.products[0]."@id") | \([.products[0].subcomponents[]."@id"] | join(", ")) |"' tmp/vex/ocm.openvex.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenVEX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openvex-${{ matrix.arch }}
          path: tmp/vex/
          if-no-files-found: error

  scan:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: vex
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [cli, cli-slim, controller]
        # The scans only read the image's files, so amd64 is scanned on the arm64 runner.
        arch: [arm64, amd64]
        include:
          - image: cli
            artifact: ${{ inputs.cli_artifact }}
            oci_tar: oci/cli.tar
          - image: cli-slim
            artifact: ${{ inputs.cli_artifact }}
            oci_tar: oci/cli-slim.tar
          - image: controller
            artifact: ${{ inputs.controller_artifact }}
            oci_tar: controller.tar
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: tmp/artifact

      - name: Download OpenVEX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openvex-${{ matrix.arch }}
          path: tmp/vex

      - name: Ensure skopeo is installed
        run: command -v skopeo || { sudo apt-get update -qq && sudo apt-get install -yqq skopeo; }

      - name: Load image
        env:
          OCI_TAR: ${{ matrix.oci_tar }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          skopeo --override-arch "${ARCH}" --override-os linux copy \
            "oci-archive:tmp/artifact/${OCI_TAR}" "docker-daemon:ocm-scan:${IMAGE}-${ARCH}"
          mkdir -p "tmp/image-scan/${IMAGE}-${ARCH}"

      # Reports, but does not fail on, vulnerabilities this architecture's OpenVEX
      # document does not mark as not_affected. Each statement applies to one binary: OCM's own
      # (the entrypoint), from govulncheck, or cosign, from its release's attested
      # VEX. What remains in OCM's binary is reachable per govulncheck. They show
      # up as warning annotations and in the job summary.
      # Nothing is uploaded to code scanning, so Dependabot alerts stay the only
      # alert surface.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: tmp/vex/ocm.openvex.json
        with:
          image-ref: ocm-scan:${{ matrix.image }}-${{ matrix.arch }}
          scanners: vuln
          exit-code: '0'
          format: json
          output: tmp/image-scan/${{ matrix.image }}-${{ matrix.arch }}/trivy.json

      - name: Vulnerability scan summary
        id: vulns
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          report="tmp/image-scan/${IMAGE}-${ARCH}/trivy.json"
          [[ -s "$report" ]] || { echo "::error::Trivy wrote no report for ${IMAGE} (linux/${ARCH})"; exit 1; }
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🔎 Vulnerability scan: ${IMAGE} (linux/${ARCH})"
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No vulnerabilities beyond those the OpenVEX document marks as not_affected."
            else
              echo "⚠️ ${count} vulnerabilities (do not block publishing). Findings in OCM's own binary are reachable per govulncheck; findings in other binaries (cosign) are not ruled out by the OpenVEX their release attests:"
              echo
              echo "| Binary | ID | Severity | Package | Installed | Fixed | Title |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "| \($t) | \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") | \(.Title // "" | gsub("\\|"; "\\|")) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails visibly without failing the job, so findings do not block PRs or
      # publishing. A broken scan still fails the job in the step above.
      - name: No reachable vulnerabilities
        if: ${{ !cancelled() && steps.vulns.outputs.count != '' }}
        continue-on-error: true
        env:
          COUNT: ${{ steps.vulns.outputs.count }}
        run: |
          [[ "$COUNT" -eq 0 ]] && exit 0
          echo "${COUNT} vulnerabilities, listed with their binary in the job summary."
          exit 1

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-scan-${{ matrix.image }}-${{ matrix.arch }}
          path: tmp/image-scan/${{ matrix.image }}-${{ matrix.arch }}
          if-no-files-found: ignore
