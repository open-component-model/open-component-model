name: Image scan

# Reusable: pipeline.yml scans the CLI (default, slim) and controller images it
# built, per architecture: with Trivy and govulncheck's OpenVEX (findings warn;
# a broken scan fails), against the DISA GPOS SRG as tailored in .github/stig,
# and against the CIS Docker Benchmark (dockle). STIG and CIS findings fail.
on:
  workflow_call:
    inputs:
      ref:
        description: "The ref to check out the scan configuration from. Defaults to the current ref."
        type: string
        required: false
      cli_artifact:
        description: "Artifact with the CLI OCI images (oci/cli.tar and oci/cli-slim.tar)."
        type: string
        required: true
      controller_artifact:
        description: "Artifact with the controller OCI image (controller.tar)."
        type: string
        required: true
    outputs:
      vex_artifact_prefix:
        description: "Prefix of the per-architecture OpenVEX artifacts <prefix>-<arch> (arm64, amd64), each with the ocm.openvex.json its images were scanned with."
        value: ${{ jobs.vex.outputs.vex_artifact_prefix }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  vex:
    name: OpenVEX
    uses: $/.github/workflows/govulncheck.yml
    with:
      ref: ${{ inputs.ref }}

  scan:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: vex
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [cli, cli-slim, controller]
        arch: [arm64, amd64]
        # containerfile: its digest-pinned "certs" stage is the expected source
        # of the image's CA bundle.
        include:
          - image: cli
            artifact: ${{ inputs.cli_artifact }}
            oci_tar: oci/cli.tar
            containerfile: bindings/go/cli/Containerfile
          - image: cli-slim
            artifact: ${{ inputs.cli_artifact }}
            oci_tar: oci/cli-slim.tar
            containerfile: bindings/go/cli/Containerfile
          - image: controller
            artifact: ${{ inputs.controller_artifact }}
            oci_tar: controller.tar
            containerfile: bindings/go/kubernetes/controller/Dockerfile
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      CONTAINERFILE: ${{ matrix.containerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            .github/stig
            .env
            ${{ matrix.containerfile }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Load .env
        run: grep -E '^(TRIVY_VERSION|OPENSCAP_IMAGE|DOCKLE_IMAGE)=' .env >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: tmp/artifact

      - name: Download OpenVEX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.vex.outputs.vex_artifact_prefix }}-${{ matrix.arch }}
          path: tmp/vex

      # Trivy scans the first manifest of a layout and ignores --platform, so the
      # layout's index is narrowed to this architecture.
      - name: Extract image layout
        env:
          OCI_TAR: ${{ matrix.oci_tar }}
        run: |
          mkdir -p tmp/layout
          tar -xf "tmp/artifact/${OCI_TAR}" -C tmp/layout
          jq --arg arch "$ARCH" '.manifests |= map(select(.platform.os == "linux" and .platform.architecture == $arch))' \
            "tmp/layout/blobs/$(jq -r '.manifests[0].digest | sub(":"; "/")' tmp/layout/index.json)" > tmp/index.json
          mv tmp/index.json tmp/layout/index.json

      - name: Ensure skopeo is installed
        run: command -v skopeo || { sudo apt-get update -qq && sudo apt-get install -yqq skopeo; }

      # The STIG scan and dockle read the image from the docker daemon. Neither
      # runs it, so amd64 is scanned on the arm64 runner too.
      - name: Load image
        run: skopeo copy oci:tmp/layout "docker-daemon:ocm-scan:${IMAGE}-${ARCH}"

      # Nothing goes to code scanning: Dependabot alerts stay the only alert surface.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: tmp/vex/ocm.openvex.json
        with:
          version: ${{ env.TRIVY_VERSION }}
          input: tmp/layout
          scanners: vuln
          exit-code: '0'
          format: json
          output: trivy.json

      - name: Vulnerability scan summary
        id: vulns
        run: |
          jq -r '"count=\([.Results[]?.Vulnerabilities[]?] | length)"' trivy.json >> "$GITHUB_OUTPUT"
          jq -r '"### 🔎 Vulnerability scan: \($ENV.IMAGE) (linux/\($ENV.ARCH))\n",
            if [.Results[]?.Vulnerabilities[]?] == [] then "No vulnerabilities beyond those the OpenVEX document marks as not_affected."
            else "Not ruled out by the OpenVEX document: for the OCM binary, govulncheck found the code reachable or does not know the advisory; for cosign, its attested OpenVEX does not cover it.\n\n| Binary | ID | Severity | Package | Installed | Fixed | Title |\n| --- | --- | --- | --- | --- | --- | --- |",
              (.Results[]? | .Target as $t | .Vulnerabilities[]? | "| \($t) | \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") | \(.Title // "" | gsub("\\|"; "\\|")) |")
            end' trivy.json >> "$GITHUB_STEP_SUMMARY"

      - name: No vulnerabilities (see job summary)
        if: steps.vulns.outputs.count != '0'
        continue-on-error: true
        run: exit 1

      # DISA GPOS SRG as tailored in .github/stig, plus OCM's supplement for the
      # deselected rules, evaluated offline on the image's exported root
      # filesystem. Extracting it as root in the scanner keeps ownership and
      # setuid/setgid bits. Fails on any failed rule of either evaluation.
      - name: STIG scan (DISA GPOS SRG)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p stig
          docker export "$(docker create "ocm-scan:${IMAGE}-${ARCH}" /x)" |
            docker run --rm -i -u 0:0 -e IMAGE -v "$PWD/.github/stig:/stig:ro" -v "$PWD/stig:/out" \
              --entrypoint /bin/sh "$OPENSCAP_IMAGE" -euc '
                mkdir /rootfs
                tar -C /rootfs -xpf -
                # Added to every container by docker create/export, not image content.
                rm -rf /rootfs/.dockerenv /rootfs/etc/hosts /rootfs/etc/hostname \
                  /rootfs/etc/resolv.conf /rootfs/etc/mtab /rootfs/dev /rootfs/proc /rootfs/sys
                export OSCAP_PROBE_ROOT=/rootfs
                rc=0
                oscap xccdf eval \
                  --tailoring-file /stig/tailoring.xml --profile xccdf_software.ocm_profile_gpos-container \
                  --results /out/gpos-results.xml --report /out/gpos-report.html \
                  /usr/share/xml/scap/ssg/content/ssg-chainguard-gpos-ds.xml || rc=$?
                oscap xccdf eval --profile "xccdf_software.ocm_profile_${IMAGE}" \
                  --results /out/ocm-results.xml --report /out/ocm-report.html \
                  /stig/ocm-supplement-xccdf.xml || rc=$?
                exit "$rc"'

      # The supplement's checks that OVAL cannot do: OVAL reads no binaries and
      # no values from outside the scanned root filesystem.
      - name: Image provenance (FIPS module, CA bundle)
        if: ${{ !cancelled() }}
        run: |
          ref="ocm-scan:${IMAGE}-${ARCH}"
          entrypoint="$(docker image inspect -f '{{index .Config.Entrypoint 0}}' "$ref")"
          c="$(docker create "$ref" /x)"
          docker cp -q "$c:$entrypoint" tmp/entrypoint
          docker cp -q "$c:/etc/ssl/certs/ca-certificates.crt" tmp/ca.crt

          # Go build information, as `go version -m` shows it.
          grep -aqP '^build\tGOFIPS140=v\S+$' tmp/entrypoint ||
            { echo "::error::$entrypoint is not built with GOFIPS140=v<version>"; exit 1; }
          grep -aqP '^build\tDefaultGODEBUG=(.*,)?fips140=(on|only)(,|$)' tmp/entrypoint ||
            { echo "::error::$entrypoint does not default to fips140=on"; exit 1; }

          base="$(sed -nE 's/^FROM .* (ghcr\.io\/gardenlinux\/\S+@sha256:[0-9a-f]{64}) AS certs$/\1/p' "$CONTAINERFILE")"
          [[ -n "$base" ]] || { echo "::error::no digest-pinned Garden Linux certs stage in $CONTAINERFILE"; exit 1; }
          docker run --rm --platform "linux/$(docker version -f '{{.Server.Arch}}')" --entrypoint cat "$base" \
            /etc/ssl/certs/ca-certificates.crt > tmp/base-ca.crt
          cmp -s tmp/ca.crt tmp/base-ca.crt ||
            { echo "::error::CA bundle differs from the one in $base"; exit 1; }

      # CIS Docker Benchmark section 4. Fails on WARN and FATAL; INFO (content
      # trust, HEALTHCHECK) and SKIP (no /etc/passwd in scratch) do not fail.
      - name: CIS Docker Benchmark (dockle)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$DOCKLE_IMAGE" \
            --exit-code 1 --exit-level warn "ocm-scan:${IMAGE}-${ARCH}"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-scan-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            trivy.json
            stig/
          if-no-files-found: ignore
