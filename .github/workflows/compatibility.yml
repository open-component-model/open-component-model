name: OCM v1 compatibility

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'bindings/go/**'
      - 'Taskfile.yml'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

jobs:
  ocmv1:
    name: OCM v1 to v2
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test OCM v1 to v2 compatibility
        run: task compat/ocmv1:test
