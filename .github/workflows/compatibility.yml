name: OCM v1 compatibility

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref used to build the CLI"
        type: string
        required: true
      cli_artifact:
        description: "Artifact name containing the prebuilt OCM v2 CLI binaries"
        type: string
        required: true

permissions:
  contents: read

jobs:
  ocmv1:
    name: OCM v1 to v2
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download OCM v2 CLI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.cli_artifact }}
          path: bindings/go/cli/tmp
      - name: Make OCM v2 CLI executable
        run: chmod +x bindings/go/cli/tmp/bin/ocm-linux-arm64
      - name: Test OCM v1 to v2 compatibility
        run: task compat/ocmv1:test/prebuilt OCM_V2_BIN="${{ github.workspace }}/bindings/go/cli/tmp/bin/ocm-linux-arm64"
