name: CI

on:
  pull_request:
  push:
    branches:
    - main

# Single Go module repo: bindings/go is the only buildable/testable module.
# conformance/scenarios/sovereign/components/notes is a lint-only fixture module.
# Scopes are static: push to main runs everything, PRs run unit/integration tests only
# when bindings/go, the shared task plumbing (Taskfile.yml, reuse.Taskfile.yml), or ci.yml
# changes. Lint runs for the changed module only, or for all modules when golangci.yml /
# .env / ci.yml changes.

permissions:
  contents: read

jobs:
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: read
    outputs:
      run_go: ${{ steps.compute.outputs.run_go }}
      lint_matrix: ${{ steps.compute.outputs.lint_matrix }}
      dependency_table_changed: ${{ steps.filter.outputs.dependency_table }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - 'bindings/go/**'
              # Task plumbing that the Go test/build tasks resolve through
              - 'Taskfile.yml'
              - 'reuse.Taskfile.yml'
            fixture:
              - 'conformance/scenarios/sovereign/components/notes/**'
            lint_config:
              - '.env'
              - 'golangci.yml'
            ci:
              - '.github/workflows/ci.yml'
            dependency_table:
              - 'golangci.yml'
              - 'tools.Taskfile.yml'
              - '.github/scripts/dependency-table.js'
              - '.github/scripts/package.json'
              - '.github/scripts/package-lock.json'
              - 'docs/dependency-table.md'
      - name: Compute scopes
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GO_CHANGED: ${{ steps.filter.outputs.go }}
          FIXTURE_CHANGED: ${{ steps.filter.outputs.fixture }}
          LINT_CONFIG_CHANGED: ${{ steps.filter.outputs.lint_config }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        with:
          script: |
            const GO_MODULE = 'bindings/go';
            const FIXTURE_MODULE = 'conformance/scenarios/sovereign/components/notes';
            const ALL_MODULES = [GO_MODULE, FIXTURE_MODULE];
            const isPush = context.eventName === 'push';
            const ciChanged = process.env.CI_CHANGED === 'true';
            const goChanged = process.env.GO_CHANGED === 'true';
            const fixtureChanged = process.env.FIXTURE_CHANGED === 'true';
            const lintConfigChanged = process.env.LINT_CONFIG_CHANGED === 'true';

            const runGo = isPush || ciChanged || goChanged;

            const lint = [];
            if (isPush || ciChanged || lintConfigChanged) {
              lint.push(...ALL_MODULES);
            } else {
              if (goChanged) lint.push(GO_MODULE);
              if (fixtureChanged) lint.push(FIXTURE_MODULE);
            }

            core.setOutput('run_go', runGo);
            core.setOutput('lint_matrix', JSON.stringify(lint));
            await core.summary
              .addRaw('### CI Scope\n\n')
              .addRaw(`**build/test bindings/go:** ${runGo}\n\n`)
              .addRaw(`**lint:** ${lint.length ? lint.map(m => `- \`${m}\``).join('\n') : '_None_'}\n`)
              .write();

  golangci_lint_verify:
    name: "golangci-lint-verify"
    runs-on: ubuntu-24.04-arm
    permissions:
      # Optional: allow write access to checks to allow the action to annotate code in the PR.
      # Automatically downgraded to read-only for pull requests from forks
      # https://github.blog/changelog/2021-04-20-github-actions-control-permissions-for-github_token/#setting-permissions-in-the-workflow
      # but are kept for runs on main or on pull requests on branches in the repo (renovate).
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            golangci.yml
            .env
          persist-credentials: false
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read tool versions
        id: versions
        run: |
          source .env
          echo "golangci_lint=${GOLANGCI_LINT_VERSION}" >> $GITHUB_OUTPUT
      - name: Verify the golangci-lint config
        run:
          task tools:golangci-lint/verify

  dependency_table_verify:
    name: "dependency-table-verify"
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: ${{ needs.changes.outputs.dependency_table_changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            Taskfile.yml
            tools.Taskfile.yml
            golangci.yml
            docs/dependency-table.md
            .github/scripts/dependency-table.js
            .github/scripts/package.json
            .github/scripts/package-lock.json
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify dependency table is in sync
        run: |
          task tools:dependency-table/verify || {
            echo "::error::docs/dependency-table.md is out of sync. Run 'task tools:dependency-table/generate' and commit the result."
            exit 1
          }

  golangci_lint:
    name: "golangci-lint"
    needs:
     - changes
     - golangci_lint_verify
    runs-on: ubuntu-24.04-arm
    permissions:
      # Optional: allow write access to checks to allow the action to annotate code in the PR.
      # Automatically downgraded to read-only for pull requests from forks
      # https://github.blog/changelog/2021-04-20-github-actions-control-permissions-for-github_token/#setting-permissions-in-the-workflow
      # but are kept for runs on main or on pull requests on branches in the repo (renovate).
      checks: write
    if: ${{ fromJSON(needs.changes.outputs.lint_matrix)[0] != null }}
    strategy:
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ matrix.module }}
            golangci.yml
            .env
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '${{ github.workspace }}/${{ matrix.module }}/go.mod'
          cache-dependency-path: '${{ github.workspace }}/${{ matrix.module }}/go.sum'
      - name: Read tool versions
        id: versions
        run: |
          source .env
          echo "golangci_lint=${GOLANGCI_LINT_VERSION}" >> $GITHUB_OUTPUT
      - name: golangci-lint ${{ matrix.module }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          verify: 'false' # we verify in a separate command ONCE instead of every run on every module
          version: ${{ steps.versions.outputs.golangci_lint }}
          working-directory: ${{ github.workspace }}/${{ matrix.module }}
          args: --timeout 10m --config=${{ github.workspace }}/golangci.yml

  run_integration_tests:
    name: "Integration Tests"
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: ${{ needs.changes.outputs.run_go == 'true' }}
    env:
      # All packages of one `go test ./...` share a single testcontainers reaper, which
      # reaps and removes itself 10s after the last package disconnects — the next package
      # then blocks 60s on the removed container and fails. Outlive the suite instead.
      RYUK_RECONNECTION_TIMEOUT: 30m
    steps:
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '${{ github.workspace }}/bindings/go/go.mod'
          cache-dependency-path: '${{ github.workspace }}/bindings/go/go.sum'
      - name: Run Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: task bindings/go:test/integration

  run_unit_tests:
    name: "Unit Tests"
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: ${{ needs.changes.outputs.run_go == 'true' }}
    steps:
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            bindings/go
            reuse.Taskfile.yml
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '${{ github.workspace }}/bindings/go/go.mod'
          cache-dependency-path: '${{ github.workspace }}/bindings/go/go.sum'
      - name: Run Tests
        run: task bindings/go:test

  generate:
    runs-on: ubuntu-24.04-arm
    name: "Code Generation"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Go (required by some generators)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ github.workspace }}/bindings/go/go.mod
          cache-dependency-path: |
            ${{ github.workspace }}/bindings/go/go.sum
      - name: Run Code Generation
        run: task generate
      - name: Ensure Clean Target Repository
        run: |
          gitStatus="$(git status --porcelain)"
          if [[ -z "${gitStatus}" ]]; then
              exit 0
          fi
          echo "${gitStatus}"
          exit 1

  # failure aggregation job
  # Lint runs as a conditional matrix, so it cannot be used directly for required status checks in github.
  # However we can add a failure step that can get triggered if any dependency fails or is cancelled.
  # If this is the case, this job will fail. If CI is successful, the CI Completion Check will be skipped.
  # see https://github.com/orgs/community/discussions/60792 for details on why this is needed
  check-completion:
    name: "Completion"
    runs-on: ubuntu-24.04-arm
    needs:
      - changes
      - generate
      - run_unit_tests
      - run_integration_tests
      - golangci_lint
      - dependency_table_verify
    if: ${{ failure() }}
    steps:
      - name: Some CI step failed or was cancelled!
        run: exit 1
