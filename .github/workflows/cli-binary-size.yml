name: cli binary size guard

# Guards against unreviewed growth of the `ocm` CLI binary. On every push to
# main (and on manual dispatch) the job builds the CLI at the new tip and at
# the last commit where this check passed, compares the two stripped binary
# sizes on one runner with one toolchain, and fails if the new binary grew by
# more than the threshold. The baseline is the head commit of the most recent
# successful run of this workflow on main, so after a failure every later push
# keeps failing until a maintainer approves the growth with a manual dispatch.
# If the baseline commit no longer builds (for example a lowered toolchain pin
# with GOTOOLCHAIN=local), a dispatch with reset_baseline=true accepts the
# current size as a new baseline.
#
# The default threshold of 10 percent is justified by a one-year weekly
# measurement (recorded in the pull request that introduced this workflow):
# 10 percent sits above the 95th percentile of same-toolchain week-over-week
# growth, so normal feature work passes while a rare large jump is held for a
# human to judge.

on:
  push:
    branches:
      - main
    paths:
      - bindings/go/**
      - .env # GOFIPS140 lives here and changes the binary
      - .github/workflows/cli-binary-size.yml
  workflow_dispatch:
    inputs:
      threshold_percent:
        description: "Maximum allowed binary size growth in percent."
        type: string
        required: false
      reset_baseline:
        description: "Accept the current size as the new baseline without comparing. Use when the last green commit no longer builds."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read # gh run list reads past runs to find the green baseline

# Keep push runs and dispatch runs in separate groups so a push to main cannot
# cancel a maintainer's in-flight override or baseline reset. Within a group a
# newer run covers the commits of an older one, so cancelling it loses nothing.
concurrency:
  group: cli-binary-size-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Default growth threshold in percent. workflow_dispatch can override it.
  SIZE_GROWTH_THRESHOLD_PERCENT: ${{ inputs.threshold_percent || '10' }}
  # Accept the current size as a new baseline. Empty (false) on a push.
  RESET_BASELINE: ${{ inputs.reset_baseline || false }}
  # Fixed, deterministic build target, identical for both builds.
  TARGET_GOOS: linux
  TARGET_GOARCH: amd64
  CLI_BINARY: bindings/go/cli/tmp/bin/ocm-linux-amd64

jobs:
  size-guard:
    name: Compare CLI binary size
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job only builds and compares; it never uses the token, so do
          # not leave it in .git/config (zizmor artipacked).
          persist-credentials: false
          # Only the tip and its parent are needed here; the baseline step
          # fetches the baseline commit on demand.
          fetch-depth: 2

      - name: Resolve baseline (last green run on main)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tip="$(git rev-parse HEAD)"
          echo "TIP_SHA=${tip}" >> "${GITHUB_ENV}"

          # A manual dispatch sets the next green baseline, so it must run on
          # main. The --branch main filter below already prevents a branch run
          # from becoming the baseline; this makes the rule explicit.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch must run on main, got ${GITHUB_REF}."
            exit 1
          fi

          base="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow cli-binary-size.yml --branch main --status success \
            --limit 1 --json headSha -q '.[0].headSha')"
          if [ -z "${base}" ]; then
            base="$(git rev-parse HEAD^)" # first run only: no green run yet
            echo "::notice::No green run found, using parent ${base} as baseline."
          fi
          echo "BASE_SHA=${base}" >> "${GITHUB_ENV}"
          echo "Baseline: ${base}"

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI at the new tip
        run: |
          task bindings/go/cli:build/single GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}"
          new_size=$(stat -c%s "${CLI_BINARY}")
          echo "NEW_SIZE=${new_size}" >> "${GITHUB_ENV}"
          echo "New tip binary size: ${new_size} bytes"

      - name: Build CLI at the baseline
        run: |
          # A maintainer can accept the current size as a fresh baseline when
          # the last green commit no longer builds. Skip the baseline build;
          # the compare step reports the tip size and passes, so this run
          # becomes the new green baseline.
          if [ "${RESET_BASELINE}" = "true" ]; then
            echo "Baseline reset requested; skipping the baseline build."
            echo "OLD_SIZE=${NEW_SIZE}" >> "${GITHUB_ENV}"
            echo "BASELINE_RESET=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          # A re-run of an already green commit has nothing to compare.
          if [ "${BASE_SHA}" = "${TIP_SHA}" ]; then
            echo "Baseline equals tip; reporting zero growth."
            echo "OLD_SIZE=${NEW_SIZE}" >> "${GITHUB_ENV}"
            exit 0
          fi
          # Fetch only the baseline commit. The repo is public, so this works
          # without a persisted token.
          git fetch --quiet --depth=1 origin "${BASE_SHA}"
          # Build the baseline with the tip's toolchain (GOTOOLCHAIN=local in
          # the build task) so the delta reflects the code change, not a
          # toolchain change. Overwriting the tip output is safe; it is
          # already measured.
          git checkout --quiet --force "${BASE_SHA}"
          if ! task bindings/go/cli:build/single GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}"; then
            echo "::error::The baseline ${BASE_SHA} did not build with the installed toolchain (GOTOOLCHAIN=local, so a changed toolchain pin can cause this). Re-run this workflow with workflow_dispatch and reset_baseline=true to accept the current size as a new baseline."
            exit 1
          fi
          old_size=$(stat -c%s "${CLI_BINARY}")
          echo "OLD_SIZE=${old_size}" >> "${GITHUB_ENV}"
          echo "Baseline binary size: ${old_size} bytes"

      - name: Compare and enforce threshold
        env:
          ACTOR: ${{ github.actor }}
        run: |
          mib() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }

          # A baseline reset accepts the current size: nothing to compare and
          # no threshold to enforce. This run becomes the new green baseline.
          if [ "${BASELINE_RESET:-0}" = "1" ]; then
            tip_mib="$(mib "${NEW_SIZE}")"
            echo "Baseline reset: new baseline ${TIP_SHA} at ${tip_mib} MiB (${NEW_SIZE} bytes)."
            {
              echo "### CLI binary size guard"
              echo ""
              echo "Baseline reset by @${ACTOR}. This run becomes the new green baseline."
              echo ""
              echo "| metric | value |"
              echo "| --- | --- |"
              echo "| new baseline | \`${TIP_SHA}\` |"
              echo "| size | ${tip_mib} MiB (${NEW_SIZE} bytes) |"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # workflow_dispatch passes the threshold as free text; reject
          # anything that is not a number before awk treats it as zero.
          if ! [[ "${SIZE_GROWTH_THRESHOLD_PERCENT}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::threshold_percent must be a number, got '${SIZE_GROWTH_THRESHOLD_PERCENT}'."
            exit 1
          fi

          growth=$(awk -v n="${NEW_SIZE}" -v o="${OLD_SIZE}" \
            'BEGIN { if (o == 0) { print "100" } else { printf "%.4f", (n - o) / o * 100 } }')
          delta_mib=$(awk -v n="${NEW_SIZE}" -v o="${OLD_SIZE}" \
            'BEGIN { printf "%+.1f", (n - o) / 1048576 }')
          base_mib="$(mib "${OLD_SIZE}")"
          tip_mib="$(mib "${NEW_SIZE}")"

          echo "Baseline (${BASE_SHA}): ${base_mib} MiB (${OLD_SIZE} bytes)"
          echo "New tip  (${TIP_SHA}): ${tip_mib} MiB (${NEW_SIZE} bytes)"
          echo "Growth: ${growth}% (${delta_mib} MiB, threshold ${SIZE_GROWTH_THRESHOLD_PERCENT}%)"
          {
            echo "### CLI binary size guard"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| baseline (last green) | \`${BASE_SHA}\` |"
            echo "| new tip | \`${TIP_SHA}\` |"
            echo "| baseline size | ${base_mib} MiB (${OLD_SIZE} bytes) |"
            echo "| new tip size | ${tip_mib} MiB (${NEW_SIZE} bytes) |"
            echo "| growth | ${growth}% (${delta_mib} MiB) |"
            echo "| threshold | ${SIZE_GROWTH_THRESHOLD_PERCENT}% |"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "| manual override | by @${ACTOR} |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          over=$(awk -v g="${growth}" -v t="${SIZE_GROWTH_THRESHOLD_PERCENT}" \
            'BEGIN { print ((g + 0) > (t + 0)) ? "1" : "0" }')
          if [ "${over}" = "1" ]; then
            echo "::error::CLI binary grew ${growth}% (${delta_mib} MiB), above the ${SIZE_GROWTH_THRESHOLD_PERCENT}% threshold. Approve with a workflow_dispatch and a higher threshold, or reduce the size."
            exit 1
          fi
          echo "CLI binary growth is within the threshold."
