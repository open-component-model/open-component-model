name: Trivy checks

# Tests OCM's own Trivy checks (.github/trivy-checks, used by image-scan.yml on
# the controller chart and the image build files) against their fixtures in
# testdata. Every fixture names the OCM checks it must fail on its first line,
# so a check that stops firing, or fires on a compliant fixture, fails the job.
# .env pins the Trivy version and checks bundle the checks are evaluated with.
on:
  push:
    branches:
      - main
    paths:
      - '.github/trivy-checks/**'
      - '.github/workflows/trivy-checks.yml'
      - '.env'
  pull_request:
    branches:
      - main
    paths:
      - '.github/trivy-checks/**'
      - '.github/workflows/trivy-checks.yml'
      - '.env'

permissions:
  contents: read

jobs:
  test:
    name: Test OCM Trivy checks
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/trivy-checks
            .env
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Load .env
        run: grep -E '^(TRIVY_VERSION|TRIVY_CHECKS_IMAGE)=' .env >> "$GITHUB_ENV"

      - name: Scan fixtures
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CONFIG_CHECK: .github/trivy-checks
          TRIVY_CHECK_NAMESPACES: user
          TRIVY_CHECKS_BUNDLE_REPOSITORY: ${{ env.TRIVY_CHECKS_IMAGE }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          # See the chart job in image-scan.yml: a restored cache could hold a
          # checks bundle other than the pinned one.
          cache: 'false'
          scan-type: config
          scan-ref: .github/trivy-checks/testdata
          exit-code: '0'
          format: json
          output: trivy-checks-test.json

      - name: Compare with expectations
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = '.github/trivy-checks/testdata';
            const results = JSON.parse(fs.readFileSync('trivy-checks-test.json', 'utf8')).Results ?? [];
            const ids = (list) => list.sort().join(' ');
            const cell = (s) => s || 'none';

            const rows = [];
            for (const name of fs.readdirSync(dir).sort()) {
              const file = path.join(dir, name);
              const line = fs.readFileSync(file, 'utf8').split('\n', 1)[0];
              if (!line.startsWith('# expect:')) {
                core.error("first line must be '# expect: <check IDs>'", { file });
                rows.push([name, '?', 'no expectation', '❌']);
                continue;
              }
              const want = ids(line.slice('# expect:'.length).split(/\s+/).filter(Boolean));
              const scanned = results.filter((r) => r.Target === name);
              const got = scanned.length === 0 ? 'not scanned' : ids(scanned
                .flatMap((r) => r.Misconfigurations ?? [])
                .map((m) => m.ID)
                .filter((id) => id.startsWith('OCM-')));
              if (got !== want) core.error(`expected [${want}], got [${got}]`, { file });
              rows.push([name, cell(want), cell(got), got === want ? '✅' : '❌']);
            }

            await core.summary
              .addHeading('🧪 OCM Trivy checks', 3)
              .addTable([
                [{ data: 'Fixture', header: true }, { data: 'Expected', header: true },
                 { data: 'Found', header: true }, { data: 'Result', header: true }],
                ...rows,
              ])
              .write();
            if (rows.some((r) => r[3] !== '✅')) core.setFailed('OCM Trivy checks do not match their fixtures');
