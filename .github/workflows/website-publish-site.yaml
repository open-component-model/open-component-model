name: "Website: Publish Site"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-publish-site.yaml'
      # Paths that are relevant for tracking changes on `main` version.
      # CRDs are generated from api/v1alpha1 at build time via controller-gen.
      - 'bindings/go/cli/docs/reference/**'
      - 'bindings/go/constructor/spec/v1/resources/**'
      - 'bindings/go/credentials/spec/config/v1/schemas/**'
      - 'bindings/go/descriptor/v2/resources/**'
      - 'bindings/go/gpg/spec/credentials/v1alpha1/schemas/**'
      - 'bindings/go/helm/spec/credentials/v1/schemas/**'
      - 'bindings/go/http/spec/config/v1alpha1/schemas/**'
      - 'bindings/go/oci/spec/credentials/v1/schemas/**'
      - 'bindings/go/rsa/spec/credentials/v1/schemas/**'
      - 'bindings/go/sigstore/spec/credentials/**'
      - 'bindings/go/kubernetes/controller/api/v1alpha1/**'

permissions:
  contents: read

# One deployment at a time; let a running deployment finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  OUTPUT_DIR: site-docs/

jobs:
  build:
    name: Build Site
    # peaceiris/actions-hugo v3 produces wrong filename casing for Hugo >= v0.103.0 on ARM64.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/package.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Install deps and Build
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public
          # Dotfiles are dropped by default; .well-known/security.txt must be published.
          include-hidden-files: true

  # Separate job so the npm/Hugo build never runs next to the Pages deploy credentials.
  deploy:
    name: Deploy Site
    needs: build
    runs-on: ubuntu-26.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
