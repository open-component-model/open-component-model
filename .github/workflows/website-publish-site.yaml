name: "Website: Publish Site"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'website/**'
    paths:
      - 'website/**'
      - '.github/workflows/website-publish-site.yaml'
      # Paths relevant for the `main` version dev build. This list MUST cover
      # every BINDING_MOUNTS source dir plus the MAIN_EXTRA_MOUNTS source dirs
      # (CLI reference docs, controller CRD bases) in
      # website/scripts/register-docs-version.js; the register-docs-version unit
      # tests fail if a mounted source dir is not triggered here. The controller
      # CRD bases are committed files mounted directly, so changes to them must
      # trigger a publish on their own.
      - 'bindings/go/blob/filesystem/spec/access/v1alpha1/schemas/**'
      - 'bindings/go/cli/docs/reference/**'
      - 'bindings/go/configuration/checksum/http/v1alpha1/spec/schemas/**'
      - 'bindings/go/configuration/resolvers/v1alpha1/spec/schemas/**'
      - 'bindings/go/configuration/versioning/v1alpha1/spec/schemas/**'
      - 'bindings/go/constructor/spec/v1/resources/**'
      - 'bindings/go/credentials/spec/config/v1/schemas/**'
      - 'bindings/go/descriptor/v2/resources/**'
      - 'bindings/go/descriptor/v2/schemas/**'
      - 'bindings/go/git/spec/access/v1/schemas/**'
      - 'bindings/go/git/spec/credentials/v1/schemas/**'
      - 'bindings/go/git/spec/input/v1/schemas/**'
      - 'bindings/go/github/spec/access/v1/schemas/**'
      - 'bindings/go/github/spec/credentials/v1/schemas/**'
      - 'bindings/go/gpg/spec/credentials/v1alpha1/schemas/**'
      - 'bindings/go/helm/spec/access/v1/schemas/**'
      - 'bindings/go/helm/spec/credentials/v1/schemas/**'
      - 'bindings/go/helm/spec/input/v1/schemas/**'
      - 'bindings/go/http/spec/config/v1alpha1/schemas/**'
      - 'bindings/go/input/dir/spec/v1/schemas/**'
      - 'bindings/go/input/file/spec/v1/schemas/**'
      - 'bindings/go/input/utf8/spec/v1/schemas/**'
      - 'bindings/go/kubernetes/controller/api/v1alpha1/**'
      - 'bindings/go/kubernetes/controller/config/crd/bases/**'
      - 'bindings/go/oci/spec/access/v1/schemas/**'
      - 'bindings/go/oci/spec/credentials/v1/schemas/**'
      - 'bindings/go/rsa/spec/credentials/v1/schemas/**'
      - 'bindings/go/s3/spec/access/v2/schemas/**'
      - 'bindings/go/s3/spec/credentials/v1/schemas/**'
      - 'bindings/go/s3/spec/input/v2/schemas/**'
      - 'bindings/go/signing/tsa/spec/credentials/v1alpha1/schemas/**'
      - 'bindings/go/sigstore/spec/credentials/oidcidentitytoken/v1alpha1/schemas/**'
      - 'bindings/go/sigstore/spec/credentials/trustedroot/v1alpha1/schemas/**'
      - 'bindings/go/transfer/v1alpha1/spec/schemas/**'
      - 'bindings/go/wget/spec/access/v1/schemas/**'
      - 'bindings/go/wget/spec/credentials/v1/schemas/**'
      - 'bindings/go/wget/spec/input/v1/schemas/**'
      - 'bindings/go/wget/transformation/spec/v1alpha1/schemas/**'

permissions:
  contents: read

env:
  OUTPUT_DIR: site-docs/

jobs:
  publish-site:
    name: Publish Site
    # peaceiris/actions-hugo v3 produces wrong filename casing for Hugo >= v0.103.0 on ARM64.
    runs-on: ubuntu-latest
    environment:
      name: automation
      deployment: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Get OCMBot installation token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OCMBOT_APP_ID }}
          private-key: ${{ secrets.OCMBOT_PRIV_KEY }}
          repositories: ${{ github.event.repository.name }}
          # Push the built site to the gh-pages branch.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: website/package.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Install deps and Build
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Publish as GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          publish_dir: ./website/public
          commit_message: ${{ env.COMMIT_MSG }}
          user_name: 'GitHub Actions Bot'
          user_email: '<41898282+github-actions[bot]@users.noreply.github.com>'
