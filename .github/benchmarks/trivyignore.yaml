# Accepted Trivy misconfiguration findings for the rendered controller Helm chart
# and the image build files (image-scan.yml, job "chart"). Paths are relative to
# the rendered directory, so each finding is accepted only for the file that
# needs it.
misconfigurations:
  - id: KSV-0041
    paths:
      - chart/templates/rbac/manager-role.yaml
    statement: The controller resolves OCI registry credentials from Kubernetes Secrets referenced in Repository and Resource custom resources. Read/list/watch on secrets is required for this. The ClusterRole does not grant create, update, or delete on secrets; OCM-KSV-0003 fails the scan if any role does.
