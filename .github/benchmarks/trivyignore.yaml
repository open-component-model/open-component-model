# Accepted Trivy misconfiguration findings for the rendered controller Helm chart
# (image-scan.yml, job "chart"). Paths are relative to the helm template
# --output-dir, so each finding is accepted only for the template that needs it.
# The statement field is rendered on the Security Benchmarks documentation page.
misconfigurations:
  - id: KSV-0041
    paths:
      - chart/templates/rbac/manager-role.yaml
    statement: The controller resolves OCI registry credentials from Kubernetes Secrets referenced in Repository and Resource custom resources. Read/list/watch on secrets is required for this. The ClusterRole does not grant create, update, or delete on secrets.
  - id: KSV-0049
    paths:
      - chart/templates/rbac/leader-election-role.yaml
    statement: The leader-election Role grants create/update/patch/delete on ConfigMaps in the release namespace. controller-runtime uses a ConfigMap (or Lease) for leader election; write access is required.
  - id: KSV-0125
    paths:
      - chart/templates/manager/manager.yaml
    statement: The default values.yaml references ghcr.io/open-component-model/kubernetes/controller. Trivy flags any registry not on its built-in allowlist. Override manager.image.repository if your policy requires a mirror.
