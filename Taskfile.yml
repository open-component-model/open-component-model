# https://ocm.software/docs/getting-started/
version: '3'

dotenv: ['.env', '.env.local']

output: prefixed

includes:
  tools:
    taskfile: ./tools.Taskfile.yml
  # bindings/go is a single Go module. Unit tests are run via `bindings/go:test`,
  # integration tests via `bindings/go:test/integration`.
  bindings/go:
    optional: true
    taskfile: ./bindings/go/Taskfile.yml
    dir: ./bindings/go
  # The sigstore include provides the scaffolding cluster lifecycle used by
  # `bindings/go:test/integration` and for local development convenience.
  bindings/go/sigstore/integration:
    optional: true
    taskfile: ./bindings/go/sigstore/integration/Taskfile.yml
    dir: ./bindings/go/sigstore/integration
  # The generator include provides code generation tasks used by `task generate`.
  bindings/go/generator:
    optional: true
    taskfile: ./bindings/go/generator/Taskfile.yml
    dir: ./bindings/go/generator
  bindings/go/cli:
    optional: true
    taskfile: ./bindings/go/cli/Taskfile.yml
    dir: ./bindings/go/cli
  bindings/go/kubernetes/controller:
    optional: true
    taskfile: ./bindings/go/kubernetes/controller/Taskfile.yml
    dir: ./bindings/go/kubernetes/controller

vars:
  GO_MODULES:
    sh: find '{{ .ROOT_DIR }}' -path '{{ .ROOT_DIR }}/website' -prune -o -name go.mod -print -exec dirname {} \; | grep -v go.mod | sed 's|{{ .ROOT_DIR }}/||'

tasks:
  default:
    deps: ["bindings/go/cli:build", "bindings/go/kubernetes/controller:build"]

  go_modules:
    desc: "List all Go Modules available in this project"
    cmd: echo "{{ .GO_MODULES }}"
    silent: true

  test:
    desc: "Run all unit tests in the project"
    cmds:
      - task: 'bindings/go:test'
      - task: 'bindings/go/generator:test'
  test/integration:
    desc: "Run all integration tests in the project, possibly requiring external systems"
    cmds:
      - task: 'bindings/go:test/integration'

  init/go.work:
    desc: "Initialize the workspace environment"
    status:
      - find go.work
    cmds:
      - go work init
      - for: { var: GO_MODULES }
        cmd: 'go work use {{.ITEM}}'

  tidy:
    desc: "Run go mod tidy on all Go modules in the project"
    cmds:
      - for: { var: GO_MODULES }
        cmd: 'cd {{.ITEM}} && go mod tidy'

  generate:
    desc: "Run all Code Generators in the project"
    cmds:
      - task: 'bindings/go/generator:ocmtypegen/generate'
      - task: 'bindings/go/generator:jsonschemagen/generate'
      - task: 'tools:deepcopy-gen/generate-deepcopy'
      - task: 'bindings/go/kubernetes/controller:manifests'
      - task: 'bindings/go/kubernetes/controller:generate'
      - task: 'bindings/go/cli:generate/docs'
        vars:
          CLI_DOCUMENTATION_MODE: "hugo"
          CLI_DOCUMENTATION_DIRECTORY: '{{ .ROOT_DIR }}/bindings/go/cli/docs/reference'
      - task: 'tidy'
