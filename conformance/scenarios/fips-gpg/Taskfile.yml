# Taskfile for the FIPS GPG conformance scenario: GPG signing and verification
# with the full OCM CLI image under GODEBUG=fips140=only.
version: '3'

vars:
  CLI_IMAGE: '{{ .CLI_IMAGE | default "ghcr.io/open-component-model/cli:main" }}'
  NAME: acme.org/fips/gpg
  VERSION: '1.0.0'
  WORK: '{{ .TASKFILE_DIR }}/tmp'
  CTF: '{{ .WORK }}/transport-archive'
  COMPONENT: '{{ .CTF }}//{{ .NAME }}:{{ .VERSION }}'
  # GnuPG home for key generation. A named volume instead of a bind mount
  # because the gpg-agent socket path must stay below the 108-byte limit of
  # Unix sockets, which deep CI checkout paths exceed.
  GNUPG_VOLUME: ocm-conformance-fips-gpg
  # ocm creates a temporary GnuPG home per signing operation under TMPDIR; a
  # tmpfs at /tmp keeps its agent socket path short for the same reason.
  ocm: >-
    docker run --rm
    --user $(id -u):$(id -g)
    --tmpfs /tmp:rw,exec,mode=1777
    -v {{ .TASKFILE_DIR }}:{{ .TASKFILE_DIR }}
    -w {{ .TASKFILE_DIR }}
    -e HOME=/tmp -e TMPDIR=/tmp
    -e GODEBUG=fips140=only
    -e NAME={{ .NAME }} -e VERSION={{ .VERSION }}
  # Key generation only (test setup): runs as root because a fresh named volume
  # is root-owned and the image's default user 65532 cannot write to it.
  gpg: >-
    docker run --rm
    --user 0:0
    -v {{ .GNUPG_VOLUME }}:/gnupg
    -e GNUPGHOME=/gnupg
    --entrypoint /usr/bin/gpg
    {{ .CLI_IMAGE }}
    --batch --pinentry-mode loopback --passphrase ''

tasks:
  run:
    desc: Run the FIPS GPG conformance scenario end-to-end
    deps: [check]
    cmds:
      - task: clean
      - task: keys
      - task: build
      # Before the real signature: the component version must still be unsigned.
      - task: sign:libgcrypt-not-fips
      - task: sign
      - task: verify
      - task: verify:wrong-key

  check:
    silent: true
    desc: Check required dependencies are installed
    cmds:
      - cmd: which docker || (echo "❌ Docker not found" && exit 1)

  # === KEY TASKS ===
  keys:
    desc: Generate the signing key and an unrelated key with the image's FIPS-mode gpg
    cmds:
      - mkdir -p {{ .WORK }}/keys
      - docker volume create {{ .GNUPG_VOLUME }} >/dev/null
      # rsa3072: gpg's default cv25519 encryption subkey is not FIPS approved.
      - '{{ .gpg }} --quick-gen-key signer@acme.org rsa3072 sign never'
      - '{{ .gpg }} --quick-gen-key other@acme.org rsa3072 sign never'
      - '{{ .gpg }} --armor --export-secret-keys signer@acme.org > {{ .WORK }}/keys/signer-private.asc'
      - '{{ .gpg }} --armor --export signer@acme.org > {{ .WORK }}/keys/signer-public.asc'
      - '{{ .gpg }} --armor --export other@acme.org > {{ .WORK }}/keys/other-public.asc'
      - task: config

  config:
    internal: true
    cmds:
      - cmd: |
          cat > {{ .WORK }}/sign.ocmconfig <<EOF
          type: generic.config.ocm.software/v1
          configurations:
          - type: credentials.config.ocm.software
            consumers:
            - identity:
                type: GPG/v1alpha1
                signature: default
              credentials:
              - type: GPGCredentials/v1alpha1
                privateKeyPGPFile: {{ .WORK }}/keys/signer-private.asc
          - type: signing.config.ocm.software/v1alpha1
            signer:
              type: GPGSigningConfiguration/v1alpha1
          EOF
      - for: [signer, other]
        cmd: |
          cat > {{ .WORK }}/verify-{{ .ITEM }}.ocmconfig <<EOF
          type: generic.config.ocm.software/v1
          configurations:
          - type: credentials.config.ocm.software
            consumers:
            - identity:
                type: GPG/v1alpha1
                signature: default
              credentials:
              - type: GPGCredentials/v1alpha1
                publicKeyPGPFile: {{ .WORK }}/keys/{{ .ITEM }}-public.asc
          - type: signing.config.ocm.software/v1alpha1
            verifier:
              type: GPGSigningConfiguration/v1alpha1
          EOF

  # === SCENARIO TASKS ===
  build:
    desc: Build the component version into a CTF archive
    cmd: |
      {{ .ocm }} {{ .CLI_IMAGE }} add componentversion \
        --repository {{ .CTF }} \
        --component-version-conflict-policy=replace \
        --constructor component-constructor.yaml

  sign:
    desc: Sign the component version with GPG under fips140=only
    cmd: |
      {{ .ocm }} {{ .CLI_IMAGE }} sign componentversion \
        --config {{ .WORK }}/sign.ocmconfig {{ .COMPONENT }}

  verify:
    desc: Verify the GPG signature under fips140=only
    cmd: |
      {{ .ocm }} {{ .CLI_IMAGE }} verify componentversion \
        --config {{ .WORK }}/verify-signer.ocmconfig {{ .COMPONENT }}

  verify:wrong-key:
    desc: Verification with a public key that did not sign must fail
    cmd: |
      if out=$({{ .ocm }} {{ .CLI_IMAGE }} verify componentversion \
          --config {{ .WORK }}/verify-other.ocmconfig {{ .COMPONENT }} 2>&1); then
        echo "$out"; echo "❌ verification with an unrelated key succeeded"; exit 1
      fi
      echo "$out" | grep -q "SIGNATURE VERIFICATION FAILED" || { echo "$out"; echo "❌ unexpected error"; exit 1; }
      echo "✅ verification with an unrelated key rejected"

  sign:libgcrypt-not-fips:
    desc: With libgcrypt out of FIPS mode, fips140=only must reject gpg
    # libgcrypt 1.11.3 enables FIPS when EITHER /etc/gcrypt/fips_enabled exists
    # (maskable via tmpfs) OR /proc/sys/crypto/fips_enabled > 0 (kernel passthrough,
    # not maskable in rootless containers). On a FIPS-enabled host kernel the
    # non-FIPS state cannot be reached, so skip here.
    cmd: |
      if [ "$(cat /proc/sys/crypto/fips_enabled 2>/dev/null || echo 0)" = "1" ]; then
        echo "SKIP: host kernel enforces FIPS, cannot simulate non-FIPS libgcrypt"
        exit 0
      fi
      if out=$({{ .ocm }} --tmpfs /etc/gcrypt:ro {{ .CLI_IMAGE }} \
          sign componentversion \
          --config {{ .WORK }}/sign.ocmconfig {{ .COMPONENT }} 2>&1); then
        echo "$out"; echo "❌ signing succeeded with libgcrypt outside FIPS mode"; exit 1
      fi
      echo "$out" | grep -q "require a gpg whose libgcrypt runs in FIPS mode" || { echo "$out"; echo "❌ unexpected error"; exit 1; }
      echo "✅ gpg outside FIPS mode rejected"

  # === CLEANUP TASKS ===
  clean:
    desc: Clean up generated data
    cmds:
      - rm -rf {{ .WORK }}
      - docker volume rm -f {{ .GNUPG_VOLUME }} >/dev/null
