# Taskfile for OCM Sovereign Scenario Conformance
version: '3'

vars:
  CLI_IMAGE: '{{ .CLI_IMAGE | default "ghcr.io/open-component-model/cli:0.0.0-main" }}'
  TOOLKIT_IMAGE: '{{ .TOOLKIT_IMAGE | default "oci://ghcr.io/open-component-model/kubernetes/controller/chart:0.0.0-main" }}'
  PRELOAD_IMAGES: '{{ .PRELOAD_IMAGES | default "" }}'
  DOCKER_NETWORK: '{{ .DOCKER_NETWORK | default "kind" }}'
  VERSION: '1.0.0'
  POSTGRES_VERSION: '{{.POSTGRES_VERSION | default "18"}}'
  KIND_NODE_IMAGE_VERSION: "v1.34.0"
  CTF: '{{ .TASKFILE_DIR }}/tmp/transport-archive'
  AIRGAP_CTF: '{{ .TASKFILE_DIR }}/tmp/airgap-archive'
  CLUSTER_NAME: sovereign-conformance
  NAME: acme.org/sovereign/product
  PUSH_IMAGE: '{{.PUSH_IMAGE | default "true"}}'
  OCM_TMPDIR: '{{ .TASKFILE_DIR }}/tmp'
  OCM_CREDENTIALS_CONFIG: '{{ .TASKFILE_DIR }}/tmp/credentials.yaml'
  REGISTRY_NAME: "registry"
  REGISTRY_PORT: "5001"
  REGISTRY_INTERNAL_PORT: "5000"
  KRO_VERSION: "0.9.4"
  PLATFORMS: "linux/{{ARCH}}"
  ocm: >-
    docker run --rm
    --network {{ .DOCKER_NETWORK }}
    --user $(id -u):$(id -g)
    -v {{ .TASKFILE_DIR }}:{{ .TASKFILE_DIR }}
    -e TMPDIR={{ .OCM_TMPDIR }}
    -e NAME -e VERSION -e POSTGRES_VERSION -e OCI_LAYOUT -e OCM_CONFIG
    -w $PWD
    {{ .CLI_IMAGE }}

tasks:
  prepare:
    desc: Prepare environment for containerized CLI
    cmds:
      - mkdir -p {{ .OCM_TMPDIR }}
      - task: prepare:credentials

  run:
    deps:
      - check
      - clean:cluster
    desc: Run the conformance scenario end-to-end with kind (reuses CTF archives in tmp/; `task clean` forces a rebuild)
    cmds:
      - task: prepare
      - task: cluster:setup
      - task: airgap
      - task: cluster:import
      - task: cluster:bootstrap

  upgrade:
    desc: Test upgrade scenario
    vars:
      NEW_VERSION: "1.1.0"
    cmds:
      - task: airgap
        vars:
          VERSION: "{{.NEW_VERSION}}"
      - task: cluster:import
        vars:
          VERSION: "{{.NEW_VERSION}}"
      - cmd: kubectl apply -f deploy/sample-product-1.1.0.yaml
      - cmd: kubectl wait --for=condition=Ready -n sovereign-product sovereignproduct/sovereign-product --timeout=300s

  airgap:
    desc: Build, sign and transfer VERSION into the air-gap CTF, unless that CTF already contains it
    # The air-gap CTF is the cache: keeping it (task clean:cluster) skips the image build and
    # the upstream image pulls on the next run. Versions accumulate, so run and upgrade both hit it.
    status:
      - '{{.ocm}} get cv {{.AIRGAP_CTF}}//{{.NAME}}:{{.VERSION}} >/dev/null 2>&1'
    cmds:
      - task: build:product
        vars:
          VERSION: "{{.VERSION}}"
      - task: transfer:airgap
        vars:
          VERSION: "{{.VERSION}}"

  # === BUILD TASKS ===
  build:notes:
    desc: Build notes OCM component
    dir: components/notes
    vars:
      NAME: acme.org/sovereign/notes
      OCI_LAYOUT: './deploy/notes.tar.gz'
    env:
      NAME: '{{.NAME}}'
      VERSION: '{{.VERSION}}'
      OCI_LAYOUT: '{{.OCI_LAYOUT}}'
    cmds:
      - cmd: |
          docker buildx build \
            --platform {{.PLATFORMS}} \
            --build-arg VERSION={{.VERSION}} \
            -t '{{.VERSION}}' \
            --output type=oci,dest={{.OCI_LAYOUT}} \
            .
      - defer: rm -rf {{.OCI_LAYOUT}}
      - cmd: |
          {{ .ocm }} add componentversion \
            --repository {{.CTF}} \
            --constructor component-constructor.yaml

  build:postgres:
    desc: Build postgres OCM component
    dir: components/postgres
    env:
      NAME: acme.org/sovereign/postgres
      VERSION: '{{.VERSION}}'
      POSTGRES_VERSION: '{{.POSTGRES_VERSION}}'
    cmd: |
      {{ .ocm }} add componentversion \
        --repository {{.CTF}} \
        --constructor component-constructor.yaml

  build:product:
    desc: Build all OCM components into CTF archive
    deps:
      - prepare
      - task: build:notes
        vars:
          VERSION: '{{.VERSION}}'
      - task: build:postgres
        vars:
          VERSION: '{{.VERSION}}'
      - task: product:keys
    dir: components/product
    env:
      NAME: '{{.NAME}}'
      VERSION: '{{.VERSION}}'
      POSTGRES_VERSION: '{{.POSTGRES_VERSION}}'
    cmds:
      - cmd: |
          {{ .ocm }} add componentversion \
            --repository {{.CTF}} \
            --constructor component-constructor.yaml
      - task: sign
        vars:
          COMPONENT: '{{.CTF}}//{{.NAME}}:{{.VERSION}}'

  # === SIGNING TASKS ===
  product:keys:
    status:
      - test -f acme-private.pem
      - test -f acme-public.pem
    desc: Generate RSA key pair for signing
    dir: tmp/keys
    cmds:
      - cmd: |
          openssl genpkey -algorithm RSA -out acme-private.pem -pkeyopt rsa_keygen_bits:4096
          openssl rsa -pubout -in acme-private.pem -out acme-public.pem
  sign:
    desc: Sign all components with RSA key
    dir: components/product
    env:
      OCM_CONFIG: './config/sign.yaml'
    requires:
      vars: ["COMPONENT"]
    cmd: '{{ .ocm }} sign componentversion {{.COMPONENT}}'
  verify:
    desc: Verify component signatures
    dir: components/product
    env:
      OCM_CONFIG: './config/verify.yaml'
    requires:
      vars: ["COMPONENT"]
    cmd: '{{ .ocm }} verify componentversion {{.COMPONENT}}'

  # === TRANSPORT TASKS ===
  transfer:airgap:
    desc: Transfer components to air-gap archive with verification
    env:
      OCM_CONFIG: '{{ .OCM_CREDENTIALS_CONFIG }}'
    cmds:
      # No wipe: the air-gap CTF accumulates versions so it can serve as a cache (see task airgap).
      - task: verify
        vars:
          COMPONENT: '{{.CTF}}//{{.NAME}}:{{.VERSION}}'
      - cmd: |
          {{ .ocm }} transfer cv \
            --copy-resources \
            --recursive \
            {{.CTF}}//{{.NAME}}:{{.VERSION}} {{.AIRGAP_CTF}} {{ .CLI_ARGS }}

  # === CLUSTER TASKS ===

  cluster:registry:
    desc: Start local Docker registry if not already running
    status:
      - docker inspect -f '{{`{{.State.Running}}`}}' {{.REGISTRY_NAME}} 2>/dev/null | grep -q true
    cmds:
      - cmd: |
          docker run -d \
            --restart=always \
            --name {{.REGISTRY_NAME}} \
            -p "127.0.0.1:{{.REGISTRY_PORT}}:{{.REGISTRY_INTERNAL_PORT}}" \
            --network bridge \
            registry:2

  cluster:create:
    vars:
      CONTAINERD_CONFIG_PATH: "/etc/containerd/certs.d"
    desc: Create kind cluster with containerd registry config
    status:
      - kind get clusters | grep -q {{.CLUSTER_NAME}}
    cmds:
      - cmd: |
          cat <<EOF | kind create cluster --name {{.CLUSTER_NAME}} --image="kindest/node:{{.KIND_NODE_IMAGE_VERSION}}" --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            # sovereign-notes NodePort (set in the product RGD), reachable as http://localhost:8080
            - containerPort: 30080
              hostPort: 8080
              protocol: TCP
            - containerPort: 443
              hostPort: 8443
              protocol: TCP
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry]
              config_path = "{{.CONTAINERD_CONFIG_PATH}}"
          EOF

  cluster:registry:configure:
    vars:
      CONTAINERD_CONFIG_PATH: "/etc/containerd/certs.d"
    desc: Configure registry access on all cluster nodes
    cmds:
      - cmd: |
          for node in $(kind get nodes --name {{.CLUSTER_NAME}}); do
            HOSTS_DIR="{{.CONTAINERD_CONFIG_PATH}}/{{.REGISTRY_NAME}}:{{.REGISTRY_INTERNAL_PORT}}"
            docker exec "${node}" mkdir -p "${HOSTS_DIR}"
            cat <<EOF | docker exec -i "${node}" cp /dev/stdin "${HOSTS_DIR}/hosts.toml"
          [host."http://{{.REGISTRY_NAME}}:{{.REGISTRY_INTERNAL_PORT}}"]
            skip_verify = true
          EOF
          done
      - cmd: |
          if [ "$(docker inspect -f='{{`{{json .NetworkSettings.Networks.kind}}`}}' {{.REGISTRY_NAME}})" = 'null' ]; then
            docker network connect --alias {{.REGISTRY_NAME}} kind {{.REGISTRY_NAME}}
          fi

  cluster:install:controllers:
    deps:
      - cluster:install:toolkit
      - cluster:install:kro
      - cluster:install:flux
  cluster:install:toolkit:
    silent: true
    desc: Install OCM controller on cluster
    vars:
      TOOLKIT_NAMESPACE: ocm-k8s-toolkit-system
    cmd: |
      echo "Installing OCM controller..."
      helm install ocm-k8s-toolkit {{ .TOOLKIT_IMAGE }} \
        --namespace {{ .TOOLKIT_NAMESPACE }} \
        --create-namespace \
        --wait --timeout=5m
  cluster:install:kro:
    silent: true
    desc: Install kro (ResourceGraphDefinition controller) via Helm
    cmd: |
      echo "Installing kro..."
      helm install kro oci://registry.k8s.io/kro/charts/kro \
        --namespace kro \
        --create-namespace \
        --version={{.KRO_VERSION}} \
        --set rbac.mode=aggregation \
        --wait --timeout=5m
  cluster:install:flux:
    silent: true
    desc: Install Flux and wait for readiness
    cmd: |
      echo "Installing flux..."
      flux install --components=source-controller,helm-controller

  cluster:preload:
    desc: Pre-load container images into kind cluster (no-op if PRELOAD_IMAGES is empty)
    cmds:
      - for: { var: PRELOAD_IMAGES }
        cmd: kind load image-archive {{.ITEM}} --name {{.CLUSTER_NAME}}

  cluster:preload:kro:
    desc: Pre-load kro controller image into kind cluster
    cmd: |
      docker pull --platform {{.PLATFORMS}} registry.k8s.io/kro/kro:v{{.KRO_VERSION}}
      docker save registry.k8s.io/kro/kro:v{{.KRO_VERSION}} | \
        docker exec -i {{.CLUSTER_NAME}}-control-plane ctr --namespace=k8s.io images import -

  cluster:setup:
    desc: Set up air-gapped kind cluster with registry, kro, and flux
    cmds:
      - task: cluster:registry
      - task: cluster:create
      - task: cluster:registry:configure
      - task: cluster:preload
      - task: cluster:preload:kro
      - task: cluster:install:controllers

  cluster:import:
    desc: Transfer CTF archive to air-gapped cluster
    cmd: |
      {{ .ocm }} transfer cv \
        --copy-resources \
        --recursive \
        {{.AIRGAP_CTF}}//{{.NAME}}:{{.VERSION}} \
        http://registry:5000

  cluster:bootstrap:
    desc: Bootstrap Components and Wait for Product to be Ready
    cmds:
    - cmd: kubectl apply -f deploy/namespace.yaml
    - cmd: kubectl apply -f deploy/rbac.yaml
    # The controller takes verification from the central OCM configuration: the signing entry asks for
    # the "default" signature to be verified, the credentials entry supplies the key to check it with.
    - cmd: |
        cat > tmp/keys/verify.ocmconfig <<EOF
        type: generic.config.ocm.software/v1
        configurations:
        - type: signing.config.ocm.software/v1alpha1
          signature: default
          verifier:
            type: RSASigningConfiguration/v1alpha1
        - type: credentials.config.ocm.software
          consumers:
          - identity:
              type: RSA/v1alpha1
              algorithm: RSASSA-PSS
              signature: default
            credentials:
            - type: Credentials/v1
              properties:
                public_key_pem: |
        $(sed 's/^/          /' tmp/keys/acme-public.pem)
        EOF
        kubectl -n sovereign-product create secret generic acme-signing-key \
        --from-file=.ocmconfig=tmp/keys/verify.ocmconfig --dry-run=client -o yaml | kubectl apply -f -
    - cmd: kubectl apply -f deploy/bootstrap.yaml
    - cmd: kubectl wait --for=condition=Ready -n sovereign-product namespaceddeployer/sovereign-product-deployer --timeout=300s
    - cmd: kubectl wait --for=condition=Ready ResourceGraphDefinition/sovereign-product --timeout=300s
    - cmd: kubectl apply -f deploy/sample-product-1.0.0.yaml
    - cmd: kubectl wait --for=condition=Ready -n sovereign-product sovereignproduct/sovereign-product --timeout=300s

  # === VERIFICATION TASKS ===

  verify:deployment:
    desc: Verify successful deployment and functionality
    cmds:
      - echo "Waiting for components to be ready..."
      - kubectl -n sovereign-product wait --for=condition=Ready
          component/sovereign-product-component --timeout=300s
      - task: test:connectivity

  test:connectivity:
    desc: Test application connectivity and functionality
    silent: true
    cmds:
      - cmd: |
          # Through the sovereign-notes NodePort, which kind maps to localhost:8080. Unlike a port-forward,
          # this goes through the Service and keeps working when pods are replaced.
          for i in $(seq 1 60); do curl -sf --max-time 2 http://localhost:8080/readyz &>/dev/null && break; sleep 1; done
          for ep in readyz notes; do
            curl -sf --max-time 5 "http://localhost:8080/${ep}" > /dev/null \
              && echo "✅ /${ep}" || { echo "❌ /${ep}"; exit 1; }
          done

  # === CLEANUP TASKS ===
  clean:
    desc: Remove the cluster, registry and all generated data, including the CTF archives and signing keys
    cmds:
      - task: clean:cluster
      - rm -rf {{ .OCM_TMPDIR }}

  clean:cluster:
    desc: Remove the kind cluster and registry but keep tmp/ (CTF archives, signing keys) for a faster re-run
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}} || true
      - docker rm -f {{.REGISTRY_NAME}} || true

  # === UTILITY TASKS ===
  prepare:credentials:
    silent: true
    desc: Extract Docker credentials for containerized CLI
    internal: true
    status:
      - test -f {{ .OCM_TMPDIR }}/docker-config.json
    cmds:
      - cmd: |
          SRC="${HOME}/.docker/config.json"
          DST="{{ .OCM_TMPDIR }}/docker-config.json"

          [ -f "$SRC" ] || { echo "No Docker config, skipping"; exit 0; }

          HELPER="docker-credential-$(jq -r '.credsStore // empty' "$SRC")"

          if command -v "$HELPER" >/dev/null 2>&1; then
            "$HELPER" list 2>/dev/null | jq -r 'keys[]' | while IFS= read -r reg; do
              echo "$reg" | "$HELPER" get 2>/dev/null
            done | jq -s '{auths: ([.[] | select(.Username and .Secret) |
              {(.ServerURL): {auth: ((.Username + ":" + .Secret) | @base64)}}] | add // {})}' > "$DST"
          else
            cp "$SRC" "$DST"
          fi

          cat > "{{ .OCM_CREDENTIALS_CONFIG }}" <<EOF
          type: generic.config.ocm.software/v1
          configurations:
          - type: credentials.config.ocm.software
            repositories:
            - repository:
                type: DockerConfig/v1
                dockerConfigFile: "$DST"
          EOF
  check:
    silent: true
    desc: Check required dependencies are installed
    cmds:
      - cmd: which docker || (echo "❌ Docker not found" && exit 1)
      - cmd: which kubectl || (echo "❌ kubectl not found" && exit 1)
      - cmd: which kind || (echo "❌ kind not found" && exit 1)
      - cmd: which helm || (echo "❌ Helm not found" && exit 1)
      - cmd: which flux || (echo "❌ flux CLI not found" && exit 1)
      - cmd: which openssl || (echo "❌ openssl not found" && exit 1)
      - cmd: which jq || (echo "❌ jq not found" && exit 1)
      - cmd: which curl || (echo "❌ curl not found" && exit 1)
  status:
    desc: Show status of all OCM resources
    silent: true
    cmds:
      - echo "=== Repositories ==="
      - kubectl get repositories -A -oyaml
      - echo "=== Components ==="
      - kubectl get components  -A -oyaml
      - echo "=== Resources ==="
      - kubectl get resources -A -oyaml
      - echo "=== NamespacedDeployers ==="
      - kubectl get namespaceddeployers -A -oyaml
      - echo "=== Kubernetes Native Objects (Product & Controller) ==="
      - kubectl cluster-info dump --namespaces sovereign-product
