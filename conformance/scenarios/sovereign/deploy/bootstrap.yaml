# Bootstrap: Product component pipeline.
#
# This is the minimum needed to deliver the product RGD into the cluster.
# The product RGD itself then creates the full deployment pipeline for
# sub-components (notes, postgres) and starts managing itself — see product/deploy/rgd.yaml.
#
# Prerequisites (applied before this file):
#   - Namespace: sovereign-product
#   - Secret: acme-signing-key (an .ocmconfig requesting verification of the "default" signature)
# HTTP client configuration: the air-gapped registry serves plain HTTP, and the controller
# talks plain HTTP only when the configuration says so. A Component that sets its own
# ocmConfig does not inherit the Repository's, so it lists the ConfigMap next to the
# signing key. Resources and Deployers inherit both from the Component.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-plain-http
  namespace: sovereign-product
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: http.config.ocm.software/v1alpha1
        plainHTTP: true
---
# OCM Repository pointing to local air-gapped registry
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: sovereign-repo
  namespace: sovereign-product
spec:
  repositorySpec:
    baseUrl: http://registry:5000
    type: OCIRegistry
  interval: 10m
  ocmConfig:
    - apiVersion: v1
      kind: ConfigMap
      name: ocm-plain-http
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: sovereign-product-component
  namespace: sovereign-product
spec:
  component: acme.org/sovereign/product
  repositoryRef:
    name: sovereign-repo
  semver: "1.0.0"
  interval: 1m
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: acme-signing-key
    - apiVersion: v1
      kind: ConfigMap
      name: ocm-plain-http
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: sovereign-product-resource-rgd
  namespace: sovereign-product
spec:
  componentRef:
    name: sovereign-product-component
  resource:
    byReference:
      resource:
        name: product-rgd
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: sovereign-product-deployer
  namespace: sovereign-product
spec:
  serviceAccountName: sovereign-product-deployer
  resourceRef:
    name: sovereign-product-resource-rgd
