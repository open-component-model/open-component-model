            - "ocm.software/open-component-model/bindings/go/descriptor/normalisation"
            - "ocm.software/open-component-model/bindings/go/descriptor/runtime"
            - "ocm.software/open-component-model/bindings/go/descriptor/v2"
            - "ocm.software/open-component-model/bindings/go/oci"
            - "ocm.software/open-component-model/bindings/go/repository"
            - "ocm.software/open-component-model/bindings/go/runtime"
          deny:
            - pkg: "ocm.software/open-component-model/bindings/go/"
              desc: "constructor must not import bindings outside its allowed set"
        credentials:
          list-mode: lax
          files: ["**/bindings/go/credentials/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/configuration"
            - "ocm.software/open-component-model/bindings/go/credentials"
