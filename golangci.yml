        # FIPS 140-3: keep non-approved algorithms out of OCM's own code. Upstream Go
        # in fips140=on mode still allows them (Chainguard's go-fips blocks them), so
        # these rules stop them from entering first-party code; the
        # GODEBUG=fips140=only unit-test run covers dependencies. Tests and the
        # integration-test harness are exempt. See
        # website/content/docs/reference/standards-and-regulations/fips.md.
        fips-non-approved-crypto:
          list-mode: lax
          files: ["$all", "!$test", "!**/integration/**"]
          allow:
            # Reviewed: in FIPS 140-3 mode x/crypto/ssh negotiates only SP 800-140C/D
            # approved algorithms (see its package doc) and uses the standard library
            # crypto underneath.
            - "golang.org/x/crypto/ssh"
          deny:
            - pkg: "crypto/des"
              desc: "DES and 3DES are not FIPS-approved; use AES (crypto/aes, crypto/cipher)"
            - pkg: "crypto/rc4"
              desc: "RC4 is not FIPS-approved; use AES-GCM"
            - pkg: "crypto/dsa"
              desc: "DSA is not FIPS 186-5 approved for signing; use ECDSA, Ed25519 or RSA"
            - pkg: "golang.org/x/crypto/"
              desc: "golang.org/x/crypto is outside the Go Cryptographic Module; use the standard library crypto packages (exceptions need a FIPS review and an allow entry)"
            - pkg: "github.com/ProtonMail/go-crypto"
              desc: "OpenPGP implementation outside the Go Cryptographic Module; use the gpg signing handler"
            - pkg: "github.com/decred/dcrd/dcrec/secp256k1"
              desc: "secp256k1 is not a FIPS-approved curve; use P-256, P-384 or P-521"
            - pkg: "github.com/btcsuite/btcd/btcec"
              desc: "secp256k1 is not a FIPS-approved curve; use P-256, P-384 or P-521"
        # MD5 and SHA-1 must not protect anything (signatures, HMACs, digests a
        # signature rests on). The only allowed use is verifying checksums that
        # remote servers publish (wget/checksum), which Chainguard's go-fips allows too.
        fips-legacy-hash:
          list-mode: lax
          files: ["$all", "!$test", "!**/integration/**", "!**/bindings/go/wget/checksum/**"]
          deny:
            - pkg: "crypto/md5"
              desc: "MD5 is not FIPS-approved for security purposes; use SHA-256 or SHA-512"
            - pkg: "crypto/sha1"
              desc: "SHA-1 is not FIPS-approved for signatures or HMACs; use SHA-256 or SHA-512"
