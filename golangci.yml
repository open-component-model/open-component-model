# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
#
# This is config for golangci-lint. Do not move this as this is in a canonical location auto-discovered by golangci-lint.
# see https://golangci-lint.run/docs/configuration/file/
version: "2"
run:
  issues-exit-code: 2
  tests: false
  allow-parallel-runners: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - blank
        - dot
        - default
        - prefix(ocm.software/open-component-model)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
linters:
  default: all
  disable:
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - dogsled
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - inamedparam
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - mirror
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: https://
      - linters:
          - dupl
          - err113
          - errcheck
          - funlen
          - gocyclo
          - gosec
        path: _test\.go
      - path: (.+)\.go$
        text: composites
      - linters:
          - cyclop
        path: (.+)_test\.go
      - linters:
          - staticcheck
        path: (.+)repository/ocm/fallback.go
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 110
      statements: 60
    gocritic:
      disabled-checks:
        - elseif
    lll:
      line-length: 120
    nolintlint:
      require-explanation: true
      require-specific: false
      allow-unused: false
    recvcheck:
      disable-builtin: true
      exclusions:
        - "*.MarshalJSON"
        - "*.UnmarshalJSON"
        - "*.JSONSchema"
        - "*.SetType"
        - "*.GetType"
        - "*.DeepCopy"
        - "*.DeepCopyInto"
        - "*.DeepCopyTyped"
        - '*.String'
    varnamelen:
      ignore-names:
        - err
        - wg
        - id
    staticcheck:
      dot-import-whitelist:
        - "github.com/onsi/ginkgo/v2"
        - "github.com/onsi/gomega"
    # depguard: enforce the bindings/go layering that the per-module go.mod files
    # encoded in the pre monolithic bindings state. Each rule uses `list-mode: lax` so that:
    #   - stdlib and third-party imports pass (they don't match the deny prefix)
    #   - allowed sibling bindings pass (more specific than the deny prefix)
    #   - internal sub-packages pass (parent allow is more specific than deny)
    #   - disallowed sibling bindings are caught (deny catches any binding not specifically allowed)
    #   - new bindings are denied by default until explicitly added to an allow list
    depguard:
      rules:
        blob:
          list-mode: lax
          files: ["**/bindings/go/blob/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/blob"
            - "ocm.software/open-component-model/bindings/go/runtime"
          deny:
            - pkg: "ocm.software/open-component-model/bindings/go/"
              desc: "blob must not import bindings outside its allowed set"
        cel:
          list-mode: lax
          files: ["**/bindings/go/cel/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/cel"
          deny:
            - pkg: "ocm.software/open-component-model/bindings/go/"
              desc: "cel must not import bindings outside its allowed set"
        configuration:
          list-mode: lax
          files: ["**/bindings/go/configuration/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/configuration"
            - "ocm.software/open-component-model/bindings/go/runtime"
          deny:
            - pkg: "ocm.software/open-component-model/bindings/go/"
              desc: "configuration must not import bindings outside its allowed set"
        constructor:
