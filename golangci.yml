# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
#
# This is config for golangci-lint. Do not move this as this is in a canonical location auto-discovered by golangci-lint.
# see https://golangci-lint.run/docs/configuration/file/
version: "2"
run:
  issues-exit-code: 2
  tests: true
  allow-parallel-runners: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - blank
        - dot
        - default
        - prefix(ocm.software/open-component-model)
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
linters:
  default: all
  disable:
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - dogsled
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - inamedparam
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - mirror
    - mnd
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testpackage
    - unparam
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: https://
      - linters:
          - dupl
          - err113
          - errcheck
          - funlen
          - gocyclo
          - gosec
        path: _test\.go
      # Test linting was enabled (run.tests: true) on a suite that had never been
      # linted, which surfaced a large pre-existing backlog. Each linter below is
      # disabled ONLY on _test.go so the backlog can be cleared one linter per PR
      # (counts are the findings at enablement time). To fix a linter, remove it
      # from this list in the same PR that resolves its findings.
      - linters:
          - depguard        # 12: tests import siblings outside the prod allow-list
          - dupword         # 2: false positives on intentional repetition (CEL map(x,x*2)); fixer corrupts strings
          - fatcontext      # 3: all current hits are false positives (intentional ctx capture, Ginkgo suite lifecycle) and the fixer shadows outer vars; value is in prod loop-nesting, not tests
          - ginkgolinter    # 5: Gomega length/error assertion idioms
          - gosmopolitan    # 5: time.Local / non-portable usage in tests
          - maintidx        # 39: low maintainability index of large table tests
          - misspell        # 25: false positives on the `interm` abbreviation; fixer rewrites identifiers
          - nolintlint      # 4: unused //nolint directives tied to the linters disabled here
        path: _test\.go
      - path: (.+)\.go$
        text: composites
      # io.EOF is returned directly per the io.Reader contract and must not be
      # wrapped, so `err == io.EOF` is idiomatic. errorlint already allows this
      # for stdlib readers; exempt the remaining test-only cases rather than
      # forcing errors.Is. See https://github.com/golang/go/issues/39155.
      - linters:
          - errorlint
        path: _test\.go
        source: io\.EOF
      # The ocm/v1 resolver config types (Resolver, spec.Config, spec.Resolver)
      # are deprecated for backwards compatibility only, with no replacement yet
      # ("New concepts will likely be introduced in the future"). Their tests must
      # keep exercising them, so exempt SA1019 for exactly those symbols in tests.
      - linters:
          - staticcheck
        path: _test\.go
        text: 'SA1019:.*configuration/ocm/v1/(runtime\.Resolver|spec\.(Config|Resolver)) is deprecated'
      # Integration tests (in */integration/ packages) share expensive
      # fixtures (registries/caches) and, for the CLI, mutate process-global 
      # state (cobra finalizers, slog default) via cmd.New().ExecuteContext. 
      # Their subtests have to run sequentially and tparallel is not helpful.
      - linters:
          - tparallel
        path: (/integration/|_integration_test\.go$)
      - linters:
          - cyclop
        path: (.+)_test\.go
      - linters:
          - staticcheck
        path: (.+)repository/ocm/fallback.go
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 110
      statements: 60
    gocritic:
      disabled-checks:
        - elseif
    lll:
      line-length: 120
    nolintlint:
      require-explanation: true
      require-specific: false
      allow-unused: false
    recvcheck:
      disable-builtin: true
      exclusions:
        - "*.MarshalJSON"
        - "*.UnmarshalJSON"
        - "*.JSONSchema"
        - "*.SetType"
        - "*.GetType"
        - "*.DeepCopy"
        - "*.DeepCopyInto"
        - "*.DeepCopyTyped"
        - '*.String'
    varnamelen:
      ignore-names:
        - err
        - wg
        - id
    staticcheck:
      dot-import-whitelist:
        - "github.com/onsi/ginkgo/v2"
        - "github.com/onsi/gomega"
    # depguard: enforce the bindings/go layering that the per-module go.mod files
    # encoded in the pre monolithic bindings state. Each rule uses `list-mode: lax` so that:
    #   - stdlib and third-party imports pass (they don't match the deny prefix)
    #   - allowed sibling bindings pass (more specific than the deny prefix)
    #   - internal sub-packages pass (parent allow is more specific than deny)
    #   - disallowed sibling bindings are caught (deny catches any binding not specifically allowed)
    #   - new bindings are denied by default until explicitly added to an allow list
    depguard:
      rules:
        blob:
          list-mode: lax
          files: ["**/bindings/go/blob/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/blob"
            - "ocm.software/open-component-model/bindings/go/runtime"
          deny:
            - pkg: "ocm.software/open-component-model/bindings/go/"
              desc: "blob must not import bindings outside its allowed set"
        cel:
          list-mode: lax
          files: ["**/bindings/go/cel/**"]
          allow:
            - "ocm.software/open-component-model/bindings/go/cel"
          deny:
