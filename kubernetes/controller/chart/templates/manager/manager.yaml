{{- if and (gt (int .Values.manager.replicas) 1) (not .Values.manager.leaderElection.enabled) }}
{{- fail "manager.replicas > 1 requires manager.leaderElection.enabled=true to prevent concurrent reconcilers from racing on the same resources" }}
{{- end }}
{{- if and .Values.fluxExternalArtifacts.enable (gt (int .Values.manager.replicas) 1) }}
{{- $st := .Values.fluxExternalArtifacts.storage }}
{{- if ne $st.type "persistentVolumeClaim" }}
{{- fail "fluxExternalArtifacts with manager.replicas > 1 requires fluxExternalArtifacts.storage.type=persistentVolumeClaim with a ReadWriteMany volume, so every replica can serve every artifact. With emptyDir, artifacts written by one replica are invisible to the Service's other replicas." }}
{{- end }}
{{- if not (has "ReadWriteMany" $st.persistentVolumeClaim.accessModes) }}
{{- if not $st.persistentVolumeClaim.existingClaim }}
{{- fail "fluxExternalArtifacts with manager.replicas > 1 requires storage.persistentVolumeClaim.accessModes to include ReadWriteMany (or supply an RWX existingClaim)." }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        control-plane: controller-manager
    name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}
spec:
    replicas: {{ .Values.manager.replicas }}
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            control-plane: controller-manager
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
            labels:
                app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                control-plane: controller-manager
        spec:
            {{- with .Values.manager.tolerations }}
            tolerations: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.affinity }}
            affinity: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.nodeSelector }}
            nodeSelector: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.imagePullSecrets }}
            imagePullSecrets: {{ toYaml . | nindent 16 }}
            {{- end }}
            containers:
                - args:
                    {{- /* Health probe */}}
                    - --health-probe-bind-address={{ .Values.manager.healthProbe.bindAddress | default ":8081" }}
                    {{- /* Metrics */}}
                    {{- if .Values.manager.metricsServer.bindAddress }}
                    - --metrics-bind-address={{ .Values.manager.metricsServer.bindAddress }}
                    {{- end }}
                    {{- if .Values.manager.metricsServer.secure }}
                    - --metrics-secure
                    {{- end }}
                    {{- if .Values.manager.metricsServer.enableHttp2 }}
                    - --enable-http2
                    {{- end }}
                    {{- /* Leader election */}}
                    {{- if .Values.manager.leaderElection.enabled }}
                    - --leader-elect
                    {{- end }}
                    {{- /* Concurrency */}}
                    {{- with .Values.manager.concurrency }}
                    {{- if .resource }}
                    - --resource-controller-concurrency={{ .resource }}
                    {{- end }}
                    {{- end }}
                    {{- /* Resolver */}}
                    {{- with .Values.manager.resolver }}
                    {{- if .workerCount }}
                    - --resolver-worker-count={{ .workerCount }}
                    {{- end }}
                    {{- if .workerQueueLength }}
                    - --resolver-worker-queue-length={{ .workerQueueLength }}
                    {{- end }}
                    {{- if hasKey . "subscriberBufferSize" }}
                    - --resolver-subscriber-buffer-size={{ .subscriberBufferSize }}
                    {{- end }}
                    {{- if hasKey . "cacheTTL" }}
                    - --resolver-cache-ttl={{ .cacheTTL }}
                    {{- end }}
                    {{- end }}
                    {{- /* Cache */}}
                    {{- with .Values.manager.cache }}
                    {{- if .deployerDownloadSize }}
                    - --deployer-download-cache-size={{ .deployerDownloadSize }}
                    {{- end }}
                    {{- if hasKey . "deployerDownloadMaxResourceSize" }}
                    - --deployer-download-max-resource-size={{ .deployerDownloadMaxResourceSize }}
                    {{- end }}
                    {{- end }}
                    {{- /* Logging */}}
                    {{- with .Values.manager.logging }}
                    {{- if .level }}
                    - --zap-log-level={{ .level }}
                    {{- end }}
                    {{- if .development }}
                    - --zap-devel
                    {{- end }}
                    {{- if .encoder }}
                    - --zap-encoder={{ .encoder }}
                    {{- end }}
                    {{- end }}
                    {{- /* Flux ExternalArtifact integration */}}
                    {{- if .Values.fluxExternalArtifacts.enable }}
                    - --enable-flux-external-artifacts-api
                    - --external-artifact-storage-path={{ .Values.fluxExternalArtifacts.storagePath }}
                    - --external-artifact-storage-address={{ .Values.fluxExternalArtifacts.storageAddress }}
                    - --external-artifact-max-size={{ .Values.fluxExternalArtifacts.maxArtifactSize }}
                    - --external-artifact-gc-interval={{ .Values.fluxExternalArtifacts.gcIntervalMinutes }}
                    {{- $scheme := "http" }}
                    {{- if .Values.fluxExternalArtifacts.tls.enabled }}
                    {{- $scheme = "https" }}
                    - --external-artifact-tls-cert-file=/etc/ocm/artifact-tls/tls.crt
                    - --external-artifact-tls-key-file=/etc/ocm/artifact-tls/tls.key
                    {{- end }}
                    {{- $advertise := .Values.fluxExternalArtifacts.advertiseAddress }}
                    {{- if not $advertise }}
                    {{- $port := regexFind ":[0-9]+$" .Values.fluxExternalArtifacts.storageAddress | trimPrefix ":" }}
                    {{- $advertise = printf "%s.%s.svc.cluster.local.:%s" (include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager" "context" $)) .Release.Namespace $port }}
                    {{- end }}
                    - --external-artifact-storage-advertise-address={{ $advertise }}
                    {{- end }}
                    {{- /* Extra args */}}
                    {{- range .Values.manager.extraArgs }}
                    - {{ . }}
                    {{- end }}
                  command:
                    - /manager
                  image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag }}"
                  imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
                  {{- with .Values.manager.env }}
                  env: {{ toYaml . | nindent 20 }}
                  {{- end }}
                  livenessProbe:
                    httpGet:
                        path: {{ .Values.manager.livenessProbe.path }}
                        port: {{ .Values.manager.livenessProbe.port }}
                    initialDelaySeconds: {{ .Values.manager.livenessProbe.initialDelaySeconds }}
                    periodSeconds: {{ .Values.manager.livenessProbe.periodSeconds }}
                  name: manager
                  ports:
                    - containerPort: 9090
                      name: http
                      protocol: TCP
                    {{- if .Values.fluxExternalArtifacts.enable }}
                    - containerPort: {{ regexFind ":[0-9]+$" .Values.fluxExternalArtifacts.storageAddress | trimPrefix ":" }}
                      name: artifacts
                      protocol: TCP
                    {{- end }}
                    {{- if .Values.webhook.enable }}
                    - containerPort: 9443
                      name: webhook-server
                      protocol: TCP
                    {{- end }}
                  readinessProbe:
                    httpGet:
                        path: {{ .Values.manager.readinessProbe.path }}
                        port: {{ .Values.manager.readinessProbe.port }}
                    initialDelaySeconds: {{ .Values.manager.readinessProbe.initialDelaySeconds }}
                    periodSeconds: {{ .Values.manager.readinessProbe.periodSeconds }}
                  resources:
                    {{- if .Values.manager.resources }}
                    {{- toYaml .Values.manager.resources | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  securityContext:
                    {{- if .Values.manager.securityContext }}
                    {{- toYaml .Values.manager.securityContext | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  volumeMounts:
                    - mountPath: {{ .Values.fluxExternalArtifacts.storagePath | default "/data" }}
                      name: data
                    {{- if and .Values.fluxExternalArtifacts.enable .Values.fluxExternalArtifacts.tls.enabled }}
                    - mountPath: /etc/ocm/artifact-tls
                      name: artifact-tls
                      readOnly: true
                    {{- end }}
                    {{- if .Values.webhook.enable }}
                    - mountPath: /tmp/k8s-webhook-server/serving-certs
                      name: cert
                      readOnly: true
                    {{- end }}
            securityContext:
              {{- if .Values.manager.podSecurityContext }}
              {{- toYaml .Values.manager.podSecurityContext | nindent 14 }}
              {{- else }}
              {}
              {{- end }}
            serviceAccountName: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager" "context" $) }}
            terminationGracePeriodSeconds: 10
            volumes:
                {{- $ea := .Values.fluxExternalArtifacts }}
                {{- if and $ea.enable (eq $ea.storage.type "persistentVolumeClaim") }}
                - name: data
                  persistentVolumeClaim:
                    claimName: {{ $ea.storage.persistentVolumeClaim.existingClaim | default (include "ocm-k8s-toolkit.resourceName" (dict "suffix" "artifacts" "context" $)) }}
                {{- else if and $ea.enable (eq $ea.storage.type "emptyDir") }}
                - name: data
                  emptyDir:
                    sizeLimit: {{ $ea.storage.emptyDirSize }}
                {{- else }}
                - emptyDir: {}
                  name: data
                {{- end }}
                {{- if and $ea.enable $ea.tls.enabled }}
                - name: artifact-tls
                  secret:
                    defaultMode: 420
                    secretName: {{ $ea.tls.secretName }}
                {{- end }}
                {{- if .Values.webhook.enable }}
                - name: cert
                  secret:
                    defaultMode: 420
                    secretName: {{ .Values.webhook.certSecret | default (include "ocm-k8s-toolkit.resourceName" (dict "suffix" "webhook-server-cert" "context" $)) }}
                {{- end }}
