# -- String to partially override chart.fullname template (will maintain the release name)
# nameOverride: ""

# -- String to fully override chart.fullname template
# fullnameOverride: ""

## Configure the controller manager deployment
manager:
  # -- Number of controller manager replicas
  replicas: 1
  image:
    # -- Controller image repository
    repository: ghcr.io/open-component-model/kubernetes/controller
    # -- Controller image tag
    tag: latest@sha256:302eb14ae7bd7ad3d18e94185691591c29fce2f021aaaa52108ecee595f6d5de
    # -- Image pull policy
    pullPolicy: IfNotPresent
  ## Controller concurrency settings
  concurrency:
    # -- Number of active resource controller workers
    resource: 4
  ## Resolver settings
  resolver:
    # -- Number of active resolver workers
    workerCount: 10
    # -- Maximum work items in queue for component version resolution
    workerQueueLength: 1000
    # -- Buffer size for each subscriber's event channel. Larger values reduce dropped resolution events under load. Monitor resolver_event_channel_drops_total metric.
    subscriberBufferSize: 100
    # -- The time-to-live (TTL) for the resolver cache entries in minutes. Setting TTL to less than 30 minutes is discouraged in productive use as it can lead to unintended performance issues.
    cacheTTL: 30
  ## Cache settings
  cache:
    # -- Maximum size of the deployer download object LRU cache
    deployerDownloadSize: 1000
    # -- Maximum size of a single downloadable resource as a Kubernetes resource.Quantity (e.g. "2Mi", "512Ki"). "0" disables the limit.
    deployerDownloadMaxResourceSize: "2Mi"
  ## Logging configuration (zap logger)
  logging:
    # -- Zap log level: 'debug', 'info', 'error', 'panic' or integer > 0
    level: "info"
    # -- Enable development mode (console encoder, debug level, warn stacktrace)
    development: false
    # -- Log encoding: 'json' or 'console'
    encoder: "json"
  ## Leader election
  leaderElection:
    # -- Enable leader election for controller manager
    enabled: true
  ## Health and metrics endpoints
  healthProbe:
    # -- Address the health probe endpoint binds to
    bindAddress: ":8081"
  ## Liveness probe configuration
  livenessProbe:
    # -- Path for the liveness probe
    path: /healthz
    # -- Port for the liveness probe
    port: 8081
    # -- Initial delay before starting liveness probes
    initialDelaySeconds: 15
    # -- Period between liveness probes
    periodSeconds: 20
  ## Readiness probe configuration
  readinessProbe:
    # -- Path for the readiness probe
    path: /readyz
    # -- Port for the readiness probe
    port: 8081
    # -- Initial delay before starting readiness probes
    initialDelaySeconds: 5
    # -- Period between readiness probes
    periodSeconds: 10
  metricsServer:
    # -- Address the metric endpoint binds to. Set to "0" to disable
    bindAddress: "0"
    # -- Serve metrics endpoint securely
    secure: false
    # -- Enable HTTP/2 for metrics and webhook servers
    enableHttp2: false
  # -- Extra arguments to pass to the controller
  extraArgs: []
  # -- Environment variables for the controller
  env: []
  # -- Image pull secrets for the controller
  imagePullSecrets: []
  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # -- Pod affinity rules
  affinity: {}
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Pod tolerations
  tolerations: []
## Helper RBAC roles for managing custom resources
rbacHelpers:
  # -- Install convenience admin/editor/viewer roles for CRDs
  enable: false
  # -- Install ClusterRoles that aggregate OCM resource permissions into the built-in `admin`, `edit` and `view` cluster roles
  aggregateToDefaultRoles: true
## Custom Resource Definitions
crd:
  # -- Install CRDs with the chart
  enable: true
  # -- Keep CRDs when uninstalling
  keep: true
## Flux ExternalArtifact integration (RFC-0012)
fluxExternalArtifacts:
  # -- Enable the ExternalArtifact controller: produce a Flux ExternalArtifact
  # (source.toolkit.fluxcd.io/v1) for every OCM Resource, packaging its content
  # (local blobs or OCI artifacts carrying Helm charts / Kustomize overlays)
  # into an in-cluster tar.gz consumable by the Flux kustomize/helm controllers.
  enable: false
  # -- Install the ExternalArtifact CRD with the chart. Off by default: the CRD
  # is owned by Flux and ships with the source-controller distribution that this
  # feature already depends on (its kustomize/helm controllers are the
  # consumers). Enable only for standalone/dev/test clusters where Flux is not
  # installed; installing a second copy risks version skew with Flux's.
  installCRD: false
  # -- Filesystem path (inside the manager container) where packaged artifacts
  # are stored.
  storagePath: /data
  # -- Address the artifact HTTP storage server binds to.
  storageAddress: ":9091"
  # -- In-cluster host[:port] the storage server is reachable at, used to build
  # artifact URLs. Defaults to the manager Service DNS name when empty.
  advertiseAddress: ""
  # -- Maximum uncompressed size of a single artifact (Kubernetes Quantity).
  # "0" disables the limit. Guards against decompression bombs / oversized
  # resources.
  maxArtifactSize: 10Mi
  # -- Interval in minutes between garbage-collection sweeps that remove on-disk
  # artifacts whose owning Resource no longer exists (closing the crash-window
  # gap where a Resource is deleted while the controller is down).
  gcIntervalMinutes: 60
  ## Artifact storage volume. In production, use a persistent volume so that
  ## artifacts survive pod restarts; the controller self-heals a wiped store on
  ## the next reconcile, but persistence avoids serving 404s in the meantime.
  storage:
    # -- Volume type backing the artifact store: "emptyDir" (ephemeral, default),
    # or "persistentVolumeClaim" (durable; required for HA with replicas > 1).
    type: emptyDir
    # -- Size of the emptyDir volume (only used when type=emptyDir).
    emptyDirSize: 1Gi
    ## persistentVolumeClaim settings (only used when type=persistentVolumeClaim).
    persistentVolumeClaim:
      # -- Use an existing PVC by name instead of creating one. When set, the
      # chart does not create a PVC and the other pvc fields are ignored.
      existingClaim: ""
      # -- Access modes for the created PVC. For HA (replicas > 1) this MUST
      # include ReadWriteMany so every replica can serve every artifact from the
      # shared volume; ReadWriteOnce only supports a single replica.
      accessModes:
        - ReadWriteOnce
      # -- Requested storage size for the created PVC.
      size: 1Gi
      # -- StorageClass for the created PVC. Empty uses the cluster default; for
      # ReadWriteMany you typically need an RWX-capable class (e.g. nfs,
      # cephfs, efs, azurefile).
      storageClassName: ""
  ## TLS for the artifact HTTP endpoint. When enabled, the server serves HTTPS
  ## and the advertised URLs should use https (set advertiseAddress accordingly).
  tls:
    # -- Serve artifacts over HTTPS using the referenced secret.
    enabled: false
    # -- Name of a kubernetes.io/tls secret containing tls.crt and tls.key.
    secretName: ""
  ## NetworkPolicy restricting who may reach the artifact endpoint. Recommended
  ## when the controller runs outside flux-system.
  networkPolicy:
    # -- Create a NetworkPolicy allowing only the Flux kustomize/helm
    # controllers to reach the artifact port.
    enable: false
    # -- Namespace the Flux controllers run in (source of allowed ingress).
    fluxNamespace: flux-system
## Webhook configuration
webhook:
  # -- Enable conversion webhook for CRD version conversion
  enable: false
  # -- Secret name for webhook TLS certificates (when not using cert-manager, create this secret manually)
  certSecret: ""
## Cert-manager integration
certManager:
  # -- Enable cert-manager for TLS certificates
  enable: false
## Prometheus ServiceMonitor
prometheus:
  # -- Enable Prometheus ServiceMonitor (requires prometheus-operator)
  enable: false
