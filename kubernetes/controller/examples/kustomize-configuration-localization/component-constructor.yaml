components:
  - name: ocm.software/ocm-k8s-toolkit/examples/kustomize-configuration-localization
    version: "1.0.0"
    provider:
      name: ocm.software
    resources:
      - name: kustomize-resource
        type: kustomize
        version: "1.0.0"
        access:
          type: ociArtifact
          # stefanprodan publishes the podinfo kustomize manifests as a flux-native
          # OCI artifact; using it directly avoids maintaining our own snapshot and
          # transfers cleanly (streaming path) into the target OCI registry.
          imageReference: "ghcr.io/stefanprodan/manifests/podinfo:6.9.1"
      - name: image-resource
        type: ociArtifact
        version: "1.0.0"
        access:
          type: ociArtifact
          imageReference: "ghcr.io/stefanprodan/podinfo:6.9.1@sha256:262578cde928d5c9eba3bce079976444f624c13ed0afb741d90d5423877496cb"
      - name: kro-rgd
        type: blob
        version: "1.0.0"
        input:
          type: file
          path: ./rgd.yaml
