# OCM objects: resolve an OCM resource from a repository. Once the Resource is
# Ready and --enable-flux-external-artifacts-api is set, the controller creates
# an ExternalArtifact named "kustomize-simple-resource-rgd" in this namespace.
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: kustomize-simple-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: kustomize-simple-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/kustomize-simple
  repositoryRef:
    name: kustomize-simple-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: kustomize-simple-resource-rgd
spec:
  componentRef:
    name: kustomize-simple-component
  resource:
    byReference:
      resource:
        name: kro-rgd
