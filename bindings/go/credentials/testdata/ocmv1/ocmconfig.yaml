# A credential config as written for the OCM v1 CLI: consumers are scoped by the
# lowercase pathprefix attribute, which v1 matched segment by segment.
type: credentials.config.ocm.software
consumers:
  - identity:
      type: OCIRegistry
      hostname: ghcr.io
      pathprefix: open-component-model
    credentials:
      - type: Credentials
        properties:
          username: oci-org
  - identity:
      type: Git
      hostname: gitlab.example.com
      scheme: https
      pathprefix: group
    credentials:
      - type: Credentials
        properties:
          username: git-group
  - identity:
      type: Wget
      hostname: files.example.com
      pathprefix: /downloads
    credentials:
      - type: Credentials
        properties:
          username: wget-downloads
