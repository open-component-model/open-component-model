version: '3'

vars:
  IMAGE_TOOL: docker
  INTEGRATION_TEST_IDENTIFIER: 'Integration'
  CLI_DOCUMENTATION_MODE: "markdown"
  CLI_DOCUMENTATION_DIRECTORY: tmp/docs
  PROVIDER: ocm.software
  NAME: cli
  DEFAULT_VERSION:
    sh: |
      echo "0.0.0-$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=12 HEAD)"
  VERSION: '{{ .VERSION | default .DEFAULT_VERSION }}'
  BUILD_VERSION: '{{ .BUILD_VERSION | default .VERSION }}'
  COMPONENT_CONSTRUCTOR_FILE: "{{ .TASKFILE_DIR }}/tmp/component-constructor.yaml"
  CTF_LOCATION: '{{ .TASKFILE_DIR }}/tmp/transport-archive'
  GOOS: '{{ .GOOS | default OS }}'
  GOARCH: '{{ .GOARCH | default ARCH }}'
tasks:
  test:
    cmds:
      - go test -skip '{{ .INTEGRATION_TEST_IDENTIFIER }}' ./... {{.CLI_ARGS}}

  test/integration:
    cmds:
      - go test -run '{{ .INTEGRATION_TEST_IDENTIFIER }}' ./integration/... {{.CLI_ARGS}}

  install:
    desc: "Install the CLI"
    prompt: "This will install the CLI to {{ .TARGET }}, do you want to continue?"
    interactive: true
    vars:
      TARGET: /usr/local/bin
    deps:
      - task: build
    cmds:
      - cmd: sudo install -m 755 {{ .TASKFILE_DIR }}/tmp/bin/ocm {{ .TARGET }}

  build:
    desc: "Build the CLI in the Host Architecture"
    deps:
      - task: build:target
        vars:
          GOOS: '{{ .GOOS }}'
          GOARCH: '{{ .GOARCH }}'
    cmds:
      - cmd: ln -sf {{ .TASKFILE_DIR }}/tmp/bin/ocm-{{ .GOOS }}-{{ .GOARCH }} {{ .TASKFILE_DIR }}/tmp/bin/ocm

  download/deps:
    internal: true
    cmd: go mod download

  build/multiarch:
    desc: "Build CLI for all supported targets"
    deps:
      - for:
          matrix:
            GOOS: [ "windows", "linux", "darwin" ]
            GOARCH: [ "amd64", "arm64" ]
        task: build:target
        vars:
          GOOS: '{{.ITEM.GOOS }}'
          GOARCH: '{{.ITEM.GOARCH }}'

  build/single:
    desc: "Build a single CLI target for the given GOOS/GOARCH (CI build-matrix entrypoint)"
    requires:
      vars: [ GOOS, GOARCH ]
    cmds:
      - task: build:target
        vars:
          GOOS: '{{ .GOOS }}'
          GOARCH: '{{ .GOARCH }}'

  package/image:
    desc: "Build the multi-arch CLI image locally (both platforms, then merge)"
    internal: true
    cmds:
      - task: package/image/platform
        vars: { ARCH: amd64 }
      - task: package/image/platform
        vars: { ARCH: arm64 }
      - task: package/image/merge

  # Builds the image for one linux architecture into tmp/oci/cli-<ARCH>.tar.
  # CI runs this on a runner of the matching architecture, so the target-arch
  # apt step in the Containerfile (gnupg) runs natively without QEMU.
  package/image/platform:
    desc: "Build the CLI image for a single linux architecture (CI per-arch entrypoint)"
    requires:
      vars: [ ARCH ]
    # GOFIPS140 (root .env) and COSIGN_VERSION (sigstore handler .env) are
    # forwarded as build args for the FIPS cosign build stage.
    dotenv: ['{{.TASKFILE_DIR}}/../../../.env', '{{.TASKFILE_DIR}}/../sigstore/signing/handler/internal/.env']
    dir: '{{ .TASKFILE_DIR }}'
    cmds:
      - |
        mkdir -p {{ .TASKFILE_DIR }}/tmp/oci
        {{ .IMAGE_TOOL }} buildx build \
          --platform linux/{{ .ARCH }} \
          --provenance=mode=min \
          --tag ghcr.io/open-component-model/cli:{{ .VERSION }} \
          --build-arg GOFIPS140 \
          --build-arg COSIGN_VERSION \
          --output type=oci,dest={{ .TASKFILE_DIR }}/tmp/oci/cli-{{ .ARCH }}.tar,oci-mediatypes=true,name=ghcr.io/open-component-model/cli \
          -f ./Containerfile .

  # Merges tmp/oci/cli-{amd64,arm64}.tar into the multi-arch tmp/oci/cli.tar,
  # with the same shape a multi-platform buildx build produces: one image index
  # tagged VERSION that lists every platform manifest and its provenance
  # attestation manifest.
  package/image/merge:
    desc: "Merge the per-arch CLI image layouts into the multi-arch OCI layout (CI join entrypoint)"
    dir: '{{ .TASKFILE_DIR }}/tmp/oci'
    cmds:
      - |
        set -euo pipefail
        chmod -R u+w merged 2>/dev/null || true
        rm -rf merged && mkdir -p merged
        children='[]'
        for arch in amd64 arm64; do
          # Blobs are content-addressed, so blobs shared by both layouts are
          # identical; extracted blobs are read-only, so re-enable writes first.
          chmod -R u+w merged
          tar -xf "cli-${arch}.tar" -C merged oci-layout blobs
          top=$(tar -xOf "cli-${arch}.tar" index.json | jq -r '.manifests[0].digest | sub("^sha256:"; "")')
          children=$(jq -c --argjson acc "${children}" '$acc + .manifests' "merged/blobs/sha256/${top}")
        done
        chmod -R u+w merged
        # Platform manifests first, then attestation manifests, as buildx orders them.
        jq -cn --argjson m "${children}" '{
          schemaVersion: 2,
          mediaType: "application/vnd.oci.image.index.v1+json",
          manifests: (($m | map(select(.annotations["vnd.docker.reference.type"] == null)))
                    + ($m | map(select(.annotations["vnd.docker.reference.type"] != null))))
        }' > index.blob
        digest=$( (sha256sum index.blob 2>/dev/null || shasum -a 256 index.blob) | cut -d' ' -f1)
        size=$(wc -c < index.blob | tr -d ' ')
        mv index.blob "merged/blobs/sha256/${digest}"
        jq -n --arg d "sha256:${digest}" --argjson s "${size}" --arg v "{{ .VERSION }}" '{
          schemaVersion: 2,
          mediaType: "application/vnd.oci.image.index.v1+json",
          manifests: [{
            mediaType: "application/vnd.oci.image.index.v1+json",
            digest: $d, size: $s,
            annotations: {
              "io.containerd.image.name": ("ghcr.io/open-component-model/cli:" + $v),
              "org.opencontainers.image.ref.name": $v
            }
          }]
        }' > merged/index.json
        tar -cf cli.tar -C merged oci-layout index.json blobs
        rm -rf merged
      - |
        mkdir -p {{ .TASKFILE_DIR }}/tmp/resources
        cat > {{ .TASKFILE_DIR }}/tmp/resources/ocm-multi-arch-container-image.yaml <<EOF
        - name: image
          type: ociImage
          version: {{ .VERSION }}
          relation: local
          input:
            type: file
            mediaType: application/vnd.ocm.software.oci.layout.v1+tar
            path: {{ .TASKFILE_DIR }}/tmp/oci/cli.tar
        EOF

  build/multiarch/image:
    deps: [ "build/multiarch" ]
    cmds:
      - task: package/image

  build:target:
    # GOFIPS140 (root .env) selects the Go FIPS 140-3 module for the build.
    dotenv: ['{{.TASKFILE_DIR}}/../../../.env']
    desc: "Build CLI for a specific GOOS/GOARCH target"
    internal: true
    silent: false
    prefix: '{{.GOOS}}-{{.GOARCH}}'
    generates:
      - tmp/bin/ocm-{{ .GOOS }}-{{ .GOARCH }}
      - tmp/resources/ocm-{{ .GOOS }}-{{ .GOARCH }}.yaml
    cmds:
      - cmd: |
          CGO_ENABLED=0 GOOS={{ .GOOS }} GOARCH={{ .GOARCH }} go build \
            -ldflags "-s -w -X ocm.software/open-component-model/bindings/go/cli/cmd/version.BuildVersion={{ .BUILD_VERSION }}" \
            -o {{ .TASKFILE_DIR }}/tmp/bin/ocm-{{ .GOOS }}-{{ .GOARCH }}
      - |
        mkdir -p {{ .TASKFILE_DIR }}/tmp/resources
        cat > {{ .TASKFILE_DIR }}/tmp/resources/ocm-{{ .GOOS }}-{{ .GOARCH }}.yaml <<EOF
        - name: cli
          type: executable
          version: {{ .VERSION }}
          extraIdentity:
            os: {{ .GOOS }}
            architecture: {{ .GOARCH }}
          relation: local
          input:
            type: file
            path: {{ .TASKFILE_DIR }}/tmp/bin/ocm-{{ .GOOS }}-{{ .GOARCH }}
        EOF

  generate/ctf:
    deps:
      - task: generate/component-constructor
      - task: build
    desc: "Generate the component-constructor.yaml and build the CLI for all targets, then generate the CTF containing the Component Version"
    cmd: |
      rm -rf {{ .CTF_LOCATION }}
      {{ .TASKFILE_DIR }}/tmp/bin/ocm add component-versions \
        --constructor {{ .COMPONENT_CONSTRUCTOR_FILE }} \
        --repository {{ .CTF_LOCATION }}

  assemble/ctf:
    desc: "Assemble the CTF from binaries and per-arch images already present in tmp/ without rebuilding (CI join entrypoint)"
    cmds:
      - task: package/image/merge
      - task: assemble/component-constructor
      - ln -sf {{ .TASKFILE_DIR }}/tmp/bin/ocm-{{ .GOOS }}-{{ .GOARCH }} {{ .TASKFILE_DIR }}/tmp/bin/ocm
      - |
        rm -rf {{ .CTF_LOCATION }}
        {{ .TASKFILE_DIR }}/tmp/bin/ocm add component-versions \
          --constructor {{ .COMPONENT_CONSTRUCTOR_FILE }} \
          --repository {{ .CTF_LOCATION }}

  verify/ctf:
    desc: "Verify the CTF by checking the component version and being able to fetch and run the CLI for the Host Architecture"
    silent: true
    vars:
      REFERENCE: '{{ .CTF_LOCATION }}//{{ .PROVIDER }}/{{ .NAME }}'
    dir: '{{ .TASKFILE_DIR }}/tmp/verify-ctf'
    cmd: |
      VERSION=$({{ .TASKFILE_DIR }}/tmp/bin/ocm get component-version {{ .REFERENCE }} -oyaml --loglevel=error | yq .[0].component.version)
      if [ -z "$VERSION" ]; then
        echo "Component version not found in CTF at {{ .REFERENCE }}"
        exit 1
      fi
      echo "Component version found: $VERSION"
      
      {{ .TASKFILE_DIR }}/tmp/bin/ocm download resource {{ .REFERENCE }}:$VERSION \
        --identity name=cli,os={{ .GOOS }},architecture={{ .GOARCH }} \
        --output ./ocm
      
      chmod +x ./ocm
      ./ocm version
  
  

  generate/component-constructor:
    desc: "Generate the component-constructor.yaml by building the CLI for all targets"
    generates:
      - '{{ .COMPONENT_CONSTRUCTOR_FILE }}'
    silent: true
    cmds:
      - task: download/deps
      - task: build/multiarch/image
        silent: true
      - task: assemble/component-constructor

  assemble/component-constructor:
    internal: true
    silent: true
    cmds:
      - |
        cat <<EOF > {{ .COMPONENT_CONSTRUCTOR_FILE }}
        name: {{ .PROVIDER }}/{{ .NAME }}
        version: {{ .VERSION }}
        provider:
          name: {{ .PROVIDER }}
        resources:
        EOF
      - |
        for file in {{ .TASKFILE_DIR }}/tmp/resources/*.yaml; do
          # Indent each line by 2 spaces and append
          cat "$file" >> {{ .COMPONENT_CONSTRUCTOR_FILE }}
        done
      - cat "{{ .COMPONENT_CONSTRUCTOR_FILE }}"

  generate/docs:
    desc: "Generate CLI Markdown documentation"
    cmd: |
      go run {{ .TASKFILE_DIR }}/main.go generate docs \
        --directory {{ .CLI_DOCUMENTATION_DIRECTORY }} \
        --mode {{ .CLI_DOCUMENTATION_MODE }}