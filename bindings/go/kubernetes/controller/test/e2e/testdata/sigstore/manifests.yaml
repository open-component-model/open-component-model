apiVersion: v1
kind: Secret
metadata:
  name: sigstore-ocmconfig
stringData:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: signing.config.ocm.software/v1alpha1
        signature: default
        verifier:
          type: SigstoreVerificationConfiguration/v1alpha1
          certificateOIDCIssuer: https://token.actions.githubusercontent.com
          certificateIdentityRegexp: ^https://github\.com/open-component-model/open-component-model/\.github/workflows/publish-components\.yml@refs/heads/releases/v[0-9]+\.[0-9]+$
---
# The Component reads its OCM config with the permissions of the default service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sigstore-ocm-config-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sigstore-ocmconfig"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sigstore-ocm-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sigstore-ocm-config-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: sigstore-repository
spec:
  repositorySpec:
    # Adjust to your OCM registry if not using the public GHCR release.
    baseUrl: ghcr.io/open-component-model
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: sigstore-component
spec:
  component: ocm.software/ocm
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: sigstore-ocmconfig
  repositoryRef:
    name: sigstore-repository
  # renovate: datasource=github-releases depName=open-component-model/open-component-model
  semver: 0.16.0
  interval: 10m
