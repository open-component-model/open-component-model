apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: deployer-migration-unsuspend
spec:
  repositorySpec:
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: deployer-migration-unsuspend
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/deployer-migration-unsuspend
  repositoryRef:
    name: deployer-migration-unsuspend
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: deployer-migration-unsuspend
spec:
  componentRef:
    name: deployer-migration-unsuspend
  resource:
    byReference:
      resource:
        name: manifest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-migration-unsuspend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-migration-unsuspend
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-migration-unsuspend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-migration-unsuspend
subjects:
  - kind: ServiceAccount
    name: deployer-migration-unsuspend
