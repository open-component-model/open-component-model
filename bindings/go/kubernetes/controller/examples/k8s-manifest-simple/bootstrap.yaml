apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: k8s-manifest-simple-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: k8s-manifest-simple-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/k8s-manifest-simple
  repositoryRef:
    name: k8s-manifest-simple-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: k8s-manifest-simple-resource
spec:
  componentRef:
    name: k8s-manifest-simple-component
  resource:
    byReference:
      resource:
        name: k8s-manifest-resource
---
# The NamespacedDeployer applies and prunes with the permissions of this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-manifest-simple-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-manifest-simple-deployer
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-manifest-simple-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-manifest-simple-deployer
subjects:
  - kind: ServiceAccount
    name: k8s-manifest-simple-deployer
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: k8s-manifest-simple-deployer
spec:
  resourceRef:
    name: k8s-manifest-simple-resource
  serviceAccountName: k8s-manifest-simple-deployer
