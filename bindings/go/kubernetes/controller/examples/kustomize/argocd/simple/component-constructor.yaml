components:
  - name: ocm.software/ocm-k8s-toolkit/examples/kustomize-argocd-simple
    version: "1.0.0"
    provider:
      name: ocm.software
    resources:
      - name: kustomize-resource
        type: ociArtifact
        version: "1.0.0"
        input:
          # ./oci-layout is built from ./kustomize by the test harness before ocm add cv.
          type: dir/v1
          path: ./oci-layout
          mediaType: application/vnd.ocm.software.oci.layout.v1+tar
      - name: kro-rgd
        type: blob
        version: "1.0.0"
        input:
          type: file
          path: ./rgd.yaml
