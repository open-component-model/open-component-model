apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: kustomize-fluxcd-configuration-localization
spec:
  schema:
    apiVersion: v1alpha1
    kind: KustomizeFluxcdConfigurationLocalization
    spec:
      prefix: string | default="kustomize-fluxcd-configuration-localization"
      podinfo:
        message: string | default="hello world"
  resources:
    - id: resourceKustomization
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: "${schema.spec.prefix}-resource-name"
        spec:
          componentRef:
            name: kustomize-fluxcd-configuration-localization-component
          resource:
            byReference:
              resource:
                name: kustomize-resource
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    - id: resourceImage
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: "${schema.spec.prefix}-resource-image-name"
        spec:
          componentRef:
            name: kustomize-fluxcd-configuration-localization-component
          resource:
            byReference:
              resource:
                name: image-resource
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    - id: ocirepository
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: "${schema.spec.prefix}-oci-repository-name"
        spec:
          interval: 1m0s
          insecure: true
          url: oci://${resourceKustomization.status.additional.registry}/${resourceKustomization.status.additional.repository}
          ref:
            digest: ${resourceKustomization.status.additional.digest}
          layerSelector:
            mediaType: "application/vnd.cncf.flux.content.v1.tar+gzip"
            operation: extract
    - id: kustomization
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: "${schema.spec.prefix}-kustomization-name"
        spec:
          targetNamespace: default
          interval: 1m
          prune: true
          sourceRef:
            kind: OCIRepository
            name: ${ocirepository.metadata.name}
          path: "./"
          patches:
            - patch: |
                - op: replace
                  path: /spec/template/spec/containers/0/image
                  value: ${resourceImage.status.additional.registry}/${resourceImage.status.additional.repository}@${resourceImage.status.additional.digest}
              target:
                kind: Deployment
                name: .*
            - patch: |
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: PODINFO_UI_MESSAGE
                    value: ${schema.spec.podinfo.message}
              target:
                kind: Deployment
                name: .*
            - patch: |
                - op: replace
                  path: /metadata/name
                  value: kustomize-fluxcd-configuration-localization-podinfo
                - op: add
                  path: /spec/template/metadata/labels/app.kubernetes.io~1name
                  value: kustomize-fluxcd-configuration-localization-podinfo
              target:
                kind: Deployment
                name: .*
            - patch: |
                apiVersion: autoscaling/v2
                kind: HorizontalPodAutoscaler
                metadata:
                  name: podinfo
                $patch: delete
              target:
                kind: HorizontalPodAutoscaler
                name: .*
