apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: kustomize-fluxcd-simple
spec:
  schema:
    apiVersion: v1alpha1
    kind: KustomizeFluxcdSimple
    spec:
      prefix: string | default="kustomize-fluxcd-simple"
  resources:
    - id: resourceKustomization
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: "${schema.spec.prefix}-resource-name"
        spec:
          componentRef:
            name: kustomize-fluxcd-simple-component
          resource:
            byReference:
              resource:
                name: kustomize-resource
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    - id: ocirepository
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: "${schema.spec.prefix}-oci-repository-name"
        spec:
          interval: 1m0s
          insecure: true
          url: oci://${resourceKustomization.status.additional.registry}/${resourceKustomization.status.additional.repository}
          ref:
            digest: ${resourceKustomization.status.additional.digest}
          layerSelector:
            mediaType: "application/vnd.cncf.flux.content.v1.tar+gzip"
            operation: extract
    - id: kustomization
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: "${schema.spec.prefix}-kustomization-name"
        spec:
          targetNamespace: default
          interval: 1m
          prune: true
          sourceRef:
            kind: OCIRepository
            name: ${ocirepository.metadata.name}
          path: "./"
          patches:
            - patch: |
                - op: replace
                  path: /metadata/name
                  value: kustomize-fluxcd-simple-podinfo
                - op: add
                  path: /spec/template/metadata/labels/app.kubernetes.io~1name
                  value: kustomize-fluxcd-simple-podinfo
              target:
                kind: Deployment
                name: .*
            - patch: |
                apiVersion: autoscaling/v2
                kind: HorizontalPodAutoscaler
                metadata:
                  name: podinfo
                $patch: delete
              target:
                kind: HorizontalPodAutoscaler
                name: .*
