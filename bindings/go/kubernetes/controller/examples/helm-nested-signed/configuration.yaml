apiVersion: v1
kind: ConfigMap
metadata:
  name: helm-nested-signed-plain-http
  namespace: default
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: http.config.ocm.software/v1alpha1
        plainHTTP: true
        hosts:
          ghcr.io:
            plainHTTP: false
---
apiVersion: v1
kind: Secret
metadata:
  name: helm-nested-signed-ocmconfig
  namespace: default
type: Opaque
stringData:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: signing.config.ocm.software/v1alpha1
        signature: ocm.software.helm.nested.signed.rsa
        verifier:
          type: RSASigningConfiguration/v1alpha1

      - type: credentials.config.ocm.software
        consumers:
          - identity:
              type: RSA/v1alpha1
              algorithm: RSASSA-PSS
              signature: ocm.software.helm.nested.signed.rsa
            credentials:
              - type: Credentials/v1
                properties:
                  publicKeyPEM: |
                    -----BEGIN RSA PUBLIC KEY-----
