apiVersion: v1
kind: Secret
metadata:
  name: helm-signing-secret
stringData:
  # Verification is configured through the central OCM configuration. The signing entry selects the
  # verifier, the credentials entry supplies the public key of ocm.software.pub.
  .ocmconfig: |
      type: generic.config.ocm.software/v1
      configurations:
        - type: signing.config.ocm.software/v1alpha1
          signature: ocm.software
          verifier:
            type: RSASigningConfiguration/v1alpha1
        - type: credentials.config.ocm.software
          consumers:
            - identity:
                type: RSA/v1alpha1
                algorithm: RSASSA-PSS
                signature: ocm.software
              credentials:
                - type: Credentials/v1
                  properties:
                    public_key_pem: |
                      -----BEGIN RSA PUBLIC KEY-----
                      MIIBCgKCAQEA14QHDtyZTRWm8Bd7hf5dVzu/uaCrUJe8PXWsc4SFDZ2nEfVZfvFo
                      AuxhQzS1c7gD9YfD0SJzJSFgncecoDA29M0OLYmwjmAfhj9A6mX6mImybzuOaOoj
                      4FJZnJd3rFzNBoKwqoewIHRB/oTzd6HX6fAC53drao/h1hMjE81DrWykXRBgvzBi
                      Vzdgu7FeyLLW6DW15VfLvii/TSVOQOqeLwisxTGbi67Lc//TTgBVBEH96542pvn0
                      Q5nG5JkxFUf6j0q3yd3IOUogPvIo3dp9eGT4oUQM3SI7Jp/MDnM4q2JJclDM/ZYM
                      pXNnoeWZT74FwC7Aq7AZlJHoaDujTgFI4wIDAQAB
                      -----END RSA PUBLIC KEY-----
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: helm-nested-signed-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: helm-nested-signed-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/helm-nested-signed
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: helm-signing-secret
  repositoryRef:
    name: helm-nested-signed-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: helm-nested-signed-resource-nested-rgd
spec:
  componentRef:
    name: helm-nested-signed-component
  resource:
    byReference:
      resource:
        name: kro-rgd
      referencePath:
        - name: nested-signed-extended
        - name: nested-signed-rgd
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Deployer
metadata:
  name: helm-nested-signed-deployer
spec:
  resourceRef:
    name: helm-nested-signed-resource-nested-rgd
    namespace: default