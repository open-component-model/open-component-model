apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: helm-nested-signed-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: helm-nested-signed-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/helm-nested-signed
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: helm-nested-signed-ocmconfig
  repositoryRef:
    name: helm-nested-signed-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: helm-nested-signed-resource-nested-rgd
spec:
  componentRef:
    name: helm-nested-signed-component
  resource:
    byReference:
      resource:
        name: kro-rgd
      referencePath:
        - name: nested-signed-extended
        - name: nested-signed-rgd
---
# The NamespacedDeployer applies the cluster-scoped ResourceGraphDefinition with the permissions of this
# service account, so it needs a ClusterRole for ResourceGraphDefinitions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-nested-signed-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-nested-signed-deployer
rules:
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-nested-signed-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helm-nested-signed-deployer
subjects:
  - kind: ServiceAccount
    name: helm-nested-signed-deployer
    namespace: default
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: helm-nested-signed-deployer
spec:
  resourceRef:
    name: helm-nested-signed-resource-nested-rgd
  serviceAccountName: helm-nested-signed-deployer
