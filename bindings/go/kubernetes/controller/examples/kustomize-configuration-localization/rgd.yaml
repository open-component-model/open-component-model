apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: kustomize-configuration-localization
spec:
  schema:
    apiVersion: v1alpha1
    kind: KustomizeConfigurationLocalization
    spec:
      prefix: string | default="kustomize-configuration-localization"
      podinfo:
        message: string | default="hello world"
  resources:
    - id: resourceKustomization
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: "${schema.spec.prefix}-resource-name"
        spec:
          componentRef:
            name: kustomize-configuration-localization-component
          resource:
            byReference:
              resource:
                name: kustomize-resource
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    - id: resourceImage
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: "${schema.spec.prefix}-resource-image-name"
        spec:
          componentRef:
            name: kustomize-configuration-localization-component
          resource:
            byReference:
              resource:
                name: image-resource
          additionalStatusFields:
            registry: resource.access.toOCI().registry
            repository: resource.access.toOCI().repository
            digest: resource.access.toOCI().digest
    # Deployment using FluxCD (OCI source)
    - id: ocirepository
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: "${schema.spec.prefix}-oci-repository-name"
        spec:
          interval: 1m0s
          insecure: true
          url: oci://${resourceKustomization.status.additional.registry}/${resourceKustomization.status.additional.repository}
          ref:
            digest: ${resourceKustomization.status.additional.digest}
    - id: kustomization
      template:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: "${schema.spec.prefix}-kustomization-name"
        spec:
          targetNamespace: default
          interval: 1m
          prune: true
          sourceRef:
            kind: OCIRepository
            name: ${ocirepository.metadata.name}
          path: "./"
          patches:
            # Localization
            - patch: |
                - op: replace
                  path: /spec/template/spec/containers/0/image
                  value: ${resourceImage.status.additional.registry}/${resourceImage.status.additional.repository}@${resourceImage.status.additional.digest}
              target:
                kind: Deployment
                name: .*
            # Configuration
            - patch: |
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: PODINFO_UI_MESSAGE
                    value: ${schema.spec.podinfo.message}
              target:
                kind: Deployment
                name: .*
            # e2e-test related patch to validate deployment
            - patch: |
                - op: replace
                  path: /metadata/name
                  value: kustomize-configuration-localization-podinfo
                - op: add
                  path: /spec/template/metadata/labels/app.kubernetes.io~1name
                  value: kustomize-configuration-localization-podinfo
              target:
                kind: Deployment
                name: .*
            # Delete podinfo's HPA. The e2e cluster has no metrics-server, so the HPA can never
            # become healthy.
            - patch: |
                apiVersion: autoscaling/v2
                kind: HorizontalPodAutoscaler
                metadata:
                  name: podinfo
                $patch: delete
              target:
                kind: HorizontalPodAutoscaler
                name: .*
    # Deployment using ArgoCD (OCI source)
    - id: argocdApplication
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: "${schema.spec.prefix}"
          namespace: argocd
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: oci://${resourceKustomization.status.additional.registry}/${resourceKustomization.status.additional.repository}
            targetRevision: ${resourceKustomization.status.additional.digest}
            path: "./"
            kustomize:
              patches:
                # Localization
                - patch: '[{"op":"replace","path":"/spec/template/spec/containers/0/image","value":"${resourceImage.status.additional.registry}/${resourceImage.status.additional.repository}@${resourceImage.status.additional.digest}"}]'
                  target:
                    kind: Deployment
                    name: podinfo
                # Configuration
                - patch: '[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"PODINFO_UI_MESSAGE","value":"${schema.spec.podinfo.message}"}}]'
                  target:
                    kind: Deployment
                    name: podinfo
                # e2e-test related patch to validate deployment
                - patch: |
                    - op: replace
                      path: /metadata/name
                      value: kustomize-configuration-localization-podinfo
                    - op: add
                      path: /spec/template/metadata/labels/app.kubernetes.io~1name
                      value: kustomize-configuration-localization-podinfo
                  target:
                    kind: Deployment
                    name: podinfo
                # Delete podinfo's HPA. The e2e cluster has no metrics-server, so the HPA can never
                # become healthy.
                - patch: |
                    apiVersion: autoscaling/v2
                    kind: HorizontalPodAutoscaler
                    metadata:
                      name: podinfo
                    $patch: delete
                  target:
                    kind: HorizontalPodAutoscaler
                    name: podinfo
          destination:
            server: https://kubernetes.default.svc
            namespace: default-argocd
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
