version: '3'

vars:
  OCM_CLI: '{{.OCM_CLI | default (env "OCM_CLI") | default "ocm"}}'
  IMAGE_REGISTRY: '{{.IMAGE_REGISTRY | default (env "IMAGE_REGISTRY") | default "http://ocm-e2e-image-registry:5000"}}'
  EXAMPLE_CONSTRUCTOR: '{{.EXAMPLE_CONSTRUCTOR | default "component-constructor.yaml"}}'

tasks:
  prepare:
    desc: Build and transfer the kustomize-configuration-localization component
    dir: '{{.TASKFILE_DIR}}'
    env:
      OCM_CLI: '{{.OCM_CLI}}'
      IMAGE_REGISTRY: '{{.IMAGE_REGISTRY}}'
    preconditions:
      - sh: test {{shellQuote .EXAMPLE_CONSTRUCTOR}} = component-constructor.yaml
        msg: "kustomize-configuration-localization stages only the file inputs of component-constructor.yaml, so EXAMPLE_CONSTRUCTOR must be component-constructor.yaml."
    cmds:
      - |
        set -euo pipefail
        command -v oras >/dev/null 2>&1 || { echo "oras is required for kustomize-configuration-localization" >&2; exit 1; }
        work="$(mktemp -d)"
        trap 'rm -rf -- "$work"' EXIT
        cp ./component-constructor.yaml "$work/component-constructor.yaml"
        cp ./rgd.yaml ./crossplane-composition.yaml "$work/"
        # gzip -n omits the archive timestamp, so rerunning prepare on the same checkout yields the same layer digest.
        COPYFILE_DISABLE=1 tar -cf - -C ./kustomize . | gzip -n > "$work/kustomize.tar.gz"
        (
          cd "$work"
          oras push --oci-layout ./oci-layout:latest \
            --artifact-type application/vnd.cncf.flux.config.v1+json \
            kustomize.tar.gz:application/vnd.cncf.flux.content.v1.tar+gzip
          "$OCM_CLI" add cv --repository "$work/ctf" --constructor ./component-constructor.yaml
        )
        "$OCM_CLI" transfer cv "ctf::$work/ctf//ocm.software/ocm-k8s-toolkit/examples/kustomize-configuration-localization" \
          "$IMAGE_REGISTRY" --config ./transfer.ocmconfig
