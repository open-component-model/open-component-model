# Crossplane compositions run under the `crossplane` service account. By default
# that account cannot create the resources the example compositions produce, so
# the XR never becomes Ready. The aggregate-to-crossplane label lets Crossplane's
# RBAC manager fold these rules into the crossplane SA automatically, so no
# explicit binding is needed. XR/XRD access is already granted by that manager.
#
# Apply this once per cluster:  kubectl apply -f crossplane-rbac.yaml
#
# This is a single cluster-wide grant covering every example. It grants exactly
# the resource kinds the example compositions create as managed resources;
# `examples.ocm.software` (the XR group) is intentionally omitted because
# Crossplane's RBAC manager already grants the service account access to the
# composite resources it reconciles.
#
# This is example/e2e-scoped RBAC. On a shared cluster, scope it down to the
# groups and namespaces you actually use.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-ocm-resources
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["delivery.ocm.software"]
    resources: ["resources", "resources/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories", "ocirepositories/status", "gitrepositories", "gitrepositories/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations", "kustomizations/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases", "helmreleases/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applications/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
