apiVersion: v1
kind: ConfigMap
metadata:
  name: helm-signing-plain-http
  namespace: default
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: http.config.ocm.software/v1alpha1
        plainHTTP: true
        hosts:
          ghcr.io:
            plainHTTP: false
---
apiVersion: v1
kind: Secret
metadata:
  name: helm-signing-ocmconfig
  namespace: default
type: Opaque
