apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: helm-signing-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: helm-signing-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/helm-signing
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: helm-signing-ocmconfig
  repositoryRef:
    name: helm-signing-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: helm-signing-resource-rgd
spec:
  componentRef:
    name: helm-signing-component
  resource:
    byReference:
      resource:
        name: kro-rgd
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Deployer
metadata:
  name: helm-signing-deployer
spec:
  resourceRef:
    name: helm-signing-resource-rgd
    namespace: default
