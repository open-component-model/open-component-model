apiVersion: v1
kind: Secret
metadata:
  name: helm-signing-secret
stringData:
  # Verification is configured through the central OCM configuration. The signing entry selects the
  # verifier, the credentials entry supplies the public key of ocm.software.pub.
  .ocmconfig: |
      type: generic.config.ocm.software/v1
      configurations:
        - type: signing.config.ocm.software/v1alpha1
          signature: ocm.software
          verifier:
            type: RSASigningConfiguration/v1alpha1
        - type: credentials.config.ocm.software
          consumers:
            - identity:
                type: RSA/v1alpha1
                algorithm: RSASSA-PSS
                signature: ocm.software
              credentials:
                - type: Credentials/v1
                  properties:
                    public_key_pem: |
                      -----BEGIN RSA PUBLIC KEY-----
                      MIIBCgKCAQEA14QHDtyZTRWm8Bd7hf5dVzu/uaCrUJe8PXWsc4SFDZ2nEfVZfvFo
                      AuxhQzS1c7gD9YfD0SJzJSFgncecoDA29M0OLYmwjmAfhj9A6mX6mImybzuOaOoj
                      4FJZnJd3rFzNBoKwqoewIHRB/oTzd6HX6fAC53drao/h1hMjE81DrWykXRBgvzBi
                      Vzdgu7FeyLLW6DW15VfLvii/TSVOQOqeLwisxTGbi67Lc//TTgBVBEH96542pvn0
                      Q5nG5JkxFUf6j0q3yd3IOUogPvIo3dp9eGT4oUQM3SI7Jp/MDnM4q2JJclDM/ZYM
                      pXNnoeWZT74FwC7Aq7AZlJHoaDujTgFI4wIDAQAB
                      -----END RSA PUBLIC KEY-----
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: helm-signing-repository
spec:
  repositorySpec:
    # Adjust to your OCM repository
    baseUrl: http://ocm-e2e-image-registry:5000
    type: OCIRegistry
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: helm-signing-component
spec:
  component: ocm.software/ocm-k8s-toolkit/examples/helm-signing
  ocmConfig:
    - apiVersion: v1
      kind: Secret
      name: helm-signing-secret
  repositoryRef:
    name: helm-signing-repository
  semver: 1.0.0
  interval: 10m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  name: helm-signing-resource-rgd
spec:
  componentRef:
    name: helm-signing-component
  resource:
    byReference:
      resource:
        name: kro-rgd
---
# The NamespacedDeployer applies the cluster-scoped ResourceGraphDefinition with the permissions of this
# service account, so it needs a ClusterRole for ResourceGraphDefinitions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-signing-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-signing-deployer
rules:
  - apiGroups: ["kro.run"]
    resources: ["resourcegraphdefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-signing-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helm-signing-deployer
subjects:
  - kind: ServiceAccount
    name: helm-signing-deployer
    namespace: default
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: helm-signing-deployer
spec:
  resourceRef:
    name: helm-signing-resource-rgd
  serviceAccountName: helm-signing-deployer
