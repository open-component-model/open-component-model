apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: helmconfigurationlocalizationcrossplanes.examples.ocm.software
spec:
  group: examples.ocm.software
  names:
    kind: HelmConfigurationLocalizationCrossplane
    plural: helmconfigurationlocalizationcrossplanes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                prefix:
                  type: string
                  default: helm-configuration-localization-crossplane
                podinfo:
                  type: object
                  properties:
                    message:
                      type: string
                      default: "helm-configuration-localization"
                    releaseName:
                      type: string
                      default: "helm-configuration-localization"
            status:
              type: object
              properties:
                ociRegistry:
                  type: string
                ociRepository:
                  type: string
                ociDigest:
                  type: string
                ociTag:
                  type: string
                imageRegistry:
                  type: string
                imageRepository:
                  type: string
                imageTag:
                  type: string
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: helm-configuration-localization-crossplane
spec:
  compositeTypeRef:
    apiVersion: examples.ocm.software/v1alpha1
    kind: HelmConfigurationLocalizationCrossplane
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: resourceChart
            base:
              apiVersion: delivery.ocm.software/v1alpha1
              kind: Resource
              metadata:
                namespace: default
              spec:
                componentRef:
                  name: helm-configuration-localization-component
                resource:
                  byReference:
                    resource:
                      name: helm-resource
                additionalStatusFields:
                  registry: resource.access.toOCI().registry
                  repository: resource.access.toOCI().repository
                  digest: resource.access.toOCI().digest
                  tag: resource.access.toOCI().tag
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.prefix
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-resource-chart"
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.registry
                toFieldPath: status.ociRegistry
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.repository
                toFieldPath: status.ociRepository
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.digest
                toFieldPath: status.ociDigest
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.tag
                toFieldPath: status.ociTag
          - name: resourceImage
            base:
              apiVersion: delivery.ocm.software/v1alpha1
              kind: Resource
              metadata:
                namespace: default
              spec:
                componentRef:
                  name: helm-configuration-localization-component
                resource:
                  byReference:
                    resource:
                      name: image-resource
                additionalStatusFields:
                  registry: resource.access.toOCI().registry
                  repository: resource.access.toOCI().repository
                  tag: resource.access.toOCI().tag
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.prefix
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-resource-image"
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.registry
                toFieldPath: status.imageRegistry
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.repository
                toFieldPath: status.imageRepository
              - type: ToCompositeFieldPath
                fromFieldPath: status.additional.tag
                toFieldPath: status.imageTag
          # FluxCD delivery via HelmRelease with localization
          - name: ocirepository
            base:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                namespace: default
              spec:
                interval: 1m0s
                insecure: true
                layerSelector:
                  mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
                  operation: copy
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.prefix
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-oci-repository"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.ociRegistry
                    - fromFieldPath: status.ociRepository
                  strategy: string
                  string:
                    fmt: "oci://%s/%s"
                toFieldPath: spec.url
              - type: FromCompositeFieldPath
                fromFieldPath: status.ociDigest
                toFieldPath: spec.ref.digest
          - name: helmrelease
            base:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                namespace: default
              spec:
                interval: 1m
                timeout: 5m
                chartRef:
                  kind: OCIRepository
                  namespace: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.podinfo.releaseName
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.podinfo.releaseName
                toFieldPath: spec.releaseName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.prefix
                toFieldPath: spec.chartRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-oci-repository"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.imageRegistry
                    - fromFieldPath: status.imageRepository
                  strategy: string
                  string:
                    fmt: "%s/%s"
                toFieldPath: spec.values.image.repository
              - type: FromCompositeFieldPath
                fromFieldPath: status.imageTag
                toFieldPath: spec.values.image.tag
              - type: FromCompositeFieldPath
                fromFieldPath: spec.podinfo.message
                toFieldPath: spec.values.ui.message
          # ArgoCD delivery via Application with localization
          - name: argocdApplication
            base:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                namespace: argocd
                finalizers:
                  - resources-finalizer.argocd.argoproj.io
              spec:
                project: default
                source:
                  chart: podinfo
                  helm:
                    releaseName: helm-configuration-localization
                  path: .
                destination:
                  server: https://kubernetes.default.svc
                  namespace: default-argocd
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
                  syncOptions:
                    - CreateNamespace=true
            readinessChecks:
              - type: MatchString
                fieldPath: status.health.status
                matchString: Healthy
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.prefix
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.podinfo.releaseName
                toFieldPath: spec.source.helm.releaseName
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.ociRegistry
                    - fromFieldPath: status.ociRepository
                  strategy: string
                  string:
                    fmt: "oci://%s/%s"
                toFieldPath: spec.source.repoURL
              - type: FromCompositeFieldPath
                fromFieldPath: status.ociTag
                toFieldPath: spec.source.targetRevision
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: status.imageRegistry
                    - fromFieldPath: status.imageRepository
                  strategy: string
                  string:
                    fmt: "%s/%s"
                toFieldPath: spec.source.helm.parameters[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.podinfo.message
                toFieldPath: spec.source.helm.parameters[1].value
    - step: auto-ready
      functionRef:
        name: crossplane-contrib-function-auto-ready
