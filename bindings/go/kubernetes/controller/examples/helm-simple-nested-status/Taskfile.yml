version: '3'

vars:
  OCM_CLI: '{{.OCM_CLI | default (env "OCM_CLI") | default "ocm"}}'
  IMAGE_REGISTRY: '{{.IMAGE_REGISTRY | default (env "IMAGE_REGISTRY") | default "http://ocm-e2e-image-registry:5000"}}'
  EXAMPLE_CONSTRUCTOR: '{{.EXAMPLE_CONSTRUCTOR | default "component-constructor.yaml"}}'

tasks:
  prepare:
    desc: Build and transfer the helm-simple-nested-status component
    dir: '{{.TASKFILE_DIR}}'
    env:
      OCM_CLI: '{{.OCM_CLI}}'
      IMAGE_REGISTRY: '{{.IMAGE_REGISTRY}}'
    cmds:
      - |
        set -eu
        work="$(mktemp -d)"
        trap 'rm -rf -- "$work"' EXIT
        "$OCM_CLI" add cv --repository "$work/ctf" --constructor {{shellQuote .EXAMPLE_CONSTRUCTOR}}
        "$OCM_CLI" transfer cv "ctf::$work/ctf//ocm.software/ocm-k8s-toolkit/examples/helm-simple-nested-status" \
          "$IMAGE_REGISTRY" --config ./transfer.ocmconfig
