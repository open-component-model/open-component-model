# The NamespacedDeployer applies and prunes with the permissions of this service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: applyset-pruning-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: applyset-pruning-deployer
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: applyset-pruning-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: applyset-pruning-deployer
subjects:
  - kind: ServiceAccount
    name: applyset-pruning-deployer
---
apiVersion: delivery.ocm.software/v1alpha1
kind: NamespacedDeployer
metadata:
  name: applyset-pruning-deployer
spec:
  resourceRef:
    name: applyset-pruning-resource
  serviceAccountName: applyset-pruning-deployer
