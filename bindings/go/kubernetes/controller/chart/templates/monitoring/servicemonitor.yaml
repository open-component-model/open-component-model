{{- if .Values.prometheus.enable }}
{{- $_ := include "ocm-k8s-toolkit.prometheusMetricsPort" . }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
    - path: /metrics
      {{- /* Port name of monitoring/service.yaml. */}}
      port: metrics
      {{- if .Values.manager.metricsServer.secure }}
      scheme: https
      tlsConfig:
        {{- /* The manager generates its own certificate at startup and cannot load one from a secret, so there is no CA to verify against. */}}
        insecureSkipVerify: true
      {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      control-plane: controller-manager
{{- end }}
