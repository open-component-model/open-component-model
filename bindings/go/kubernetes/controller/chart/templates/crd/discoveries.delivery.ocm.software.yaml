{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- if .Values.crd.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if and .Values.webhook.enable .Values.certManager.enable }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  name: discoveries.delivery.ocm.software
spec:
  {{- if .Values.webhook.enable }}
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "webhook-service" "context" $) }}
          namespace: {{ .Release.Namespace }}
          path: /convert
      conversionReviewVersions:
        - v1
  {{- end }}
  group: delivery.ocm.software
  names:
    kind: Discovery
    listKind: DiscoveryList
    plural: discoveries
    singular: discovery
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Indicates if the Discovery is Ready
      jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Ready
      priority: 1
      type: string
    - description: Displays the Age of the Resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Discovery is the Schema for the discoveries API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiscoverySpec defines the desired state of Discovery.
            properties:
              componentRef:
                description: |-
                  ComponentRef is a reference to a Component in the same namespace whose
                  transitive component graph is discovered.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: name must not be empty
                  rule: self.name.size() > 0
              componentSelector:
                description: |-
                  ComponentSelector filters the components of the filtered graph.
                  If unset, all components are kept.
                properties:
                  expression:
                    description: |-
                      Expression is a CEL expression evaluated for each element. It must
                      evaluate to a boolean. An empty expression is a no-op.
                    type: string
                  matchIdentity:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchIdentity matches elements whose identity contains all specified
                      key-value pairs. Keys must be present even when compared against an
                      empty value.
                    type: object
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchLabels matches elements carrying labels with the specified string
                      values. Non-string label values are matched via Expression only.
                    type: object
                type: object
              extract:
                description: |-
                  Extract projects the filtered components into free-form records
                  published in status.extracted. If unset, the filtered raw v2 descriptors
                  are published in status.components instead.
                properties:
                  byComponents:
                    additionalProperties:
                      type: string
                    description: |-
                      ByComponents evaluates each map value as a CEL expression once per
                      surviving component with the binding component. An explicitly empty map
                      emits one empty record per component.
                    type: object
                  byResources:
                    additionalProperties:
                      type: string
                    description: |-
                      ByResources evaluates each map value as a CEL expression once per
                      surviving (component, resource) pair with the bindings component and
                      resource. An explicitly empty map emits one empty record per pair.
                    type: object
                  expression:
                    description: |-
                      Expression is a single CEL expression evaluated once over the complete
                      filtered descriptor list with the binding components. It must evaluate
                      to a list of objects.
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of byResources, byComponents, or expression
                    must be specified
                  rule: '(has(self.byResources) ? 1 : 0) + (has(self.byComponents)
                    ? 1 : 0) + (has(self.expression) ? 1 : 0) == 1'
              ocmConfig:
                description: |-
                  OCMConfig defines references to secrets, config maps or ocm api
                  objects providing configuration data including credentials.
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource" || self.kind == "Replication" || self.kind == "Discovery"))
                type: array
              referenceSelector:
                description: |-
                  ReferenceSelector filters the references of all resolved descriptors.
                  Only reference targets with at least one matching incoming reference are
                  kept. If unset, all references (and the root component) are kept.
                properties:
                  expression:
                    description: |-
                      Expression is a CEL expression evaluated for each element. It must
                      evaluate to a boolean. An empty expression is a no-op.
                    type: string
                  matchIdentity:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchIdentity matches elements whose identity contains all specified
                      key-value pairs. Keys must be present even when compared against an
                      empty value.
                    type: object
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchLabels matches elements carrying labels with the specified string
                      values. Non-string label values are matched via Expression only.
                    type: object
                type: object
              resourceSelector:
                description: |-
                  ResourceSelector filters the resources of each surviving component.
                  Components with zero surviving resources are kept. If unset, all
                  resources are kept.
                properties:
                  expression:
                    description: |-
                      Expression is a CEL expression evaluated for each element. It must
                      evaluate to a boolean. An empty expression is a no-op.
                    type: string
                  matchIdentity:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchIdentity matches elements whose identity contains all specified
                      key-value pairs. Keys must be present even when compared against an
                      empty value.
                    type: object
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      MatchLabels matches elements carrying labels with the specified string
                      values. Non-string label values are matched via Expression only.
                    type: object
                type: object
              suspend:
                description: |-
                  Suspend tells the controller to suspend the reconciliation of this
                  Discovery.
                type: boolean
            required:
            - componentRef
            type: object
          status:
            description: DiscoveryStatus defines the observed state of Discovery.
            properties:
              components:
                description: |-
                  Components contains the filtered raw v2 descriptors of the discovered
                  graph, sorted lexicographically by (component.name, component.version).
                  It is only set when spec.extract is unset. A selected but empty result
                  is an empty list; an uncomputed result is absent.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              conditions:
                description: Conditions holds the conditions for the Discovery.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effectiveOCMConfig:
                description: |-
                  EffectiveOCMConfig specifies the entirety of config maps and secrets
                  whose configuration data was applied to the Discovery reconciliation,
                  in the order the configuration data was applied.
                items:
                  description: |-
                    OCMConfiguration defines a configuration applied to the reconciliation of an
                    ocm k8s object as well as the policy for its propagation of this
                    configuration.
                  properties:
                    apiVersion:
                      description: API version of the referent, if not specified the
                        Kubernetes preferred version will be used.
                      type: string
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent, when not specified it
                        acts as LocalObjectReference.
                      type: string
                    policy:
                      default: Propagate
                      description: |-
                        Policy affects the propagation behavior of the configuration. If set to
                        ConfigurationPolicyPropagate other ocm api objects can reference this
                        object to reuse this configuration.
                      enum:
                      - Propagate
                      - DoNotPropagate
                      type: string
                  required:
                  - kind
                  - name
                  - policy
                  type: object
                  x-kubernetes-validations:
                  - message: apiVersion must be one of "v1" with kind "Secret" or
                      "ConfigMap" or "delivery.ocm.software/v1alpha1" with the kind
                      of an OCM kubernetes object
                    rule: ((!has(self.apiVersion) || self.apiVersion == "" || self.apiVersion
                      == "v1") && (self.kind == "Secret" || self.kind == "ConfigMap"))
                      || (self.apiVersion == "delivery.ocm.software/v1alpha1" && (self.kind
                      == "Repository" || self.kind == "Component" || self.kind ==
                      "Resource" || self.kind == "Replication" || self.kind == "Discovery"))
                type: array
              extracted:
                description: |-
                  Extracted contains the records projected from the filtered components
                  by spec.extract. It is only set when spec.extract is set. A selected but
                  empty result is an empty list; an uncomputed result is absent.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the last observed generation of the Discovery
                  object.
                format: int64
                type: integer
            type: object
            x-kubernetes-validations:
            - message: components and extracted cannot be set at the same time
              rule: '!(has(self.components) && has(self.extracted))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
