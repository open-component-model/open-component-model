{{- /* dig: a helm upgrade --reuse-values from a release without these keys must not fail */}}
{{- if and (gt (int .Values.manager.replicas) 1) (not (dig "leaderElection" "enabled" true .Values.manager)) }}
{{- fail "manager.replicas > 1 requires manager.leaderElection.enabled=true to prevent concurrent reconcilers from racing on the same resources" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        control-plane: controller-manager
    name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager" "context" $) }}
    namespace: {{ .Release.Namespace }}
spec:
    replicas: {{ .Values.manager.replicas }}
    selector:
        matchLabels:
            app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            control-plane: controller-manager
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
                {{- /* The controller reads its OCM config only at startup, so a change must restart the pods. */}}
                {{- if .Values.manager.ocmConfig }}
                checksum/ocm-config: {{ include (print $.Template.BasePath "/manager/ocm-config.yaml") . | sha256sum }}
                {{- end }}
            labels:
                app.kubernetes.io/name: {{ include "ocm-k8s-toolkit.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                control-plane: controller-manager
        spec:
            {{- with .Values.manager.tolerations }}
            tolerations: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.affinity }}
            affinity: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.nodeSelector }}
            nodeSelector: {{ toYaml . | nindent 16 }}
            {{- end }}
            {{- with .Values.manager.imagePullSecrets }}
            imagePullSecrets: {{ toYaml . | nindent 16 }}
            {{- end }}
            containers:
                - args:
                    {{- /* dig: a helm upgrade --reuse-values from a release without these keys must not fail */}}
                    {{- /* Health probe */}}
                    - --health-probe-bind-address={{ dig "healthProbe" "bindAddress" ":8081" .Values.manager | default ":8081" }}
                    {{- /* Metrics */}}
                    {{- with dig "metricsServer" "bindAddress" "0" .Values.manager }}
                    - --metrics-bind-address={{ . }}
                    {{- end }}
                    {{- if dig "metricsServer" "secure" false .Values.manager }}
                    - --metrics-secure
                    {{- end }}
                    {{- if dig "metricsServer" "enableHttp2" false .Values.manager }}
                    - --enable-http2
                    {{- end }}
                    {{- /* Leader election */}}
                    {{- if dig "leaderElection" "enabled" true .Values.manager }}
                    - --leader-elect
                    {{- end }}
                    {{- /* Concurrency */}}
                    {{- with .Values.manager.concurrency }}
                    {{- if .repository }}
                    - --repository-controller-concurrency={{ .repository }}
                    {{- end }}
                    {{- if .component }}
                    - --component-controller-concurrency={{ .component }}
                    {{- end }}
                    {{- if .resource }}
                    - --resource-controller-concurrency={{ .resource }}
                    {{- end }}
                    {{- if .deployer }}
                    - --deployer-controller-concurrency={{ .deployer }}
                    {{- end }}
                    {{- if .replication }}
                    - --replication-controller-concurrency={{ .replication }}
                    {{- end }}
                    {{- if .discovery }}
                    - --discovery-controller-concurrency={{ .discovery }}
                    {{- end }}
                    {{- end }}
                    {{- /* Rate limiter */}}
                    {{- with .Values.manager.rateLimiter }}
                    {{- with .repository }}
                    {{- if hasKey . "qps" }}
                    - --repository-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --repository-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .component }}
                    {{- if hasKey . "qps" }}
                    - --component-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --component-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .resource }}
                    {{- if hasKey . "qps" }}
                    - --resource-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --resource-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .replication }}
                    {{- if hasKey . "qps" }}
                    - --replication-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --replication-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .discovery }}
                    {{- if hasKey . "qps" }}
                    - --discovery-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --discovery-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .deployer }}
                    {{- if hasKey . "qps" }}
                    - --deployer-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --deployer-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- with .namespacedDeployer }}
                    {{- if hasKey . "qps" }}
                    - --namespaced-deployer-controller-rate-limit-qps={{ .qps }}
                    {{- end }}
                    {{- if .burst }}
                    - --namespaced-deployer-controller-rate-limit-burst={{ int .burst }}
                    {{- end }}
                    {{- end }}
                    {{- end }}
                    {{- /* Cache */}}
                    {{- with .Values.manager.cache }}
                    {{- if .deployerDownloadSize }}
                    - --deployer-download-cache-size={{ .deployerDownloadSize }}
                    {{- end }}
                    {{- if hasKey . "deployerDownloadMaxResourceSize" }}
                    - --deployer-download-max-resource-size={{ .deployerDownloadMaxResourceSize }}
                    {{- end }}
                    {{- end }}
                    {{- if .Values.manager.ocmConfig }}
                    - --ocm-config=/etc/ocm/config.yaml
                    {{- end }}
                    {{- /* Deployers */}}
                    - --enable-deployer={{ dig "deployer" "enabled" true .Values.manager }}
                    - --enable-namespaced-deployer={{ dig "namespacedDeployer" "enabled" true .Values.manager }}
                    {{- /* Logging */}}
                    {{- with .Values.manager.logging }}
                    {{- if .level }}
                    - --zap-log-level={{ .level }}
                    {{- end }}
                    {{- if .development }}
                    - --zap-devel
                    {{- end }}
                    {{- if .encoder }}
                    - --zap-encoder={{ .encoder }}
                    {{- end }}
                    {{- end }}
                    {{- /* Extra args */}}
                    {{- range .Values.manager.extraArgs }}
                    - {{ . }}
                    {{- end }}
                  command:
                    - /manager
                  image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag }}"
                  imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
                  {{- with .Values.manager.env }}
                  env: {{ toYaml . | nindent 20 }}
                  {{- end }}
                  livenessProbe:
                    httpGet:
                        path: {{ dig "livenessProbe" "path" "/healthz" .Values.manager }}
                        port: {{ dig "livenessProbe" "port" 8081 .Values.manager }}
                    initialDelaySeconds: {{ dig "livenessProbe" "initialDelaySeconds" 15 .Values.manager }}
                    periodSeconds: {{ dig "livenessProbe" "periodSeconds" 20 .Values.manager }}
                  name: manager
                  {{- $metricsPort := include "ocm-k8s-toolkit.metricsPort" . }}
                  {{- if or $metricsPort .Values.webhook.enable }}
                  ports:
                    {{- if $metricsPort }}
                    {{- /* monitoring/service.yaml targets this port by name. */}}
                    - containerPort: {{ $metricsPort }}
                      name: metrics
                      protocol: TCP
                    {{- end }}
                    {{- if .Values.webhook.enable }}
                    - containerPort: 9443
                      name: webhook-server
                      protocol: TCP
                    {{- end }}
                  {{- end }}
                  readinessProbe:
                    httpGet:
                        path: {{ dig "readinessProbe" "path" "/readyz" .Values.manager }}
                        port: {{ dig "readinessProbe" "port" 8081 .Values.manager }}
                    initialDelaySeconds: {{ dig "readinessProbe" "initialDelaySeconds" 5 .Values.manager }}
                    periodSeconds: {{ dig "readinessProbe" "periodSeconds" 10 .Values.manager }}
                  resources:
                    {{- if .Values.manager.resources }}
                    {{- toYaml .Values.manager.resources | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  securityContext:
                    {{- if .Values.manager.securityContext }}
                    {{- toYaml .Values.manager.securityContext | nindent 20 }}
                    {{- else }}
                    {}
                    {{- end }}
                  volumeMounts:
                    - mountPath: /data
                      name: data
                    - mountPath: /tmp
                      name: tmp
                    {{- if .Values.manager.ocmConfig }}
                    - mountPath: /etc/ocm
                      name: ocm-config
                      readOnly: true
                    {{- end }}
                    {{- if .Values.webhook.enable }}
                    - mountPath: /tmp/k8s-webhook-server/serving-certs
                      name: cert
                      readOnly: true
                    {{- end }}
            securityContext:
              {{- if .Values.manager.podSecurityContext }}
              {{- toYaml .Values.manager.podSecurityContext | nindent 14 }}
              {{- else }}
              {}
              {{- end }}
            serviceAccountName: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "controller-manager" "context" $) }}
            terminationGracePeriodSeconds: 10
            volumes:
                - emptyDir: {}
                  name: data
                - emptyDir: {}
                  name: tmp
                {{- if .Values.manager.ocmConfig }}
                - name: ocm-config
                  configMap:
                    name: {{ include "ocm-k8s-toolkit.resourceName" (dict "suffix" "ocm-config" "context" $) }}
                {{- end }}
                {{- if .Values.webhook.enable }}
                - name: cert
                  secret:
                    defaultMode: 420
                    secretName: {{ .Values.webhook.certSecret | default (include "ocm-k8s-toolkit.resourceName" (dict "suffix" "webhook-server-cert" "context" $)) }}
                {{- end }}
