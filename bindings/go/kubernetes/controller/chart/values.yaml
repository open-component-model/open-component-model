# -- String to partially override chart.fullname template (will maintain the release name)
# nameOverride: ""

# -- String to fully override chart.fullname template
# fullnameOverride: ""

## Configure the controller manager deployment
manager:
  # -- Number of controller manager replicas
  replicas: 1
  image:
    # -- Controller image repository
    repository: ghcr.io/open-component-model/kubernetes/controller
    # -- Controller image tag
    tag: latest@sha256:31080f0528b5893778d598e9d605189858a4d5d3463a5b938127a5563638478f
    # -- Image pull policy
    pullPolicy: IfNotPresent
  ## Cluster-scoped Deployer
  deployer:
    # -- Run the controller for the cluster-scoped Deployer. It applies with the permissions of the controller itself.
    # Deprecated: Use NamespacedDeployer instead.
    enabled: true
  ## NamespacedDeployer
  namespacedDeployer:
    # -- Run the controller for the NamespacedDeployer and grant the controller permission to impersonate service accounts. A NamespacedDeployer without spec.serviceAccountName impersonates the default service account of its namespace.
    enabled: true
  ## Controller concurrency settings
  concurrency:
    # -- Number of active repository controller workers
    repository: 4 # @schema minimum:1
    # -- Number of active component controller workers
    component: 4 # @schema minimum:1
    # -- Number of active resource controller workers
    resource: 4 # @schema minimum:1
    # -- Number of active workers per enabled deployer controller (Deployer and NamespacedDeployer)
    deployer: 4 # @schema minimum:1
    # -- Number of active replication controller workers
    replication: 4 # @schema minimum:1
    # -- Number of active discovery controller workers
    discovery: 4 # @schema minimum:1
  ## Workqueue rate limiter of every controller.
  ## New objects pass through it once, and so do retries after an error.
  rateLimiter:
    repository:
      # -- (float) Requeues per second the Repository controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Repository controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    component:
      # -- (float) Requeues per second the Component controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Component controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    resource:
      # -- (float) Requeues per second the Resource controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Resource controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    replication:
      # -- (float) Requeues per second the Replication controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Replication controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    discovery:
      # -- (float) Requeues per second the Discovery controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Discovery controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    deployer:
      # -- (float) Requeues per second the Deployer controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the Deployer controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
    namespacedDeployer:
      # -- (float) Requeues per second the NamespacedDeployer controller admits once its burst is used up. A float greater than 0, e.g. 0.1.
      qps: 10 # @schema type:[number, string]
      # -- Requeues the NamespacedDeployer controller admits at once before qps applies. Must be at least 1.
      burst: 100 # @schema minimum:1
  ## Cache settings
  cache:
    # -- Maximum size of the deployer download object LRU cache
    deployerDownloadSize: 1000
    # -- Maximum size of a single downloadable resource as a Kubernetes resource.Quantity (e.g. "2Mi", "512Ki"). "0" disables the limit.
    deployerDownloadMaxResourceSize: "2Mi"
  ## Logging configuration (zap logger)
  logging:
    # -- Zap log level: 'debug', 'info', 'error', 'panic' or integer > 0
    level: "info"
    # -- Enable development mode (console encoder, debug level, warn stacktrace)
    development: false
    # -- Log encoding: 'json' or 'console'
    encoder: "json"
  ## Leader election
  leaderElection:
    # -- Enable leader election for controller manager
    enabled: true
  ## Health and metrics endpoints
  healthProbe:
    # -- Address the health probe endpoint binds to
    bindAddress: ":8081"
  ## Liveness probe configuration
  livenessProbe:
    # -- Path for the liveness probe
    path: /healthz
    # -- Port for the liveness probe
    port: 8081
    # -- Initial delay before starting liveness probes
    initialDelaySeconds: 15
    # -- Period between liveness probes
    periodSeconds: 20
  ## Readiness probe configuration
  readinessProbe:
    # -- Path for the readiness probe
    path: /readyz
    # -- Port for the readiness probe
    port: 8081
    # -- Initial delay before starting readiness probes
    initialDelaySeconds: 5
    # -- Period between readiness probes
    periodSeconds: 10
  metricsServer:
    # -- Address the metric endpoint binds to. Set to "0" to disable
    bindAddress: "0"
    # -- Serve metrics endpoint securely
    secure: false
    # -- Enable HTTP/2 for metrics and webhook servers
    enableHttp2: false
  # -- Extra arguments to pass to the controller
  extraArgs: []
  # -- Environment variables for the controller
  env: []
  # -- Image pull secrets for the controller
  imagePullSecrets: []
  # -- Pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # -- Pod affinity rules
  affinity: {}
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Pod tolerations
  tolerations: []
  ## Network policy for the controller manager pods
  networkPolicy:
    # -- Enable NetworkPolicy for the controller manager
    enabled: false
    # -- Extra ingress rules appended after the default rule, which admits the health-probe port and, if enabled, the metrics and webhook ports
    ingress: []
    # -- Egress rules replacing the defaults (DNS on 53, TCP 443 and 6443 to any destination). Set this to reach registries on other ports; it replaces all defaults, so include DNS. Leave empty to keep defaults
    egress: []
## Helper RBAC roles for managing custom resources
rbacHelpers:
  # -- Install convenience admin/editor/viewer roles for CRDs
  enable: false
  # -- Install ClusterRoles that aggregate OCM resource permissions into the built-in `admin`, `edit` and `view` cluster roles
  aggregateToDefaultRoles: true
## Custom Resource Definitions
crd:
  # -- Install CRDs with the chart
  enable: true
  # -- Keep CRDs when uninstalling
  keep: true
## Webhook configuration
webhook:
  # -- Enable conversion webhook for CRD version conversion
  enable: false
  # -- Secret name for webhook TLS certificates (when not using cert-manager, create this secret manually)
  certSecret: ""
## Cert-manager integration
certManager:
  # -- Enable cert-manager for TLS certificates
  enable: false
## Prometheus ServiceMonitor
prometheus:
  # -- Enable Prometheus ServiceMonitor (requires prometheus-operator)
  enable: false
