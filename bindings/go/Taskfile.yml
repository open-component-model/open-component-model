version: '3'

tasks:
  build/plugins:
    # GOFIPS140 (root .env): test plugins and suites use the shipped FIPS module.
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    dir: plugin
    cmds:
      - go build -o tmp/testdata/test-plugin-component-version internal/testplugin-component-version/main.go
      - go build -o tmp/testdata/test-plugin-resource internal/testplugin-resource/main.go
      - go build -o tmp/testdata/test-plugin-input internal/testplugin-input/main.go
      - go build -o tmp/testdata/test-plugin-digester internal/testplugin-digester/main.go
      - go build -o tmp/testdata/test-plugin-blobtransformer internal/testplugin-blobtransformer/main.go
      - go build -o tmp/testdata/test-plugin-signinghandler internal/testplugin-signinghandler/main.go
      - go build -o tmp/testdata/test-plugin-component-lister internal/testplugin-component-lister/main.go
      - go build -o tmp/testdata/test-plugin-credential-repository internal/testplugin-credential-repository/main.go

  test:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    deps: [build/plugins]
    cmds:
      - >
        go test -short -skip "Integration" -count=1
        -coverprofile=coverage.unit.out -covermode=atomic
        $(go list ./... | grep -v /integration | grep -v /kubernetes/controller/test/e2e)
        {{.CLI_ARGS}}
      # Drop generated files (zz_generated.*) so the number reflects hand-written code.
      - grep -v 'zz_generated\.' coverage.unit.out > coverage.unit.out.tmp && mv coverage.unit.out.tmp coverage.unit.out

  # Unit tests in strict FIPS 140-3 mode, on demand only (not part of CI):
  # surfaces code paths that use non-approved algorithms, which the default
  # fips140=on mode allows silently.
  test/fips140-only:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    deps: [build/plugins]
    env:
      GODEBUG: fips140=only
    cmds:
      - >
        go test -short -skip "Integration" -count=1
        $(go list ./... | grep -v /integration | grep -v /kubernetes/controller/test/e2e)
        {{.CLI_ARGS}}

  test/integration:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    set: [errexit]
    vars:
      SIGSTORE_INTEGRATION_DIR: '{{.TASKFILE_DIR}}/sigstore/integration'
    cmds:
      - task -d '{{.SIGSTORE_INTEGRATION_DIR}}' setup
      - |
        export PATH="{{.SIGSTORE_INTEGRATION_DIR}}/tmp/bin:$PATH"
        . "{{.SIGSTORE_INTEGRATION_DIR}}/tmp/sigstore-env.sh"
        # Binary coverage dir: each (re)run appends its own covcounters/covmeta,
        # so a flake that passes on retry does NOT clobber the profile (unlike a
        # single -coverprofile, which gotestsum's final rerun overwrites).
        rm -rf coverage.integration.covdir && mkdir -p coverage.integration.covdir
        go run gotest.tools/gotestsum@"${GOTESTSUM_VERSION}" \
          --format testname \
          --junitfile=junit.xml \
          --rerun-fails=2 \
          --rerun-fails-max-failures=5 \
          --packages="./..." \
          -- -run "Integration" -count=1 -coverpkg=./... -args -test.gocoverdir="$PWD/coverage.integration.covdir"
        # Merge every run's data into one profile. -args passes gocoverdir to the
        # test binary without fighting gotestsum's flag ordering.
        go tool covdata textfmt -i=coverage.integration.covdir -o coverage.integration.out
        # Drop generated files (zz_generated.*) so the number reflects hand-written code.
        grep -v 'zz_generated\.' coverage.integration.out > coverage.integration.out.tmp && mv coverage.integration.out.tmp coverage.integration.out
        go tool cover -func=coverage.integration.out | tail -1
        # -coverpkg=./... credits library code the flows exercise (the integration
        # packages themselves are near-empty).
