version: '3'

vars:
  # Coverage profiles.
  OUT_DIR: '{{.TASKFILE_DIR}}/output'
  # Integration test groups: package lists. Every package in a group is an integration package: the unit
  # task excludes it and test/integration runs it. Every <area>/integration package must be in a group, and
  # no package may be in two (enforced by test/integration:groups:verify). CI runs one job per group and
  # provisions what that group needs, so a test goes into a package of the group that provides its
  # external systems (see testenv.Require).
  INTEGRATION_GROUPS: containers sigstore
  INTEGRATION_GROUP_containers: >-
    ./cli/integration/...
    ./constructor/integration/...
    ./examples/...
    ./git/integration/...
    ./github/integration/...
    ./gpg/integration/...
    ./helm/integration/...
    ./http/integration/...
    ./oci/integration/...
    ./s3/integration/...
    ./transfer/integration/...
    ./wget/integration/...
  INTEGRATION_GROUP_sigstore: ./sigstore/integration/...
  INTEGRATION_PACKAGES: >-
    {{range $g := splitList " " .INTEGRATION_GROUPS}}{{index $ (print "INTEGRATION_GROUP_" $g)}} {{end}}

tasks:
  build/plugins:
    # GOFIPS140 (root .env): test plugins and suites use the shipped FIPS module.
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    dir: plugin
    cmds:
      - go build -o tmp/testdata/test-plugin-component-version internal/testplugin-component-version/main.go
      - go build -o tmp/testdata/test-plugin-resource internal/testplugin-resource/main.go
      - go build -o tmp/testdata/test-plugin-input internal/testplugin-input/main.go
      - go build -o tmp/testdata/test-plugin-digester internal/testplugin-digester/main.go
      - go build -o tmp/testdata/test-plugin-blobtransformer internal/testplugin-blobtransformer/main.go
      - go build -o tmp/testdata/test-plugin-signinghandler internal/testplugin-signinghandler/main.go
      - go build -o tmp/testdata/test-plugin-component-lister internal/testplugin-component-lister/main.go
      - go build -o tmp/testdata/test-plugin-credential-repository internal/testplugin-credential-repository/main.go

  test:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    deps: [build/plugins]
    cmds:
      - mkdir -p '{{.OUT_DIR}}'
      # -coverpkg=./... credits code exercised from other packages' tests (e.g. CLI
      # subcommands driven through cli/cmd via test.OCM), not only the package under test.
      # Packages of an integration group run via test/integration only.
      - >
        go test -count=1
        -coverprofile='{{.OUT_DIR}}/coverage.unit.out' -covermode=atomic -coverpkg=./...
        $(go list ./... | grep -vxF -f <(go list {{.INTEGRATION_PACKAGES}}) | grep -v /kubernetes/controller/test/e2e)
        {{.CLI_ARGS}}
      # Drop generated files (zz_generated.*) so the number reflects hand-written code.
      - grep -v 'zz_generated\.' '{{.OUT_DIR}}/coverage.unit.out' > '{{.OUT_DIR}}/coverage.unit.out.tmp' && mv '{{.OUT_DIR}}/coverage.unit.out.tmp' '{{.OUT_DIR}}/coverage.unit.out'

  test/integration:
    desc: >-
      Run integration tests of GROUP (one of INTEGRATION_GROUPS), default every group.
      Tests whose external system is missing skip with a hint.
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    vars:
      PACKAGES: '{{if .GROUP}}{{index . (print "INTEGRATION_GROUP_" .GROUP)}}{{else}}{{.INTEGRATION_PACKAGES}}{{end}}'
      COVERPROFILE: '{{.COVERPROFILE | default (print .OUT_DIR "/coverage.integration.out")}}'
      # Set JUNIT to a path to also write a JUnit report (CI): go test runs with -v, its output is kept
      # next to the report and converted by go-junit-report, also when tests fail.
      TEST_LOG: '{{if .JUNIT}}{{.JUNIT}}.log{{end}}'
    preconditions:
      - sh: test -n "{{trim .PACKAGES}}"
        msg: "unknown GROUP '{{.GROUP}}'; groups: {{.INTEGRATION_GROUPS}}"
    cmds:
      - mkdir -p '{{.OUT_DIR}}'
      - defer: >-
          {{if .JUNIT}}go run github.com/jstemmer/go-junit-report/v2@"${GO_JUNIT_REPORT_VERSION}"
          -in '{{.TEST_LOG}}' -out '{{.JUNIT}}'{{else}}true{{end}}
      # The packages mostly wait on containers, not CPU, so run more of them at once than there are CPUs.
      # -coverpkg=./... credits library code the flows exercise (the integration packages themselves are near-empty).
      - >
        {{if .JUNIT}}set -o pipefail;{{end}}
        go test {{if .JUNIT}}-v{{end}} -count=1 -p 16
        -coverprofile='{{.COVERPROFILE}}' -covermode=atomic -coverpkg=./...
        {{trim .PACKAGES}} {{.CLI_ARGS}}
        {{if .JUNIT}}2>&1 | tee '{{.TEST_LOG}}'{{end}}

  test/integration:groups:
    desc: "Print INTEGRATION_GROUPS as a JSON array (CI matrix input)."
    silent: true
    cmd: echo '{{splitList " " .INTEGRATION_GROUPS | toJson}}'

  test/integration:groups:verify:
    desc: "Fail unless every <area>/integration package is in an integration group and no package is in two."
    cmds:
      - |
        grouped=$({{range $g := splitList " " .INTEGRATION_GROUPS}}go list {{index $ (print "INTEGRATION_GROUP_" $g)}}; {{end}})
        dups=$(echo "$grouped" | sort | uniq -d)
        ungrouped=$(go list ./... | grep -e '/integration$' -e '/integration/' | grep -vxF -f <(echo "$grouped") || true)
        [ -z "$dups" ] || { echo "packages in more than one integration group:" >&2; echo "$dups" >&2; }
        [ -z "$ungrouped" ] || { echo "integration packages in no INTEGRATION_GROUP_*:" >&2; echo "$ungrouped" >&2; }
        [ -z "$dups" ] && [ -z "$ungrouped" ]
