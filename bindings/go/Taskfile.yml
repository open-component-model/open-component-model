version: '3'

vars:
  # Coverage profiles and junit reports. Absolute so the sigstore exec wrapper,
  # which runs in the caller's working dir, writes to the same place.
  OUT_DIR: '{{.TASKFILE_DIR}}/output'

tasks:
  build/plugins:
    # GOFIPS140 (root .env): test plugins and suites use the shipped FIPS module.
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    dir: plugin
    vars:
      # test/wine cross-builds with GOOS=windows EXE=.exe.
      EXE: '{{.EXE | default exeExt}}'
    env:
      GOOS: '{{.GOOS}}'
    cmds:
      - for: [component-version, resource, input, digester, blobtransformer, signinghandler, component-lister, credential-repository]
        cmd: go build -o tmp/testdata/test-plugin-{{.ITEM}}{{.EXE}} internal/testplugin-{{.ITEM}}/main.go

  test:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    deps: [build/plugins]
    cmds:
      - mkdir -p '{{.OUT_DIR}}'
      # -coverpkg=./... credits code exercised from other packages' tests (e.g. CLI
      # subcommands driven through cli/cmd via test.OCM), not only the package under test.
      # On Windows the controller is skipped: it ships as a Linux image only, and
      # controller-runtime's envtest does not compile for windows.
      - >
        go test -short -skip "Integration" -count=1
        -coverprofile='{{.OUT_DIR}}/coverage.unit.out' -covermode=atomic -coverpkg=./...
        $(go list ./... | grep -v /integration | grep -v /kubernetes/controller/test/e2e{{if eq OS "windows"}} | grep -v /kubernetes/controller/{{end}})
        {{.CLI_ARGS}}
      # Drop generated files (zz_generated.*) so the number reflects hand-written code.
      - grep -v 'zz_generated\.' '{{.OUT_DIR}}/coverage.unit.out' > '{{.OUT_DIR}}/coverage.unit.out.tmp' && mv '{{.OUT_DIR}}/coverage.unit.out.tmp' '{{.OUT_DIR}}/coverage.unit.out'

  test/wine:
    desc: "Run the unit tests as windows binaries under Wine (needs wine, curl, unzip)"
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    vars:
      WINE: '{{.WINE | default "wine"}}'
      # Outside the module: the prefix holds a Go toolchain that `go list ./...` would pick up.
      WINEPREFIX: '{{.WINEPREFIX | default (print .HOME "/.cache/ocm/wine")}}'
    env:
      GOOS: windows
      GOARCH: amd64
      WINEDEBUG: -all
      WINEPREFIX: '{{.WINEPREFIX}}'
      # generator/universe tests run `go list` from inside the test binary.
      WINEPATH: 'C:\go\bin'
    cmds:
      - task: build/plugins
        vars: { GOOS: windows, EXE: .exe }
      - mkdir -p "$WINEPREFIX" && {{.WINE}} wineboot -i >/dev/null 2>&1
      - |
        if [ ! -f "$WINEPREFIX/drive_c/go/bin/go.exe" ]; then
          zip="$(mktemp)"
          curl -fsSL -o "$zip" "https://go.dev/dl/$(GOOS= GOARCH= go env GOVERSION).windows-amd64.zip"
          unzip -q "$zip" -d "$WINEPREFIX/drive_c"
          rm -f "$zip"
        fi
      # Keep wineserver and its services up before tests start: services spawned
      # by the first test binary would inherit its stdout and stall `go test`.
      - |
        wineserver="$(dirname "$(command -v {{.WINE}})")/wineserver"
        "$wineserver" -k 2>/dev/null || true
        "$wineserver" -w
        "$wineserver" -p
      - '{{.WINE}} cmd /c exit </dev/null >/dev/null 2>&1'
      - >
        go test -exec '{{.WINE}}' -short -skip "Integration" -count=1
        $(go list ./... | grep -v /integration | grep -v /kubernetes/controller/)
        {{.CLI_ARGS}}

  test/integration:
    dotenv: ['{{.TASKFILE_DIR}}/../../.env']
    set: [errexit]
    cmds:
      # Binary coverage dir: each (re)run appends its own covcounters/covmeta,
      # so a flake that passes on retry does NOT clobber the profile (unlike a
      # single -coverprofile, which gotestsum's final rerun overwrites). Both
      # runs write into it concurrently; file names are unique per process.
      - rm -rf '{{.OUT_DIR}}/coverage.integration.covdir' && mkdir -p '{{.OUT_DIR}}/coverage.integration.covdir'
      # Merge in a defer so a failing package (e.g. the sigstore scaffolding cluster)
      # still yields a profile. Otherwise errexit aborts before the merge and the CI
      # summary reports a full test run as "tests did not run". -args passes gocoverdir
      # to the test binary without fighting gotestsum's flag ordering.
      - defer: |
          go tool covdata textfmt -i='{{.OUT_DIR}}/coverage.integration.covdir' -o '{{.OUT_DIR}}/coverage.integration.out'
          # No coverage collected (every package failed before a test ran) leaves an empty
          # profile. Drop it so the CI summary takes its "tests did not run" path instead
          # of reporting a misleading 0% below the floor.
          if [ ! -s '{{.OUT_DIR}}/coverage.integration.out' ]; then
            rm -f '{{.OUT_DIR}}/coverage.integration.out'
          else
            # Drop generated files (zz_generated.*) so the number reflects hand-written code.
            grep -v 'zz_generated\.' '{{.OUT_DIR}}/coverage.integration.out' > '{{.OUT_DIR}}/coverage.integration.out.tmp' && mv '{{.OUT_DIR}}/coverage.integration.out.tmp' '{{.OUT_DIR}}/coverage.integration.out'
            go tool cover -func='{{.OUT_DIR}}/coverage.integration.out' | tail -1
          fi
      - task: test/integration:run

  test/integration:run:
    internal: true
    vars:
      # -run "Integration" only selects top-level tests whose name contains "Integration".
      # Build and run only the packages that declare one: every other package would still
      # compile a test binary instrumented with -coverpkg=./..., link it, and run nothing.
      INTEGRATION_PKGS:
        sh: go list $(grep -rlE --include='*_test.go' '^func Test[A-Za-z0-9_]*Integration' . | xargs -n1 dirname | sort -u)
      SIGSTORE_PKG:
        sh: go list ./sigstore/integration
      OTHER_PKGS:
        sh: echo "{{.INTEGRATION_PKGS}}" | grep -vxF "{{.SIGSTORE_PKG}}" | tr '\n' ' '
    # Deps run concurrently and Task waits for all of them even if one fails, so both
    # junit reports are complete. Only sigstore/integration needs the scaffolding cluster
    # (~3 min to provision); every other package runs while it comes up.
    deps:
      - task: test/integration:gotestsum
        vars:
          JUNITFILE: '{{.OUT_DIR}}/junit.xml'
          PACKAGES: '{{.OTHER_PKGS}}'
      - task: test/integration:gotestsum
        vars:
          JUNITFILE: '{{.OUT_DIR}}/junit-sigstore.xml'
          PACKAGES: '{{.SIGSTORE_PKG}}'
          # Provisions the cluster, then runs gotestsum with the scaffolding env.
          EXEC: task -d '{{.TASKFILE_DIR}}/sigstore/integration' exec --

  test/integration:gotestsum:
    internal: true
    requires:
      vars: [JUNITFILE, PACKAGES]
    vars:
      # The packages mostly wait on containers, not CPU, so run all of them at once
      # instead of one per CPU.
      PARALLEL: '{{len (splitList " " (trim .PACKAGES))}}'
    cmds:
      # -coverpkg=./... credits library code the flows exercise (the integration
      # packages themselves are near-empty).
      - >
        {{.EXEC}} go run gotest.tools/gotestsum@"${GOTESTSUM_VERSION}"
        --format testname
        --junitfile={{.JUNITFILE}}
        --rerun-fails=2
        --rerun-fails-max-failures=5
        --packages="{{trim .PACKAGES}}"
        -- -p {{.PARALLEL}} -run "Integration" -count=1 -coverpkg=./...
        -args -test.gocoverdir='{{.OUT_DIR}}/coverage.integration.covdir'
