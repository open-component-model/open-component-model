version: '3'

vars:
  INTEGRATION_TEST_IDENTIFIER: 'Integration'
  COSIGN_VERSION:
    sh: . ../signing/handler/internal/.env && echo "$COSIGN_VERSION"
  COSIGN_CHECKSUMS_SHA256:
    sh: . ../signing/handler/internal/.env && echo "$COSIGN_CHECKSUMS_SHA256"
  SCAFFOLDING_VERSION:
    sh: . ./.env && echo "$SCAFFOLDING_VERSION"
  # Absolute paths rooted via TASKFILE_DIR to make any call path (taskfiles in root,
  # bindings/go, or this one) work identically.
  SIGSTORE_ENV_FILE: '{{.TASKFILE_DIR}}/tmp/sigstore-env.sh'
  SIGSTORE_SETUP_LOG: '{{.TASKFILE_DIR}}/tmp/setup.log'
  SIGSTORE_ENV_DIR: '{{.TASKFILE_DIR}}/tmp/sigstore'
  SIGSTORE_BIN_DIR: '{{.TASKFILE_DIR}}/tmp/bin'
  SIGSTORE_BRIDGE_PORT: '8080'
  SIGSTORE_SETUP_DIR: '{{.TASKFILE_DIR}}/tmp/setup'
  SIGSTORE_SETUP_HELPERS: '{{.TASKFILE_DIR}}/hack/setup-helpers.sh'

  # sslip.io is a free public DNS service that maps hostnames like <svc>.<ns>.<ip>.sslip.io
  # to the embedded IP address. Sigstore scaffolding (and other projects like Knative, Rancher, Coolify) use it
  # to give each in-cluster service a unique hostname routable via a single ingress IP.
  # On macOS, /etc/hosts must map these to 127.0.0.1 because kubectl port-forward
  # bypasses real DNS resolution. The scaffolding:hosts task automates this.
  # On Linux, sslip.io public DNS is not relied on: scaffolding:hosts:linux maps the real
  # Kourier load-balancer IP into a managed /etc/hosts block instead.
  SSLIP_HOSTS: |
    127.0.0.1 fulcio.fulcio-system.172.18.255.1.sslip.io
    127.0.0.1 rekor.rekor-system.172.18.255.1.sslip.io
    127.0.0.1 ctlog.ctlog-system.172.18.255.1.sslip.io
    127.0.0.1 tsa.tsa-system.172.18.255.1.sslip.io
    127.0.0.1 tuf.tuf-system.172.18.255.1.sslip.io
    127.0.0.1 gettoken.default.172.18.255.1.sslip.io
    127.0.0.1 registry.local

tasks:
  scaffolding:hosts:
    desc: "Ensure /etc/hosts has sslip.io entries for scaffolding services (macOS only)"
    internal: true
    platforms: [darwin]
    status:
      - grep -q "fulcio.fulcio-system.172.18.255.1.sslip.io" /etc/hosts
      - grep -q "registry.local" /etc/hosts
    cmds:
      - |
        echo "Adding sslip.io entries to /etc/hosts (requires sudo)..."
        echo '{{.SSLIP_HOSTS}}' | grep -v '^$' | while IFS= read -r line; do
          grep -qF "$line" /etc/hosts || echo "$line" | sudo tee -a /etc/hosts
        done

  scaffolding:hosts:linux:
    internal: true
    platforms: [linux]
    cmds:
      - |
        set -euo pipefail
        ip=$(kubectl -n kourier-system get service kourier -ojsonpath='{.status.loadBalancer.ingress[0].ip}')
        hosts=""
        for svc in fulcio/fulcio-system rekor/rekor-system ctlog/ctlog-system tsa/tsa-system tuf/tuf-system gettoken/default; do
          url=$(kubectl -n "${svc#*/}" get ksvc "${svc%/*}" -ojsonpath='{.status.url}')
          host=${url#*://}; host=${host%%/*}; host=${host%%:*}
          [ -n "$host" ] && [ "$host" != "$url" ] || { echo "sigstore setup: incomplete ingress mapping (${svc})" >&2; exit 1; }
          hosts="$hosts $host"
        done
        [ -n "$ip" ] || { echo "sigstore setup: incomplete ingress mapping (kourier ip)" >&2; exit 1; }
        # shellcheck disable=SC2086 # word splitting of hostnames intended
        sudo bash -c '. "$0"; write_scaffolding_hosts /etc/hosts "$@"' '{{.SIGSTORE_SETUP_HELPERS}}' "$ip" $hosts
        # -s files: without it getent falls back to DNS, and sslip.io returns the same IP.
        for host in $hosts; do
          got=$(getent -s files hosts "$host" | awk 'NR==1{print $1}')
          [ "$got" = "$ip" ] || { echo "sigstore setup: hosts mapping not effective for $host (got '${got}')" >&2; exit 1; }
        done
        echo "sigstore setup: mapped$hosts to $ip"

  scaffolding:hosts:clean:
    desc: "Remove scaffolding entries from /etc/hosts (requires sudo)"
    cmds:
      - platforms: [darwin]
        cmd: |
          echo "Removing sslip.io scaffolding entries from /etc/hosts..."
          # Avoid `sed -i`: its in-place flag differs between BSD sed (macOS default) and GNU sed
          # (Homebrew gnubin). Write to a tmp file, then `cp` (not `mv`) back to preserve the
          # original root:wheel ownership and permissions of /etc/hosts.
          tmp=$(mktemp) && sudo sed '/\.172\.18\.255\.1\.sslip\.io/d' /etc/hosts > "$tmp" && sudo cp "$tmp" /etc/hosts && rm "$tmp"
          tmp=$(mktemp) && sudo sed '/registry\.local/d' /etc/hosts > "$tmp" && sudo cp "$tmp" /etc/hosts && rm "$tmp"
      - platforms: [linux]
        cmd: sudo bash -c '. "$0"; remove_scaffolding_hosts /etc/hosts' '{{.SIGSTORE_SETUP_HELPERS}}'

  scaffolding:setup:
    desc: "Create kind cluster and deploy sigstore scaffolding (~5 min, skips if already running)"
    run: once
    deps: [scaffolding:hosts]
    requires:
      vars: [SCAFFOLDING_VERSION]
    preconditions:
      - sh: sed --version 2>&1 | grep -q 'GNU sed'
        msg: "GNU sed is required (macOS ships BSD sed). Install it: brew install gnu-sed, then add $(brew --prefix gnu-sed)/libexec/gnubin to PATH"
      - sh: '! docker ps -a --format "{{`{{.Names}}`}}" 2>/dev/null | grep -q "^registry.local$" || kind get clusters 2>/dev/null | grep -q "^kind$"'
        msg: |
          Orphaned 'registry.local' container found without a cluster. Clean up first:
            task scaffolding:teardown
    status:
      - kubectl -n fulcio-system get ksvc fulcio -ojsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"
      - kubectl -n rekor-system get ksvc rekor -ojsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"
      - kubectl -n ctlog-system get ksvc ctlog -ojsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"
      - kubectl -n tsa-system get ksvc tsa -ojsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"
      - kubectl -n default get ksvc gettoken -ojsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"
    cmds:
      - cmd: |
          if kind get clusters 2>/dev/null | grep -q "^kind$"; then
            echo "Existing cluster is unhealthy, tearing down..."
            kind export kubeconfig 2>/dev/null || true
            task scaffolding:teardown
          fi
      # setup-kind.sh patches (webhook retry, metallb pre-fetch, resource_blaster override) are in hack/prepare-scaffolding.sh
      - bash '{{.TASKFILE_DIR}}/hack/prepare-scaffolding.sh' '{{.SCAFFOLDING_VERSION}}' '{{.SIGSTORE_SETUP_DIR}}'
      - |
        # Fresh work dir: setup-kind.sh appends to ./metallb-crds.yaml, so a reused dir
        # would accumulate duplicate documents across runs.
        rm -rf '{{.SIGSTORE_SETUP_DIR}}/work' && mkdir -p '{{.SIGSTORE_SETUP_DIR}}/work/downloads'
        cd '{{.SIGSTORE_SETUP_DIR}}/work'
        SIGSTORE_SETUP_HELPERS='{{.SIGSTORE_SETUP_HELPERS}}' SIGSTORE_SETUP_DOWNLOADS='{{.SIGSTORE_SETUP_DIR}}/work/downloads' \
          bash '{{.SIGSTORE_SETUP_DIR}}/release/setup-kind.sh'
      - |
        cd '{{.SIGSTORE_SETUP_DIR}}/work'
        bash '{{.SIGSTORE_SETUP_DIR}}/release/setup-scaffolding-from-release.sh' \
          --release-version '{{.SCAFFOLDING_VERSION}}' --release-dir '{{.SIGSTORE_SETUP_DIR}}/release'
      - |
        kubectl create -f '{{.SIGSTORE_SETUP_DIR}}/release/testrelease.yaml'
        kubectl -n default wait --timeout 2m --for=condition=Ready ksvc gettoken

  scaffolding:bridge:
    desc: "Port-forward Kourier ingress to localhost:{{.SIGSTORE_BRIDGE_PORT}} (macOS only)"
    platforms: [darwin]
    deps: [scaffolding:setup]
    status:
      - lsof -ti :{{.SIGSTORE_BRIDGE_PORT}} >/dev/null 2>&1
    cmds:
      - |
        kubectl -n kourier-system port-forward service/kourier-internal {{.SIGSTORE_BRIDGE_PORT}}:80 &
        for i in $(seq 1 20); do
          lsof -ti :{{.SIGSTORE_BRIDGE_PORT}} >/dev/null 2>&1 && break
          sleep 0.5
        done
        lsof -ti :{{.SIGSTORE_BRIDGE_PORT}} >/dev/null 2>&1 || { echo "port-forward failed to start" >&2; exit 1; }

  scaffolding:env:
    desc: "Extract sigstore env vars from running cluster into the SIGSTORE_ENV_FILE"
    deps: [scaffolding:setup, scaffolding:bridge, cosign:install]
    cmds:
      - task: scaffolding:hosts:linux
      - mkdir -p "{{.TASKFILE_DIR}}/tmp" "{{.SIGSTORE_ENV_DIR}}"
      - cmd: PATH="{{.SIGSTORE_BIN_DIR}}:$PATH" SIGSTORE_ENV_DIR="{{.SIGSTORE_ENV_DIR}}" SIGSTORE_BRIDGE_PORT={{.SIGSTORE_BRIDGE_PORT}} bash {{.TASKFILE_DIR}}/hack/extract-sigstore-env.sh > {{.SIGSTORE_ENV_FILE}}
        platforms: [darwin]
      - cmd: PATH="{{.SIGSTORE_BIN_DIR}}:$PATH" SIGSTORE_ENV_DIR="{{.SIGSTORE_ENV_DIR}}" bash {{.TASKFILE_DIR}}/hack/extract-sigstore-env.sh > {{.SIGSTORE_ENV_FILE}}
        platforms: [linux]

  scaffolding:refresh:
    desc: "Re-fetch short-lived OIDC token only (run 'task scaffolding:env' for full re-extraction)"
    deps: [scaffolding:bridge]
    preconditions:
      - sh: test -f {{.SIGSTORE_ENV_FILE}}
        msg: "No env file found. Run 'task scaffolding:env' first."
    cmds:
      - cmd: |
          URL=$(kubectl -n default get ksvc gettoken -ojsonpath='{.status.url}')
          [[ -n "$URL" ]] || { echo "gettoken service not found" >&2; exit 1; }
          URL="${URL%/}:{{.SIGSTORE_BRIDGE_PORT}}"
          TOKEN=$(curl -sSf "$URL")
          [[ -n "$TOKEN" ]] || { echo "empty token from gettoken" >&2; exit 1; }
          # Avoid `sed -i`: its in-place flag differs between BSD sed (macOS default) and GNU
          # sed (Homebrew gnubin). Write to a tmp file and move it back.
          tmp=$(mktemp) && sed "s|^export SIGSTORE_OIDC_TOKEN=.*|export SIGSTORE_OIDC_TOKEN='${TOKEN}'|" {{.SIGSTORE_ENV_FILE}} > "$tmp" && mv "$tmp" {{.SIGSTORE_ENV_FILE}}
          echo "Token refreshed. Re-source: source {{.SIGSTORE_ENV_FILE}}"
        platforms: [darwin]
      - cmd: |
          URL=$(kubectl -n default get ksvc gettoken -ojsonpath='{.status.url}')
          [[ -n "$URL" ]] || { echo "gettoken service not found" >&2; exit 1; }
          TOKEN=$(curl -sSf "$URL")
          [[ -n "$TOKEN" ]] || { echo "empty token from gettoken" >&2; exit 1; }
          sed -i "s|^export SIGSTORE_OIDC_TOKEN=.*|export SIGSTORE_OIDC_TOKEN='${TOKEN}'|" {{.SIGSTORE_ENV_FILE}}
          echo "Token refreshed. Re-source: source {{.SIGSTORE_ENV_FILE}}"
        platforms: [linux]

  cosign:install:
    desc: "Install OCM's FIPS cosign build at the version pinned in signing/handler/internal/.env"
    # Both setup and scaffolding:env depend on this. Parallel runs race on cosign_checksums.txt.
    run: once
    requires:
      vars: [COSIGN_VERSION, COSIGN_CHECKSUMS_SHA256]
    vars:
      BIN: '{{.SIGSTORE_BIN_DIR}}/cosign'
    status:
      - 'test -x "{{.BIN}}" && [ "$(cat "{{.BIN}}.version" 2>/dev/null)" = "{{.COSIGN_VERSION}}" ]'
    cmds:
      - |
        set -euo pipefail
        . '{{.SIGSTORE_SETUP_HELPERS}}'
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in x86_64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; esac
        NAME="cosign-${OS}-${ARCH}"
        BASE="https://github.com/open-component-model/cosign/releases/download/{{.COSIGN_VERSION}}"
        mkdir -p "{{.SIGSTORE_BIN_DIR}}"
        sha256() { (sha256sum "$1" 2>/dev/null || shasum -a 256 "$1") | awk '{print $1}'; }
        SUMS="{{.SIGSTORE_BIN_DIR}}/cosign_checksums.txt"
        download_file "$BASE/cosign_checksums.txt" "$SUMS"
        [ "$(sha256 "$SUMS")" = "{{.COSIGN_CHECKSUMS_SHA256}}" ] || { rm -f "$SUMS"; echo "cosign_checksums.txt does not match COSIGN_CHECKSUMS_SHA256" >&2; exit 1; }
        WANT=$(awk -v n="$NAME" '$2 == n {print $1}' "$SUMS")
        rm -f "$SUMS"
        download_file "$BASE/$NAME" "{{.BIN}}"
        [ -n "$WANT" ] && [ "$WANT" = "$(sha256 "{{.BIN}}")" ] || { rm -f "{{.BIN}}"; echo "cosign checksum mismatch for $NAME" >&2; exit 1; }
        chmod +x "{{.BIN}}"
        echo "{{.COSIGN_VERSION}}" > "{{.BIN}}.version"

  setup:
    desc: "Provision the sigstore scaffolding cluster and write the sourceable env file."
    deps: [scaffolding:env, cosign:install]

  setup:quiet:
    desc: "Run setup with its output in tmp/setup.log, printed only on failure."
    internal: true
    cmds:
      - |
        mkdir -p "$(dirname "{{.SIGSTORE_SETUP_LOG}}")"
        if task -d '{{.TASKFILE_DIR}}' setup > "{{.SIGSTORE_SETUP_LOG}}" 2>&1; then
          echo "sigstore scaffolding ready (log: {{.SIGSTORE_SETUP_LOG}})"
        else
          echo "sigstore scaffolding setup failed:" >&2
          cat "{{.SIGSTORE_SETUP_LOG}}" >&2
          exit 1
        fi

  exec:
    desc: "Provision the scaffolding cluster, then run the command after -- in the caller's directory with cosign on PATH and the sigstore env sourced."
    deps: [setup:quiet]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        export PATH="{{.SIGSTORE_BIN_DIR}}:$PATH"
        . "{{.SIGSTORE_ENV_FILE}}"
        {{.CLI_ARGS}}

  test/integration:
    desc: "Run only the sigstore integration tests against a scaffolding cluster."
    # Convenience target for local development
    deps: [setup]
    set: [errexit]
    cmds:
      - |
        export PATH="{{.SIGSTORE_BIN_DIR}}:$PATH"
        . {{.SIGSTORE_ENV_FILE}}
        go test -count=1 -run "{{.INTEGRATION_TEST_IDENTIFIER}}" -timeout 180s ./...

  scaffolding:diagnostics:
    desc: "Print scaffolding cluster state for debugging a failed setup (best effort, never fails)"
    cmds:
      - |
        K='kubectl --context kind-kind --request-timeout=10s'
        if ! kind get clusters 2>/dev/null | grep -q '^kind$'; then
          echo "sigstore diagnostics: no kind cluster named 'kind'"
          exit 0
        fi
        echo '::group:: Host resources'
        free -m || true
        df -h || true
        docker stats --no-stream || true
        echo '::endgroup::'
        echo '::group:: Nodes'
        $K describe nodes || true
        echo '::endgroup::'
        echo '::group:: Pods'
        $K get pods -A -o wide || true
        echo '::endgroup::'
        echo '::group:: Knative services'
        $K get ksvc,revisions -A || true
        echo '::endgroup::'
        for ns in knative-serving kourier-system metallb-system fulcio-system rekor-system ctlog-system tsa-system tuf-system default; do
          echo "::group:: Events: $ns"
          $K -n "$ns" get events --sort-by=.lastTimestamp || true
          echo '::endgroup::'
        done
        echo '::group:: Fulcio ksvc'
        $K -n fulcio-system describe ksvc fulcio || true
        echo '::endgroup::'
        echo '::group:: Fulcio pods'
        $K -n fulcio-system describe pods || true
        echo '::endgroup::'
        pods=$($K -n fulcio-system get pod -o name 2>/dev/null || true)
        for pod in $pods; do
          echo "::group:: Fulcio logs: $pod"
          $K -n fulcio-system logs "$pod" --all-containers --tail=100 || true
          echo '::endgroup::'
          echo "::group:: Fulcio previous logs: $pod"
          $K -n fulcio-system logs "$pod" --all-containers --tail=100 --previous || true
          echo '::endgroup::'
        done

  scaffolding:teardown:
    desc: "Delete kind cluster and clean up"
    cmds:
      - cmd: "lsof -ti :8080 | xargs kill"
        platforms: [darwin]
        ignore_error: true
      - cmd: kind delete cluster
        ignore_error: true
      - cmd: docker network disconnect kind registry.local
        ignore_error: true
      - cmd: docker rm -f registry.local
        ignore_error: true
      - rm -rf "{{.TASKFILE_DIR}}/tmp"
